name: VP8L meta-Huffman run analysis
on:
  push:
    branches: [analyze-vp8l-meta-final]
    paths: [tools/analyze_vp8l_meta_runs.py, .github/workflows/analyze-vp8l-meta-runs.yml]
permissions: { contents: write }
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: python3 tools/analyze_vp8l_meta_runs.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis-vp8l-meta-runs.md
          git commit -m 'Record VP8L meta-Huffman runs'
          git push origin HEAD:analyze-vp8l-meta-final
