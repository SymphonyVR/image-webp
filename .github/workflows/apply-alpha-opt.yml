name: Temporary shared-luma YUV benchmark

on:
  push:
    branches: [ performance-optimizations ]
    paths:
      - .github/workflows/apply-alpha-opt.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Record baseline and runner CPU
        shell: bash
        run: |
          set -euxo pipefail
          echo "BASELINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          lscpu
          {
            echo "CPU_MODEL=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')"
            echo "CPU_ARCH=$(uname -m)"
            echo "CPU_COUNT=$(nproc)"
          } >> "$GITHUB_ENV"

      - name: Apply shared-luma YUV candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lossy/yuv.rs')
          text = path.read_text()
          old_helpers = '''#[inline(always)]\nfn yuv_to_r(y: u8, v: u8) -> u8 {\n    clip(mulhi(y, 19077) + mulhi(v, 26149) - 14234)\n}\n\n#[inline(always)]\nfn yuv_to_g(y: u8, u: u8, v: u8) -> u8 {\n    clip(mulhi(y, 19077) - mulhi(u, 6419) - mulhi(v, 13320) + 8708)\n}\n\n#[inline(always)]\nfn yuv_to_b(y: u8, u: u8) -> u8 {\n    clip(mulhi(y, 19077) + mulhi(u, 33050) - 17685)\n}\n'''
          new_helpers = '''#[inline(always)]\nfn yuv_to_r_from_luma(y: i32, v: u8) -> u8 {\n    clip(y + mulhi(v, 26149) - 14234)\n}\n\n#[inline(always)]\nfn yuv_to_g_from_luma(y: i32, u: u8, v: u8) -> u8 {\n    clip(y - mulhi(u, 6419) - mulhi(v, 13320) + 8708)\n}\n\n#[inline(always)]\nfn yuv_to_b_from_luma(y: i32, u: u8) -> u8 {\n    clip(y + mulhi(u, 33050) - 17685)\n}\n\n#[inline(always)]\nfn yuv_to_r(y: u8, v: u8) -> u8 {\n    yuv_to_r_from_luma(mulhi(y, 19077), v)\n}\n\n#[inline(always)]\nfn yuv_to_g(y: u8, u: u8, v: u8) -> u8 {\n    yuv_to_g_from_luma(mulhi(y, 19077), u, v)\n}\n\n#[inline(always)]\nfn yuv_to_b(y: u8, u: u8) -> u8 {\n    yuv_to_b_from_luma(mulhi(y, 19077), u)\n}\n'''
          if old_helpers not in text:
              raise SystemExit('YUV helper block not found')
          text = text.replace(old_helpers, new_helpers, 1)

          old_pixel = '''#[inline]\nfn set_pixel(rgb: &mut [u8], y: u8, u: u8, v: u8) {\n    rgb[0] = yuv_to_r(y, v);\n    rgb[1] = yuv_to_g(y, u, v);\n    rgb[2] = yuv_to_b(y, u);\n}\n'''
          new_pixel = '''#[inline]\nfn set_pixel(rgb: &mut [u8], y: u8, u: u8, v: u8) {\n    let luma = mulhi(y, 19077);\n    rgb[0] = yuv_to_r_from_luma(luma, v);\n    rgb[1] = yuv_to_g_from_luma(luma, u, v);\n    rgb[2] = yuv_to_b_from_luma(luma, u);\n}\n'''
          if old_pixel not in text:
              raise SystemExit('set_pixel block not found')
          path.write_text(text.replace(old_pixel, new_pixel, 1))
          PY
          cargo fmt
          git diff --check
          git diff -- src/lossy/yuv.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/lossy/yuv.rs
          git commit -m 'Reuse luma term across YUV channels'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify candidate
        shell: bash
        run: |
          set -euxo pipefail
          cargo test -v
          cargo doc -v
          cargo clippy --all-features -- -D warnings
          cargo fmt -- --check

      - name: Prepare controlled worktrees
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          git worktree add --detach /tmp/webp-main origin/main
          git worktree add --detach /tmp/webp-base "$BASELINE_SHA"
          git worktree add --detach /tmp/webp-candidate HEAD

          cat >/tmp/decode_bench.rs <<'RS'
          use image_webp::{DecodingError, WebPDecoder};
          use std::hint::black_box;
          use std::io::Cursor;
          use std::time::Instant;

          fn decode_once(data: &[u8]) -> u64 {
              let mut decoder = WebPDecoder::new(Cursor::new(data)).unwrap();
              let mut buf = vec![0; decoder.output_buffer_size().unwrap()];
              let mut checksum = 0u64;
              if decoder.is_animated() {
                  loop {
                      match decoder.read_frame(&mut buf) {
                          Ok(duration) => {
                              checksum = checksum.wrapping_add(u64::from(duration));
                              if let Some(&byte) = buf.get(buf.len() / 2) {
                                  checksum = checksum.wrapping_add(u64::from(byte));
                              }
                          }
                          Err(DecodingError::NoMoreFrames) => break,
                          Err(err) => panic!("decode failed: {err:?}"),
                      }
                  }
              } else {
                  decoder.read_image(&mut buf).unwrap();
                  if let Some(&byte) = buf.get(buf.len() / 2) {
                      checksum = checksum.wrapping_add(u64::from(byte));
                  }
              }
              black_box(checksum)
          }

          fn main() {
              let mut args = std::env::args().skip(1);
              let path = args.next().unwrap();
              let iterations: usize = args.next().unwrap().parse().unwrap();
              let warmups: usize = args.next().unwrap().parse().unwrap();
              let data = std::fs::read(path).unwrap();
              for _ in 0..warmups {
                  black_box(decode_once(&data));
              }
              let start = Instant::now();
              let mut sum = 0u64;
              for _ in 0..iterations {
                  sum = sum.wrapping_add(decode_once(&data));
              }
              black_box(sum);
              println!("{:.3}", start.elapsed().as_secs_f64() * 1_000_000.0 / iterations as f64);
          }
          RS

          for dir in /tmp/webp-main /tmp/webp-base /tmp/webp-candidate; do
            mkdir -p "$dir/examples"
            cp /tmp/decode_bench.rs "$dir/examples/decode_bench.rs"
            (cd "$dir" && RUSTFLAGS='-C target-cpu=native' cargo build --release --example decode_bench)
          done

      - name: Fetch issue 119 workload
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/issue119
          curl -L --fail --retry 3 -o /tmp/sample.zip https://github.com/user-attachments/files/17482915/sample.zip
          unzip -q /tmp/sample.zip -d /tmp/issue119
          ISSUE119_FILE="$(find /tmp/issue119 -type f -iname '*.webp' | head -n 1)"
          test -n "$ISSUE119_FILE"
          echo "ISSUE119_FILE=$ISSUE119_FILE" >> "$GITHUB_ENV"

      - name: Run rotating benchmarks
        shell: bash
        run: |
          set -euxo pipefail
          MAIN=/tmp/webp-main/target/release/examples/decode_bench
          BASE=/tmp/webp-base/target/release/examples/decode_bench
          CAND=/tmp/webp-candidate/target/release/examples/decode_bench
          RANDOM_FILE="$GITHUB_WORKSPACE/tests/images/animated/random_lossless.webp"
          : > /tmp/results-yuv.tsv

          for bin in "$MAIN" "$BASE" "$CAND"; do
            taskset -c 0 "$bin" "$RANDOM_FILE" 200 10 >/dev/null
            taskset -c 0 "$bin" "$ISSUE119_FILE" 1 1 >/dev/null
          done

          for round in 1 2 3 4 5 6 7; do
            case $((round % 3)) in
              1) order="main baseline candidate" ;;
              2) order="baseline candidate main" ;;
              0) order="candidate main baseline" ;;
            esac
            for variant in $order; do
              case "$variant" in
                main) bin="$MAIN" ;;
                baseline) bin="$BASE" ;;
                candidate) bin="$CAND" ;;
              esac
              value="$(taskset -c 0 "$bin" "$RANDOM_FILE" 1000 0)"
              printf 'random_lossless\t%s\t%s\t%s\n' "$round" "$variant" "$value" >> /tmp/results-yuv.tsv
              value="$(taskset -c 0 "$bin" "$ISSUE119_FILE" 3 0)"
              printf 'issue119\t%s\t%s\t%s\n' "$round" "$variant" "$value" >> /tmp/results-yuv.tsv
            done
          done
          cat /tmp/results-yuv.tsv

      - name: Persist benchmark without candidate source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import csv, os, statistics, pathlib, subprocess

          rows = list(csv.reader(open('/tmp/results-yuv.tsv'), delimiter='\t'))
          by_workload = {}
          by_round = {}
          for workload, round_no, variant, value in rows:
              value = float(value)
              by_workload.setdefault((workload, variant), []).append(value)
              by_round.setdefault((workload, int(round_no)), {})[variant] = value

          med = lambda w, v: statistics.median(by_workload[(w, v)])
          paired = lambda w: statistics.median([
              vals['baseline'] / vals['candidate']
              for (workload, _), vals in by_round.items()
              if workload == w
          ])
          main_sha = subprocess.check_output(['git', '-C', '/tmp/webp-main', 'rev-parse', 'HEAD'], text=True).strip()
          lines = [
              '# Shared-luma YUV benchmark', '',
              f'- main: `{main_sha}`',
              f'- branch baseline: `{os.environ["BASELINE_SHA"]}`',
              f'- ephemeral shared-luma candidate: `{os.environ["CANDIDATE_SHA"]}`',
              f'- CPU: `{os.environ.get("CPU_MODEL", "unknown")}`',
              f'- architecture / vCPUs: `{os.environ.get("CPU_ARCH", "unknown")}` / `{os.environ.get("CPU_COUNT", "unknown")}`',
              '- candidate source is intentionally not retained on the branch pending benchmark review',
              '- runner: `ubuntu-latest`, release, `-C target-cpu=native`, pinned to CPU 0',
              '- method: 7 rotating-order rounds; paired speedup is the median baseline/candidate ratio per round', '',
              '| Workload | main median | baseline median | candidate median | candidate vs baseline | paired speedup |',
              '|---|---:|---:|---:|---:|---:|',
          ]
          for workload in ['random_lossless', 'issue119']:
              mm, bm, cm = med(workload, 'main'), med(workload, 'baseline'), med(workload, 'candidate')
              lines.append(f'| {workload} | {mm:.3f} us | {bm:.3f} us | {cm:.3f} us | {bm/cm:.3f}x | {paired(workload):.3f}x |')
          lines += ['', '## Raw samples', '', '```tsv', 'workload\tround\tvariant\tus_per_decode']
          lines += ['\t'.join(row) for row in rows]
          lines += ['```', '']
          pathlib.Path('/tmp/benchmark-yuv-shared-luma.md').write_text('\n'.join(lines))
          PY

          git reset --hard "$BASELINE_SHA"
          cp /tmp/benchmark-yuv-shared-luma.md benchmark-yuv-shared-luma.md
          git add -- benchmark-yuv-shared-luma.md
          git commit -m 'Record shared-luma YUV benchmark'
          git push origin HEAD:performance-optimizations
