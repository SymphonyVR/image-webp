name: Specialized VP8 DCT benchmark v2
on:
  push:
    branches: [ bench-dct-token-specialized ]
    paths: [ .github/workflows/bench-dct-token-specialized-v2.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply verified candidate
        shell: bash
        run: |
          set -euxo pipefail
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossy/arithmetic_decoder.rs'); s=p.read_text()
          m='''    // This is generic and inlined just to skip the first bounds check.\n    #[inline]\n    pub(crate) fn read_with_tree<const N: usize>(&mut self, tree: &[TreeNode; N]) -> BitResult<i8> {\n'''
          a='''    #[inline(never)]\n    pub(crate) fn read_dct_token(&mut self, tree: &[TreeNode; 11], skip_eob: bool) -> BitResult<i8> {\n        if let Some(v) = self.fast().read_dct_token(tree, skip_eob) { return BitResult::ok(v); }\n        self.cold_read_with_tree(tree, skip_eob as usize)\n    }\n\n'''+m
          if m not in s: raise SystemExit('public marker'); s=s.replace(m,a,1)
          m='''    fn read_with_tree(mut self, tree: &[TreeNode], first_node: TreeNode) -> Option<i8> {\n'''
          a='''    fn read_dct_token(mut self, tree: &[TreeNode; 11], skip_eob: bool) -> Option<i8> {\n        let value=self.fast_read_dct_token(tree, skip_eob); self.commit_if_valid(value)\n    }\n\n'''+m
          if m not in s: raise SystemExit('wrapper marker'); s=s.replace(m,a,1)
          m='''    fn fast_read_with_tree(&mut self, tree: &[TreeNode], mut node: TreeNode) -> i8 {\n'''
          a='''    fn fast_read_dct_token(&mut self, tree: &[TreeNode; 11], skip_eob: bool) -> i8 {\n        if !skip_eob && !self.fast_read_bit(tree[0].prob) { return TreeNode::value_from_branch(tree[0].left); }\n        if !self.fast_read_bit(tree[1].prob) { return TreeNode::value_from_branch(tree[1].left); }\n        if !self.fast_read_bit(tree[2].prob) { return TreeNode::value_from_branch(tree[2].left); }\n        if !self.fast_read_bit(tree[3].prob) {\n            if !self.fast_read_bit(tree[4].prob) { return TreeNode::value_from_branch(tree[4].left); }\n            let n=tree[5]; return TreeNode::value_from_branch(if self.fast_read_bit(n.prob){n.right}else{n.left});\n        }\n        if !self.fast_read_bit(tree[6].prob) { let n=tree[7]; return TreeNode::value_from_branch(if self.fast_read_bit(n.prob){n.right}else{n.left}); }\n        if !self.fast_read_bit(tree[8].prob) { let n=tree[9]; return TreeNode::value_from_branch(if self.fast_read_bit(n.prob){n.right}else{n.left}); }\n        let n=tree[10]; TreeNode::value_from_branch(if self.fast_read_bit(n.prob){n.right}else{n.left})\n    }\n\n'''+m
          if m not in s: raise SystemExit('fast marker'); p.write_text(s.replace(m,a,1))
          p=Path('src/lossy/mod.rs'); s=p.read_text()
          old='''            let token = decoder\n                .read_with_tree_with_first_node(tree, tree[skip as usize])\n                .or_accumulate(&mut res);\n'''
          if old not in s: raise SystemExit('call marker')
          p.write_text(s.replace(old,'''            let token = decoder.read_dct_token(tree, skip).or_accumulate(&mut res);\n''',1))
          PY
          cargo fmt
          git add src/lossy/arithmetic_decoder.rs src/lossy/mod.rs
          git commit -m 'Specialize VP8 coefficient token tree decoding'
          echo "CAND=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build A/B and decoder harness
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/base "$BASE"
          git worktree add --detach /tmp/cand "$CAND"
          cat >/tmp/bench.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder}; use std::{hint::black_box,io::Cursor,time::Instant};
          fn one(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut s=0u64;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{s=s.wrapping_add(t as u64);for &z in b.iter().step_by(4096){s=s.wrapping_mul(16777619)^z as u64;}},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("decode: {e:?}")}}}else{x.read_image(&mut b).unwrap();for &z in b.iter().step_by(4096){s=s.wrapping_mul(16777619)^z as u64;}}black_box(s)}
          fn main(){let mut a=std::env::args().skip(1);let p=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let w:usize=a.next().unwrap().parse().unwrap();let d=std::fs::read(p).unwrap();for _ in 0..w{black_box(one(&d));}let t=Instant::now();let mut s=0u64;for _ in 0..n{s^=one(&d);}black_box(s);println!("{:.3}\t{}",t.elapsed().as_secs_f64()*1e6/n as f64,s)}
          RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/bench.rs "$d/examples/bench.rs";(cd "$d"&&cargo build --release --example bench);done
      - name: Fetch and verify fixtures
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/119 /tmp/136
          curl -L --fail --retry 5 -o /tmp/119.zip https://github.com/user-attachments/files/17482915/sample.zip; unzip -q /tmp/119.zip -d /tmp/119
          curl -L --fail --retry 5 -o /tmp/136.zip https://github.com/user-attachments/files/20597234/honk.webp.zip; unzip -q /tmp/136.zip -d /tmp/136
          I119=$(find /tmp/119 -type f -iname '*.webp'|head -n1); I136=$(find /tmp/136 -type f -iname '*.webp'|head -n1)
          echo "I119=$I119" >> "$GITHUB_ENV"; echo "I136=$I136" >> "$GITHUB_ENV"
          B=/tmp/base/target/release/examples/bench; C=/tmp/cand/target/release/examples/bench
          b=$($B "$I119" 1 0 | cut -f2); c=$($C "$I119" 1 0 | cut -f2); test "$b" = "$c"
          b=$($B "$I136" 1 0 | cut -f2); c=$($C "$I136" 1 0 | cut -f2); test "$b" = "$c"
      - name: Benchmark
        shell: bash
        run: |
          set -euxo pipefail
          B=/tmp/base/target/release/examples/bench; C=/tmp/cand/target/release/examples/bench; : >/tmp/r.tsv
          for r in {1..9};do if ((r%2));then o='base cand';else o='cand base';fi;for v in $o;do [[ $v == base ]]&&x=$B||x=$C;a=$(taskset -c 0 "$x" "$I119" 3 0|cut -f1);printf 'issue119\t%s\t%s\t%s\n' "$r" "$v" "$a">>/tmp/r.tsv;a=$(taskset -c 0 "$x" "$I136" 16 0|cut -f1);printf 'issue136\t%s\t%s\t%s\n' "$r" "$v" "$a">>/tmp/r.tsv;done;done
      - name: Persist
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import csv,os,statistics,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:x=float(x);g.setdefault((w,v),[]).append(x);rr.setdefault((w,int(r)),{})[v]=x
          L=['# Specialized VP8 DCT token benchmark v2','',f'- baseline: `{os.environ["BASE"]}`',f'- candidate: `{os.environ["CAND"]}`',f'- CPU: `{os.environ["CPU"]}`','- verified output checksums; safe Rust; normal release target','','| Workload | baseline | candidate | ratio | paired median | range |','|---|---:|---:|---:|---:|---:|']
          for w in ('issue119','issue136'):
            b=statistics.median(g[w,'base']);c=statistics.median(g[w,'cand']);p=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {b:.3f} us | {c:.3f} us | {b/c:.3f}x | {statistics.median(p):.3f}x | {min(p):.3f}–{max(p):.3f}x |')
          pathlib.Path('/tmp/out.md').write_text('\n'.join(L+['','```tsv']+['\t'.join(x) for x in rows]+['```','']))
          PY
          git reset --hard "$BASE";cp /tmp/out.md benchmark-dct-token-specialized-v2.md;git add benchmark-dct-token-specialized-v2.md;git commit -m 'Record specialized VP8 DCT benchmark v2';git push origin HEAD:bench-dct-token-specialized
