name: Fixed-ref coefficient cross-runner benchmark
on:
  push:
    branches: [ bench-libwebp-fixed-matrix ]
    paths: [ .github/workflows/bench-fixed-coeff-matrix.yml ]
permissions:
  contents: write
jobs:
  bench:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build fixed refs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/out
          lscpu | sed -n 's/^Model name:[[:space:]]*//p' > /tmp/out/cpu-${{ matrix.slot }}.txt
          git worktree add --detach /tmp/base 915e24eb765a4cf5e29cf5e797cc28ac71d041ba
          git worktree add --detach /tmp/cand 13448c6a17180ee9939154b052dd70b44cd1729c
          cat >/tmp/b.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder};use std::{hint::black_box,io::Cursor,time::Instant};
          #[inline]fn hb(mut h:u64,b:u8)->u64{h^=b as u64;h.wrapping_mul(1099511628211)}
          fn hash(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut h=1469598103934665603u64;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{for z in t.to_le_bytes(){h=hb(h,z)}for &z in &b{h=hb(h,z)}},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();for &z in &b{h=hb(h,z)}}h}
          fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut s=0u64;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{let m=b.len()/2;s=s.wrapping_add(t as u64)^b[0]as u64^((b[m]as u64)<<8)^((b[b.len()-1]as u64)<<16)},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();let m=b.len()/2;s=b[0]as u64^((b[m]as u64)<<8)^((b[b.len()-1]as u64)<<16)}black_box(s)}
          fn main(){let mut a=std::env::args().skip(1);let mode=a.next().unwrap();let p=a.next().unwrap();let d=std::fs::read(p).unwrap();if mode=="hash"{println!("{:016x}",hash(&d));return}let n:usize=a.next().unwrap().parse().unwrap();black_box(dec(&d));let t=Instant::now();let mut s=0;for _ in 0..n{s^=dec(&d)}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64)}
          RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/b.rs "$d/examples/fixed_coeff.rs";(cd "$d"&&RUSTFLAGS='-C target-cpu=native' cargo build --release --example fixed_coeff);done
      - name: Validate and benchmark issue119
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/119;curl -L --fail --retry 5 -o /tmp/a.zip https://github.com/user-attachments/files/17482915/sample.zip;unzip -q /tmp/a.zip -d /tmp/119
          I=$(find /tmp/119 -iname '*.webp'|head -n1);B=/tmp/base/target/release/examples/fixed_coeff;C=/tmp/cand/target/release/examples/fixed_coeff
          HB=$($B hash "$I");HC=$($C hash "$I");test "$HB" = "$HC";echo "$HB" >/tmp/out/hash-${{ matrix.slot }}.txt;: >/tmp/out/result-${{ matrix.slot }}.tsv
          for r in {1..9};do if ((r%2));then o='base cand';else o='cand base';fi;for v in $o;do [[ $v == base ]]&&x=$B||x=$C;u=$(taskset -c 0 "$x" bench "$I" 3);printf '%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/out/result-${{ matrix.slot }}.tsv;done;done
      - uses: actions/upload-artifact@v4
        with:
          name: slot-${{ matrix.slot }}
          path: /tmp/out/*
  aggregate:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          pattern: slot-*
          path: /tmp/results
          merge-multiple: true
      - name: Persist
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          import pathlib,statistics
          root=pathlib.Path('/tmp/results');L=['# Fixed-ref libwebp-style coefficient cross-runner benchmark','','- baseline: `915e24eb765a4cf5e29cf5e797cc28ac71d041ba`','- candidate: `13448c6a17180ee9939154b052dd70b44cd1729c`','- issue119; full-output hash equality checked on every runner','- release `target-cpu=native`; CPU 0; 9 alternating paired rounds','', '| Runner | CPU | baseline median | candidate median | paired median | range |','|---:|---|---:|---:|---:|---:|'];allp=[]
          for i in range(1,5):
              cpu=(root/f'cpu-{i}.txt').read_text().strip();rows=[]
              for line in (root/f'result-{i}.tsv').read_text().splitlines():r,v,x=line.split('\t');rows.append((int(r),v,float(x)))
              b=[x for _,v,x in rows if v=='base'];c=[x for _,v,x in rows if v=='cand'];pairs={}
              for r,v,x in rows:pairs.setdefault(r,{})[v]=x
              p=[z['base']/z['cand'] for _,z in sorted(pairs.items())];allp+=p
              L.append(f'| {i} | {cpu} | {statistics.median(b):.3f} us | {statistics.median(c):.3f} us | {statistics.median(p):.3f}x | {min(p):.3f}–{max(p):.3f}x |')
          L+=['',f'- aggregate paired median: **{statistics.median(allp):.3f}x**',f'- aggregate range: **{min(allp):.3f}–{max(allp):.3f}x**']
          pathlib.Path('benchmark-fixed-coeff-matrix.md').write_text('\n'.join(L)+'\n')
          PY
          git add benchmark-fixed-coeff-matrix.md;git commit -m 'Record fixed-ref coefficient matrix';git push origin HEAD:bench-libwebp-fixed-matrix