name: Libwebp-style VP8 coefficient benchmark v2
on:
  push:
    branches: [ bench-libwebp-coeff-direct-v2 ]
    paths: [ .github/workflows/bench-libwebp-coeff-direct-v2.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply verified candidate
        shell: bash
        run: |
          set -euxo pipefail
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          curl -L --fail -o /tmp/ref.yml https://raw.githubusercontent.com/SymphonyVR/image-webp/9c133b5ccbc8b6cf0298b378d98751e7292a5767/.github/workflows/bench-libwebp-coeff-structure.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/ref.yml').read_text(); key="          python3 - <<'PY'\n"
          a=text.index(key)+len(key); b=text.index("\n          PY\n",a)
          body='\n'.join(x[10:] if x.startswith('          ') else x for x in text[a:b].splitlines())
          Path('/tmp/apply.py').write_text(body+'\n')
          PY
          python3 /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossy/arithmetic_decoder.rs');s=p.read_text()
          for dead in ('''    // Do not inline this because inlining seems to worsen performance.\n    #[inline(never)]\n    pub(crate) fn read_sign(&mut self) -> BitResult<bool> {\n        if let Some(b) = self.fast().read_sign() {\n            return BitResult::ok(b);\n        }\n\n        self.cold_read_flag()\n    }\n\n''','''    fn read_sign(mut self) -> Option<bool> {\n        let value = self.fast_read_sign();\n        self.commit_if_valid(value)\n    }\n\n'''):
              if dead not in s: raise SystemExit('obsolete sign wrapper missing')
              s=s.replace(dead,'',1)
          p.write_text(s)
          PY
          cargo fmt; git diff --check
          git add src/lossy/mod.rs src/lossy/arithmetic_decoder.rs
          git commit -m 'Decode VP8 coefficients with libwebp-style structure'
          echo "CAND=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify
        shell: bash
        run: |
          set -euxo pipefail
          cargo test -v
          cargo clippy --all-features -- -D warnings
          cargo fmt -- --check
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 build -v
      - name: Build A/B
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/base "$BASE"; git worktree add --detach /tmp/cand "$CAND"
          cat >/tmp/b.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder};
          use std::{hint::black_box,io::Cursor,time::Instant};
          #[inline] fn hb(mut h:u64,b:u8)->u64{h^=b as u64;h.wrapping_mul(1099511628211)}
          fn full_hash(data:&[u8])->u64{
            let mut d=WebPDecoder::new(Cursor::new(data)).unwrap();let mut b=vec![0;d.output_buffer_size().unwrap()];let mut h=1469598103934665603u64;
            if d.is_animated(){loop{match d.read_frame(&mut b){Ok(t)=>{for z in t.to_le_bytes(){h=hb(h,z)}for &z in &b{h=hb(h,z)}},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{d.read_image(&mut b).unwrap();for &z in &b{h=hb(h,z)}}h
          }
          fn decode(data:&[u8])->u64{
            let mut d=WebPDecoder::new(Cursor::new(data)).unwrap();let mut b=vec![0;d.output_buffer_size().unwrap()];let mut s=0u64;
            if d.is_animated(){loop{match d.read_frame(&mut b){Ok(t)=>{let m=b.len()/2;s=s.wrapping_add(t as u64)^b[0]as u64^((b[m]as u64)<<8)^((b[b.len()-1]as u64)<<16);},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{d.read_image(&mut b).unwrap();let m=b.len()/2;s=b[0]as u64^((b[m]as u64)<<8)^((b[b.len()-1]as u64)<<16);}black_box(s)
          }
          fn main(){let mut a=std::env::args().skip(1);let mode=a.next().unwrap();let p=a.next().unwrap();let data=std::fs::read(p).unwrap();if mode=="hash"{println!("{:016x}",full_hash(&data));return;}let n:usize=a.next().unwrap().parse().unwrap();let w:usize=a.next().unwrap().parse().unwrap();for _ in 0..w{black_box(decode(&data));}let t=Instant::now();let mut s=0;for _ in 0..n{s^=decode(&data)};black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64);}
          RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/b.rs "$d/examples/coeff_v2.rs";(cd "$d"&&RUSTFLAGS='-C target-cpu=native' cargo build --release --example coeff_v2);done
      - name: Validate and benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/119 /tmp/136
          curl -L --fail --retry 5 -o /tmp/a.zip https://github.com/user-attachments/files/17482915/sample.zip;unzip -q /tmp/a.zip -d /tmp/119
          curl -L --fail --retry 5 -o /tmp/b.zip https://github.com/user-attachments/files/20597234/honk.webp.zip;unzip -q /tmp/b.zip -d /tmp/136
          I119=$(find /tmp/119 -iname '*.webp'|head -n1);I136=$(find /tmp/136 -iname '*.webp'|head -n1);B=/tmp/base/target/release/examples/coeff_v2;C=/tmp/cand/target/release/examples/coeff_v2
          H119=$($B hash "$I119");test "$H119" = "$($C hash "$I119")";H136=$($B hash "$I136");test "$H136" = "$($C hash "$I136")"
          echo "HASH119=$H119" >> "$GITHUB_ENV";echo "HASH136=$H136" >> "$GITHUB_ENV";: >/tmp/r.tsv
          for r in {1..13};do if ((r%2));then o='base cand';else o='cand base';fi;for v in $o;do [[ $v == base ]]&&x=$B||x=$C;u=$(taskset -c 0 "$x" bench "$I119" 3 0);printf 'issue119\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$x" bench "$I136" 20 0);printf 'issue136\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
      - name: Persist
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import csv,os,statistics,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:x=float(x);g.setdefault((w,v),[]).append(x);rr.setdefault((w,int(r)),{})[v]=x
          L=['# Libwebp-style VP8 coefficient benchmark v2','',f'- baseline: `{os.environ["BASE"]}`',f'- candidate: `{os.environ["CAND"]}`',f'- CPU: `{os.environ["CPU"]}`','- full-output hashes verified outside timed region',f'- issue119 hash: `{os.environ["HASH119"]}`',f'- issue136 hash: `{os.environ["HASH136"]}`','','| Workload | baseline | candidate | ratio | paired median | range |','|---|---:|---:|---:|---:|---:|']
          for w in ('issue119','issue136'):
            b=statistics.median(g[w,'base']);c=statistics.median(g[w,'cand']);p=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {b:.3f} us | {c:.3f} us | {b/c:.3f}x | {statistics.median(p):.3f}x | {min(p):.3f}–{max(p):.3f}x |')
          pathlib.Path('/tmp/out.md').write_text('\n'.join(L+['','```tsv']+['\t'.join(r) for r in rows]+['```','']))
          PY
          git reset --hard "$BASE";cp /tmp/out.md benchmark-libwebp-coeff-direct-v2.md;git add benchmark-libwebp-coeff-direct-v2.md;git commit -m 'Record libwebp-style coefficient benchmark v2';git push origin HEAD:bench-libwebp-coeff-direct-v2