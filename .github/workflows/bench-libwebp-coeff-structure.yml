name: Temporary libwebp-style VP8 coefficient benchmark
on:
  push:
    branches: [ bench-dct-value-fused-v2 ]
    paths: [ .github/workflows/bench-libwebp-coeff-structure.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply libwebp-style coefficient candidate
        shell: bash
        run: |
          set -euxo pipefail
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/lossy/mod.rs')
          s = p.read_text()
          block = '''type TokenProbTreeNodes = [[[[TreeNode; NUM_DCT_TOKENS - 1]; 3]; 8]; 4];\n\nconst COEFF_PROB_NODES: TokenProbTreeNodes = {\n    let mut output = [[[[TreeNode::UNINIT; 11]; 3]; 8]; 4];\n    let mut i = 0;\n    while i < output.len() {\n        let mut j = 0;\n        while j < output[i].len() {\n            let mut k = 0;\n            while k < output[i][j].len() {\n                output[i][j][k] = tree_nodes_from(DCT_TOKEN_TREE, COEFF_PROBS[i][j][k]);\n                k += 1;\n            }\n            j += 1;\n        }\n        i += 1;\n    }\n    output\n};\n\n'''
          if block not in s:
              raise SystemExit('coefficient node table block missing')
          s = s.replace(block, '', 1)
          s = s.replace('use arithmetic_decoder::ArithmeticDecoder;', 'use arithmetic_decoder::{ArithmeticDecoder, DCT_VALUE_EOB};', 1)
          replacements = [
              ('token_probs: Box<TokenProbTreeNodes>,', 'token_probs: Box<TokenProbTables>,'),
              ('token_probs: Box::new(COEFF_PROB_NODES),', 'token_probs: Box::new(COEFF_PROBS),'),
              ('self.token_probs[i][j][k][t].prob = v;', 'self.token_probs[i][j][k][t] = v;'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing marker: {old}')
              s = s.replace(old, new, 1)

          start = s.index('    fn read_coefficients(\n')
          end = s.index('    fn read_residual_data(\n', start)
          replacement = '''    fn read_coefficients(\n        &mut self,\n        block: &mut [i32; 16],\n        p: usize,\n        plane: Plane,\n        complexity: usize,\n        dcq: i16,\n        acq: i16,\n    ) -> Result<bool, DecodingError> {\n        assert!(complexity <= 2);\n\n        let first_coeff = if plane == Plane::YCoeff1 { 1usize } else { 0usize };\n        let probs = &self.token_probs[plane as usize];\n        let decoder = &mut self.partitions[p];\n        let mut res = decoder.start_accumulated_result();\n        let mut complexity = complexity;\n        let mut has_coefficients = false;\n        let mut skip_eob = false;\n\n        for i in first_coeff..16usize {\n            let band = COEFF_BANDS[i] as usize;\n            let probs = &probs[band][complexity];\n            let value = decoder\n                .read_dct_value(probs, skip_eob)\n                .or_accumulate(&mut res);\n\n            if value == DCT_VALUE_EOB {\n                break;\n            }\n            if value == 0 {\n                skip_eob = true;\n                has_coefficients = true;\n                complexity = 0;\n                continue;\n            }\n\n            skip_eob = false;\n            complexity = if value.unsigned_abs() == 1 { 1 } else { 2 };\n            let zigzag = ZIGZAG[i] as usize;\n            block[zigzag] =\n                i32::from(value) * i32::from(if zigzag > 0 { acq } else { dcq });\n            has_coefficients = true;\n        }\n\n        decoder.check(res, has_coefficients)\n    }\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          p = Path('src/lossy/arithmetic_decoder.rs')
          s = p.read_text()
          old = 'use super::TreeNode;'
          new = '''use super::{\n    common::{DCT_CAT_BASE, PROB_DCT_CAT},\n    TreeNode,\n};\n\npub(crate) const DCT_VALUE_EOB: i16 = i16::MIN;'''
          if old not in s:
              raise SystemExit('arithmetic decoder import marker missing')
          s = s.replace(old, new, 1)

          marker = '    // This is generic and inlined just to skip the first bounds check.\n'
          method = '''    #[inline(never)]\n    pub(crate) fn read_dct_value(&mut self, probs: &[u8; 11], skip_eob: bool) -> BitResult<i16> {\n        if let Some(value) = self.fast().read_dct_value(probs, skip_eob) {\n            return BitResult::ok(value);\n        }\n        self.cold_read_dct_value(probs, skip_eob)\n    }\n\n'''
          if marker not in s:
              raise SystemExit('public tree marker missing')
          s = s.replace(marker, method + marker, 1)

          marker = '    fn read_with_tree(mut self, tree: &[TreeNode], first_node: TreeNode) -> Option<i8> {\n'
          method = '''    fn read_dct_value(mut self, probs: &[u8; 11], skip_eob: bool) -> Option<i16> {\n        let value = self.fast_read_dct_value(probs, skip_eob);\n        self.commit_if_valid(value)\n    }\n\n'''
          if marker not in s:
              raise SystemExit('fast wrapper marker missing')
          s = s.replace(marker, method + marker, 1)

          marker = '    #[cold]\n    #[inline(never)]\n    fn cold_read_with_tree(&mut self, tree: &[TreeNode], start: usize) -> BitResult<i8> {\n'
          cold = '''    #[cold]\n    #[inline(never)]\n    fn cold_read_dct_value(&mut self, probs: &[u8; 11], skip_eob: bool) -> BitResult<i16> {\n        let mut res = self.start_accumulated_result();\n        if !skip_eob && !self.cold_read_bit(probs[0]).or_accumulate(&mut res) {\n            return self.keep_accumulating(res, DCT_VALUE_EOB);\n        }\n        if !self.cold_read_bit(probs[1]).or_accumulate(&mut res) {\n            return self.keep_accumulating(res, 0);\n        }\n\n        let abs = if !self.cold_read_bit(probs[2]).or_accumulate(&mut res) {\n            1i16\n        } else if !self.cold_read_bit(probs[3]).or_accumulate(&mut res) {\n            if !self.cold_read_bit(probs[4]).or_accumulate(&mut res) {\n                2\n            } else {\n                3 + if self.cold_read_bit(probs[5]).or_accumulate(&mut res) { 1 } else { 0 }\n            }\n        } else if !self.cold_read_bit(probs[6]).or_accumulate(&mut res) {\n            if !self.cold_read_bit(probs[7]).or_accumulate(&mut res) {\n                5 + if self.cold_read_bit(PROB_DCT_CAT[0][0]).or_accumulate(&mut res) { 1 } else { 0 }\n            } else {\n                7 + 2 * if self.cold_read_bit(PROB_DCT_CAT[1][0]).or_accumulate(&mut res) { 1 } else { 0 }\n                    + if self.cold_read_bit(PROB_DCT_CAT[1][1]).or_accumulate(&mut res) { 1 } else { 0 }\n            }\n        } else {\n            let hi = self.cold_read_bit(probs[8]).or_accumulate(&mut res);\n            let lo = self.cold_read_bit(probs[9 + usize::from(hi)]).or_accumulate(&mut res);\n            let cat = 2 + 2 * usize::from(hi) + usize::from(lo);\n            let mut extra = 0i16;\n            for prob in PROB_DCT_CAT[cat].iter().copied() {\n                if prob == 0 {\n                    break;\n                }\n                extra = extra + extra + if self.cold_read_bit(prob).or_accumulate(&mut res) { 1 } else { 0 };\n            }\n            i16::from(DCT_CAT_BASE[cat]) + extra\n        };\n\n        let signed = if self.cold_read_flag().or_accumulate(&mut res) { -abs } else { abs };\n        self.keep_accumulating(res, signed)\n    }\n\n'''
          if marker not in s:
              raise SystemExit('cold tree marker missing')
          s = s.replace(marker, cold + marker, 1)

          marker = '    fn fast_read_with_tree(&mut self, tree: &[TreeNode], mut node: TreeNode) -> i8 {\n'
          fast = '''    fn fast_read_dct_value(&mut self, probs: &[u8; 11], skip_eob: bool) -> i16 {\n        if !skip_eob && !self.fast_read_bit(probs[0]) {\n            return DCT_VALUE_EOB;\n        }\n        if !self.fast_read_bit(probs[1]) {\n            return 0;\n        }\n\n        let abs = if !self.fast_read_bit(probs[2]) {\n            1i16\n        } else if !self.fast_read_bit(probs[3]) {\n            if !self.fast_read_bit(probs[4]) {\n                2\n            } else {\n                3 + if self.fast_read_bit(probs[5]) { 1 } else { 0 }\n            }\n        } else if !self.fast_read_bit(probs[6]) {\n            if !self.fast_read_bit(probs[7]) {\n                5 + if self.fast_read_bit(PROB_DCT_CAT[0][0]) { 1 } else { 0 }\n            } else {\n                7 + 2 * if self.fast_read_bit(PROB_DCT_CAT[1][0]) { 1 } else { 0 }\n                    + if self.fast_read_bit(PROB_DCT_CAT[1][1]) { 1 } else { 0 }\n            }\n        } else {\n            let hi = self.fast_read_bit(probs[8]);\n            let lo = self.fast_read_bit(probs[9 + usize::from(hi)]);\n            let cat = 2 + 2 * usize::from(hi) + usize::from(lo);\n            let mut extra = 0i16;\n            for prob in PROB_DCT_CAT[cat].iter().copied() {\n                if prob == 0 {\n                    break;\n                }\n                extra = extra + extra + if self.fast_read_bit(prob) { 1 } else { 0 };\n            }\n            i16::from(DCT_CAT_BASE[cat]) + extra\n        };\n\n        if self.fast_read_sign() { -abs } else { abs }\n    }\n\n'''
          if marker not in s:
              raise SystemExit('fast tree marker missing')
          s = s.replace(marker, fast + marker, 1)
          p.write_text(s)
          PY
          cargo fmt
          git diff --check
          git add src/lossy/mod.rs src/lossy/arithmetic_decoder.rs
          git commit -m 'Decode VP8 coefficients with fixed libwebp-style topology'
          echo "CAND=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify candidate
        shell: bash
        run: |
          set -euxo pipefail
          cargo test -v
          cargo doc -v
          cargo clippy --all-features -- -D warnings
          cargo fmt -- --check
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 build -v
      - name: Build baseline and candidate
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/base "$BASE"
          git worktree add --detach /tmp/cand "$CAND"
          cat >/tmp/bench.rs <<'RS'
          use image_webp::{DecodingError, WebPDecoder};
          use std::{hint::black_box, io::Cursor, time::Instant};
          fn hash_byte(mut h: u64, b: u8) -> u64 { h ^= u64::from(b); h.wrapping_mul(1099511628211) }
          fn decode(data: &[u8]) -> u64 {
              let mut d = WebPDecoder::new(Cursor::new(data)).unwrap();
              let mut buf = vec![0; d.output_buffer_size().unwrap()];
              let mut h = 1469598103934665603u64;
              if d.is_animated() {
                  loop {
                      match d.read_frame(&mut buf) {
                          Ok(ts) => {
                              for b in ts.to_le_bytes() { h = hash_byte(h, b); }
                              for &b in &buf { h = hash_byte(h, b); }
                          }
                          Err(DecodingError::NoMoreFrames) => break,
                          Err(e) => panic!("{e:?}"),
                      }
                  }
              } else {
                  d.read_image(&mut buf).unwrap();
                  for &b in &buf { h = hash_byte(h, b); }
              }
              black_box(h)
          }
          fn main() {
              let mut args = std::env::args().skip(1);
              let path = args.next().unwrap();
              let iters: usize = args.next().unwrap().parse().unwrap();
              let warm: usize = args.next().unwrap().parse().unwrap();
              let data = std::fs::read(path).unwrap();
              for _ in 0..warm { black_box(decode(&data)); }
              let start = Instant::now();
              let mut hash = 0u64;
              for _ in 0..iters { hash ^= decode(&data); }
              let us = start.elapsed().as_secs_f64() * 1e6 / iters as f64;
              println!("{us:.3}\t{hash:016x}");
          }
          RS
          for dir in /tmp/base /tmp/cand; do
            mkdir -p "$dir/examples"
            cp /tmp/bench.rs "$dir/examples/libwebp_coeff_bench.rs"
            (cd "$dir" && RUSTFLAGS='-C target-cpu=native' cargo build --release --example libwebp_coeff_bench)
          done
      - name: Fetch and validate fixtures
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/119 /tmp/136
          curl -L --fail --retry 5 -o /tmp/119.zip https://github.com/user-attachments/files/17482915/sample.zip
          unzip -q /tmp/119.zip -d /tmp/119
          curl -L --fail --retry 5 -o /tmp/136.zip https://github.com/user-attachments/files/20597234/honk.webp.zip
          unzip -q /tmp/136.zip -d /tmp/136
          echo "I119=$(find /tmp/119 -iname '*.webp' | head -n1)" >> "$GITHUB_ENV"
          echo "I136=$(find /tmp/136 -iname '*.webp' | head -n1)" >> "$GITHUB_ENV"
      - name: Validate exact output hashes and benchmark
        shell: bash
        run: |
          set -euxo pipefail
          B=/tmp/base/target/release/examples/libwebp_coeff_bench
          C=/tmp/cand/target/release/examples/libwebp_coeff_bench
          BH119=$(taskset -c 0 "$B" "$I119" 1 0 | cut -f2)
          CH119=$(taskset -c 0 "$C" "$I119" 1 0 | cut -f2)
          BH136=$(taskset -c 0 "$B" "$I136" 1 0 | cut -f2)
          CH136=$(taskset -c 0 "$C" "$I136" 1 0 | cut -f2)
          test "$BH119" = "$CH119"
          test "$BH136" = "$CH136"
          echo "HASH119=$BH119" >> "$GITHUB_ENV"
          echo "HASH136=$BH136" >> "$GITHUB_ENV"
          : >/tmp/results.tsv
          for round in {1..11}; do
            if (( round % 2 )); then order='base cand'; else order='cand base'; fi
            for variant in $order; do
              if [[ $variant == base ]]; then exe=$B; else exe=$C; fi
              us=$(taskset -c 0 "$exe" "$I119" 3 0 | cut -f1)
              printf 'issue119\t%s\t%s\t%s\n' "$round" "$variant" "$us" >>/tmp/results.tsv
              us=$(taskset -c 0 "$exe" "$I136" 16 0 | cut -f1)
              printf 'issue136\t%s\t%s\t%s\n' "$round" "$variant" "$us" >>/tmp/results.tsv
            done
          done
      - name: Persist result
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import csv, os, statistics, pathlib
          rows=list(csv.reader(open('/tmp/results.tsv'), delimiter='\t'))
          grouped={}; paired={}
          for workload, rnd, variant, value in rows:
              value=float(value)
              grouped.setdefault((workload,variant),[]).append(value)
              paired.setdefault((workload,int(rnd)),{})[variant]=value
          out=[
              '# Libwebp-style VP8 coefficient structure benchmark','',
              f'- baseline: `{os.environ["BASE"]}`',
              f'- candidate: `{os.environ["CAND"]}`',
              f'- CPU: `{os.environ["CPU"]}`',
              '- candidate mirrors libwebp coefficient structure: fixed DCT topology, compact probability rows, value/category/sign decoded in one speculative transaction',
              '- full decoded output hash must match baseline before timing',
              f'- issue119 output hash: `{os.environ["HASH119"]}`',
              f'- issue136 output hash: `{os.environ["HASH136"]}`','',
              '| Workload | baseline | candidate | median ratio | paired median | paired range |',
              '|---|---:|---:|---:|---:|---:|'
          ]
          for workload in ('issue119','issue136'):
              b=statistics.median(grouped[workload,'base'])
              c=statistics.median(grouped[workload,'cand'])
              ratios=[]
              for (w,_), pair in sorted(paired.items()):
                  if w==workload: ratios.append(pair['base']/pair['cand'])
              out.append(f'| {workload} | {b:.3f} us | {c:.3f} us | {b/c:.3f}x | {statistics.median(ratios):.3f}x | {min(ratios):.3f}–{max(ratios):.3f}x |')
          out += ['', '```tsv', 'workload\tround\tvariant\tus'] + ['\t'.join(r) for r in rows] + ['```','']
          pathlib.Path('/tmp/result.md').write_text('\n'.join(out))
          PY
          git reset --hard "$BASE"
          cp /tmp/result.md benchmark-libwebp-coeff-structure.md
          git add benchmark-libwebp-coeff-structure.md
          git commit -m 'Record libwebp-style VP8 coefficient benchmark'
          git push origin HEAD:bench-dct-value-fused-v2