name: Incremental libwebp-style VP8 zero-run benchmark
on:
  push:
    branches: [ bench-libwebp-zero-run ]
    paths: [ .github/workflows/bench-libwebp-zero-run.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply libwebp-style base
        shell: bash
        run: |
          set -euxo pipefail
          echo "ROOT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          curl -L --fail -o /tmp/ref.yml https://raw.githubusercontent.com/SymphonyVR/image-webp/9c133b5ccbc8b6cf0298b378d98751e7292a5767/.github/workflows/bench-libwebp-coeff-structure.yml
          python3 - <<'PY'
          from pathlib import Path
          t=Path('/tmp/ref.yml').read_text();k="          python3 - <<'PY'\n";a=t.index(k)+len(k);b=t.index("\n          PY\n",a);Path('/tmp/apply.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in t[a:b].splitlines())+'\n')
          PY
          python3 /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossy/arithmetic_decoder.rs');s=p.read_text()
          for d in ('''    // Do not inline this because inlining seems to worsen performance.\n    #[inline(never)]\n    pub(crate) fn read_sign(&mut self) -> BitResult<bool> {\n        if let Some(b) = self.fast().read_sign() {\n            return BitResult::ok(b);\n        }\n\n        self.cold_read_flag()\n    }\n\n''','''    fn read_sign(mut self) -> Option<bool> {\n        let value = self.fast_read_sign();\n        self.commit_if_valid(value)\n    }\n\n'''):
              if d not in s: raise SystemExit('dead sign wrapper missing')
              s=s.replace(d,'',1)
          p.write_text(s)
          PY
          cargo fmt;git add src/lossy/mod.rs src/lossy/arithmetic_decoder.rs;git commit -m 'Apply libwebp-style coefficient structure';echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Apply zero-run fusion
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossy/arithmetic_decoder.rs');s=p.read_text()
          old='common::{DCT_CAT_BASE, PROB_DCT_CAT}'
          if old not in s: raise SystemExit('common import marker missing')
          s=s.replace(old,'common::{COEFF_BANDS, DCT_CAT_BASE, PROB_DCT_CAT}',1)
          marker='''    #[inline(never)]\n    pub(crate) fn read_dct_value('''
          method='''    #[inline(never)]\n    pub(crate) fn read_dct_run(\n        &mut self,\n        probs: &[[[u8; 11]; 3]; 8],\n        start: usize,\n        complexity: usize,\n    ) -> BitResult<(u8, i16, bool)> {\n        if let Some(value) = self.fast().read_dct_run(probs, start, complexity) {\n            return BitResult::ok(value);\n        }\n        self.cold_read_dct_run(probs, start, complexity)\n    }\n\n'''
          if marker not in s: raise SystemExit('public dct marker missing')
          s=s.replace(marker,method+marker,1)
          marker='''    fn read_dct_value(mut self, probs: &[u8; 11], skip_eob: bool) -> Option<i16> {'''
          method='''    fn read_dct_run(\n        mut self,\n        probs: &[[[u8; 11]; 3]; 8],\n        start: usize,\n        complexity: usize,\n    ) -> Option<(u8, i16, bool)> {\n        let value = self.fast_read_dct_run(probs, start, complexity);\n        self.commit_if_valid(value)\n    }\n\n'''
          if marker not in s: raise SystemExit('fast wrapper marker missing')
          s=s.replace(marker,method+marker,1)
          marker='''    #[cold]\n    #[inline(never)]\n    fn cold_read_dct_value('''
          cold='''    #[cold]\n    #[inline(never)]\n    fn cold_read_dct_run(\n        &mut self,\n        probs: &[[[u8; 11]; 3]; 8],\n        start: usize,\n        complexity: usize,\n    ) -> BitResult<(u8, i16, bool)> {\n        let mut res = self.start_accumulated_result();\n        let mut i = start;\n        let mut p = &probs[COEFF_BANDS[i] as usize][complexity];\n        if !self.cold_read_bit(p[0]).or_accumulate(&mut res) {\n            return self.keep_accumulating(res, (i as u8, DCT_VALUE_EOB, false));\n        }\n        let mut had_zero = false;\n        while !self.cold_read_bit(p[1]).or_accumulate(&mut res) {\n            had_zero = true;\n            i += 1;\n            if i == 16 {\n                return self.keep_accumulating(res, (16, 0, true));\n            }\n            p = &probs[COEFF_BANDS[i] as usize][0];\n        }\n        let abs = if !self.cold_read_bit(p[2]).or_accumulate(&mut res) {\n            1i16\n        } else if !self.cold_read_bit(p[3]).or_accumulate(&mut res) {\n            if !self.cold_read_bit(p[4]).or_accumulate(&mut res) { 2 } else { 3 + i16::from(self.cold_read_bit(p[5]).or_accumulate(&mut res)) }\n        } else if !self.cold_read_bit(p[6]).or_accumulate(&mut res) {\n            if !self.cold_read_bit(p[7]).or_accumulate(&mut res) {\n                5 + i16::from(self.cold_read_bit(PROB_DCT_CAT[0][0]).or_accumulate(&mut res))\n            } else {\n                7 + 2 * i16::from(self.cold_read_bit(PROB_DCT_CAT[1][0]).or_accumulate(&mut res)) + i16::from(self.cold_read_bit(PROB_DCT_CAT[1][1]).or_accumulate(&mut res))\n            }\n        } else {\n            let hi = self.cold_read_bit(p[8]).or_accumulate(&mut res);\n            let lo = self.cold_read_bit(p[9 + usize::from(hi)]).or_accumulate(&mut res);\n            let cat = 2 + 2 * usize::from(hi) + usize::from(lo);\n            let mut extra = 0i16;\n            for prob in PROB_DCT_CAT[cat].iter().copied() {\n                if prob == 0 { break; }\n                extra = extra + extra + i16::from(self.cold_read_bit(prob).or_accumulate(&mut res));\n            }\n            i16::from(DCT_CAT_BASE[cat]) + extra\n        };\n        let value = if self.cold_read_flag().or_accumulate(&mut res) { -abs } else { abs };\n        self.keep_accumulating(res, (i as u8, value, had_zero))\n    }\n\n'''
          if marker not in s: raise SystemExit('cold dct marker missing')
          s=s.replace(marker,cold+marker,1)
          marker='''    fn fast_read_dct_value(&mut self, probs: &[u8; 11], skip_eob: bool) -> i16 {'''
          fast='''    fn fast_read_dct_run(\n        &mut self,\n        probs: &[[[u8; 11]; 3]; 8],\n        start: usize,\n        complexity: usize,\n    ) -> (u8, i16, bool) {\n        let mut i = start;\n        let mut p = &probs[COEFF_BANDS[i] as usize][complexity];\n        if !self.fast_read_bit(p[0]) {\n            return (i as u8, DCT_VALUE_EOB, false);\n        }\n        let mut had_zero = false;\n        while !self.fast_read_bit(p[1]) {\n            had_zero = true;\n            i += 1;\n            if i == 16 { return (16, 0, true); }\n            p = &probs[COEFF_BANDS[i] as usize][0];\n        }\n        let abs = if !self.fast_read_bit(p[2]) {\n            1i16\n        } else if !self.fast_read_bit(p[3]) {\n            if !self.fast_read_bit(p[4]) { 2 } else { 3 + i16::from(self.fast_read_bit(p[5])) }\n        } else if !self.fast_read_bit(p[6]) {\n            if !self.fast_read_bit(p[7]) {\n                5 + i16::from(self.fast_read_bit(PROB_DCT_CAT[0][0]))\n            } else {\n                7 + 2 * i16::from(self.fast_read_bit(PROB_DCT_CAT[1][0])) + i16::from(self.fast_read_bit(PROB_DCT_CAT[1][1]))\n            }\n        } else {\n            let hi = self.fast_read_bit(p[8]);\n            let lo = self.fast_read_bit(p[9 + usize::from(hi)]);\n            let cat = 2 + 2 * usize::from(hi) + usize::from(lo);\n            let mut extra = 0i16;\n            for prob in PROB_DCT_CAT[cat].iter().copied() {\n                if prob == 0 { break; }\n                extra = extra + extra + i16::from(self.fast_read_bit(prob));\n            }\n            i16::from(DCT_CAT_BASE[cat]) + extra\n        };\n        let value = if self.fast_read_sign() { -abs } else { abs };\n        (i as u8, value, had_zero)\n    }\n\n'''
          if marker not in s: raise SystemExit('fast dct marker missing')
          s=s.replace(marker,fast+marker,1)
          p.write_text(s)

          p=Path('src/lossy/mod.rs');s=p.read_text();a=s.index('    fn read_coefficients(\n');b=s.index('    fn read_residual_data(\n',a)
          repl='''    fn read_coefficients(\n        &mut self, block: &mut [i32; 16], p: usize, plane: Plane, complexity: usize, dcq: i16, acq: i16,\n    ) -> Result<bool, DecodingError> {\n        assert!(complexity <= 2);\n        let first_coeff = if plane == Plane::YCoeff1 { 1usize } else { 0usize };\n        let probs = &self.token_probs[plane as usize];\n        let decoder = &mut self.partitions[p];\n        let mut res = decoder.start_accumulated_result();\n        let mut complexity = complexity;\n        let mut has_coefficients = false;\n        let mut i = first_coeff;\n        while i < 16 {\n            let (coeff_index, value, had_zero) = decoder.read_dct_run(probs, i, complexity).or_accumulate(&mut res);\n            has_coefficients |= had_zero;\n            if value == DCT_VALUE_EOB { break; }\n            let coeff_index = usize::from(coeff_index);\n            if coeff_index >= 16 { break; }\n            debug_assert_ne!(value, 0);\n            complexity = if value.unsigned_abs() == 1 { 1 } else { 2 };\n            let zigzag = ZIGZAG[coeff_index] as usize;\n            block[zigzag] = i32::from(value) * i32::from(if zigzag > 0 { acq } else { dcq });\n            has_coefficients = true;\n            i = coeff_index + 1;\n        }\n        decoder.check(res, has_coefficients)\n    }\n\n'''
          p.write_text(s[:a]+repl+s[b:])
          PY
          cargo fmt;git diff --check;cargo test -v;cargo clippy --all-features -- -D warnings;git add src/lossy/arithmetic_decoder.rs src/lossy/mod.rs;git commit -m 'Fuse VP8 coefficient zero runs';echo "CAND=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build and benchmark
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/base "$BASE";git worktree add --detach /tmp/cand "$CAND"
          cat >/tmp/b.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder};use std::{hint::black_box,io::Cursor,time::Instant};
          #[inline]fn hb(mut h:u64,b:u8)->u64{h^=b as u64;h.wrapping_mul(1099511628211)}
          fn hash(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut h=1469598103934665603u64;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{for z in t.to_le_bytes(){h=hb(h,z)}for &z in &b{h=hb(h,z)}},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();for &z in &b{h=hb(h,z)}}h}
          fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut s=0;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{let m=b.len()/2;s=s.wrapping_add(t as u64)^b[0]as u64^((b[m]as u64)<<8)},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();s=b[b.len()/2]as u64}black_box(s)}
          fn main(){let mut a=std::env::args().skip(1);let mode=a.next().unwrap();let p=a.next().unwrap();let d=std::fs::read(p).unwrap();if mode=="hash"{println!("{:016x}",hash(&d));return}let n:usize=a.next().unwrap().parse().unwrap();let t=Instant::now();let mut s=0;for _ in 0..n{s^=dec(&d)}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64)}
          RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/b.rs "$d/examples/zero_run.rs";(cd "$d"&&RUSTFLAGS='-C target-cpu=native' cargo build --release --example zero_run);done
          mkdir -p /tmp/119 /tmp/136;curl -L --fail --retry 5 -o /tmp/a.zip https://github.com/user-attachments/files/17482915/sample.zip;unzip -q /tmp/a.zip -d /tmp/119;curl -L --fail --retry 5 -o /tmp/b.zip https://github.com/user-attachments/files/20597234/honk.webp.zip;unzip -q /tmp/b.zip -d /tmp/136;I119=$(find /tmp/119 -iname '*.webp'|head -n1);I136=$(find /tmp/136 -iname '*.webp'|head -n1);B=/tmp/base/target/release/examples/zero_run;C=/tmp/cand/target/release/examples/zero_run;H119=$($B hash "$I119");test "$H119" = "$($C hash "$I119")";H136=$($B hash "$I136");test "$H136" = "$($C hash "$I136")";: >/tmp/r.tsv
          for r in {1..11};do if ((r%2));then o='base cand';else o='cand base';fi;for v in $o;do [[ $v == base ]]&&x=$B||x=$C;u=$(taskset -c 0 "$x" bench "$I119" 3);printf 'issue119\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$x" bench "$I136" 20);printf 'issue136\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
      - name: Persist
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import csv,os,statistics,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:x=float(x);g.setdefault((w,v),[]).append(x);rr.setdefault((w,int(r)),{})[v]=x
          L=['# Incremental libwebp-style zero-run benchmark','',f'- CPU: `{os.environ["CPU"]}`','- baseline already includes fixed topology/raw probabilities/category+sign fusion','','| Workload | baseline | zero-run | ratio | paired median | range |','|---|---:|---:|---:|---:|---:|']
          for w in ('issue119','issue136'):
            b=statistics.median(g[w,'base']);c=statistics.median(g[w,'cand']);p=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {b:.3f} us | {c:.3f} us | {b/c:.3f}x | {statistics.median(p):.3f}x | {min(p):.3f}–{max(p):.3f}x |')
          pathlib.Path('/tmp/o.md').write_text('\n'.join(L+['','```tsv']+['\t'.join(r) for r in rows]+['```','']))
          PY
          git reset --hard "$ROOT";cp /tmp/o.md benchmark-libwebp-zero-run.md;git add benchmark-libwebp-zero-run.md;git commit -m 'Record zero-run coefficient benchmark';git push origin HEAD:bench-libwebp-zero-run