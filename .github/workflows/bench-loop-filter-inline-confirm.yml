name: Confirm horizontal loop-filter inlining
on:
  push:
    branches: [ bench-loop-filter-inline-confirm ]
    paths: [ .github/workflows/bench-loop-filter-inline-confirm.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          set -euxo pipefail
          BASE=13448c6a17180ee9939154b052dd70b44cd1729c; CAND=523bfb1778b7338c2b6a468cf8f4a8ba3441bf31
          echo "BASE=$BASE" >> "$GITHUB_ENV"; echo "CAND=$CAND" >> "$GITHUB_ENV"; echo "CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE"; git worktree add --detach /tmp/cand "$CAND"
          cat >/tmp/bench.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder};use std::{hint::black_box,io::Cursor,time::Instant};fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut s=0;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{let m=b.len()/2;s^=t as u64^b[0]as u64^((b[m]as u64)<<8)},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();s=b[b.len()/2]as u64}black_box(s)}fn main(){let mut a=std::env::args().skip(1);let p=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let d=std::fs::read(p).unwrap();black_box(dec(&d));let t=Instant::now();let mut s=0;for _ in 0..n{s^=dec(&d)}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64)}
          RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/bench.rs "$d/examples/c.rs";(cd "$d"&&RUSTFLAGS='-C target-cpu=native' cargo build --release --example c);done
          mkdir -p /tmp/119 /tmp/136;curl -L --fail --retry 5 -o /tmp/a.zip https://github.com/user-attachments/files/17482915/sample.zip;unzip -q /tmp/a.zip -d /tmp/119;curl -L --fail --retry 5 -o /tmp/b.zip https://github.com/user-attachments/files/20597234/honk.webp.zip;unzip -q /tmp/b.zip -d /tmp/136
          I119=$(find /tmp/119 -iname '*.webp'|head -n1);I136=$(find /tmp/136 -iname '*.webp'|head -n1);B=/tmp/base/target/release/examples/c;C=/tmp/cand/target/release/examples/c;:>/tmp/r.tsv
          for r in {1..21};do if ((r%2));then o='base cand';else o='cand base';fi;for v in $o;do [[ $v == base ]]&&x=$B||x=$C;u=$(taskset -c 0 "$x" "$I119" 5);printf 'issue119\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$x" "$I136" 50);printf 'issue136\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
      - shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          import csv,os,statistics,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:x=float(x);g.setdefault((w,v),[]).append(x);rr.setdefault((w,int(r)),{})[v]=x
          L=['# Horizontal loop-filter inline confirmation','',f'- baseline: `{os.environ["BASE"]}`',f'- candidate: `{os.environ["CAND"]}`',f'- CPU: `{os.environ["CPU"]}`','','| Workload | baseline | candidate | paired median | range |','|---|---:|---:|---:|---:|']
          for w in ('issue119','issue136'):
            b=statistics.median(g[w,'base']);c=statistics.median(g[w,'cand']);p=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {b:.3f} us | {c:.3f} us | {statistics.median(p):.4f}x | {min(p):.4f}–{max(p):.4f}x |')
          pathlib.Path('benchmark-loop-filter-inline-confirm.md').write_text('\n'.join(L+['']))
          PY
          git add benchmark-loop-filter-inline-confirm.md;git commit -m 'Confirm horizontal loop-filter inline benchmark';git push origin HEAD:bench-loop-filter-inline-confirm
