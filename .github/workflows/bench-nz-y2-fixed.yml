name: Fixed-ref Y2 extent benchmark
on:
  push:
    branches: [ bench-libwebp-nz-y2-fixed ]
    paths: [ .github/workflows/bench-nz-y2-fixed.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build fixed refs
        shell: bash
        run: |
          set -euxo pipefail
          echo "CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base 13448c6a17180ee9939154b052dd70b44cd1729c
          git worktree add --detach /tmp/cand 14f163a9d2b1e6a7c34d33259bb78311e6fe3ef4
          cat >/tmp/b.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder};use std::{hint::black_box,io::Cursor,time::Instant};
          #[inline]fn hb(mut h:u64,b:u8)->u64{h^=b as u64;h.wrapping_mul(1099511628211)}
          fn hash(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut h=1469598103934665603u64;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{for z in t.to_le_bytes(){h=hb(h,z)}for &z in &b{h=hb(h,z)}},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();for &z in &b{h=hb(h,z)}}h}
          fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut s=0u64;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{let m=b.len()/2;s=s.wrapping_add(t as u64)^b[0]as u64^((b[m]as u64)<<8)^((b[b.len()-1]as u64)<<16)},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();let m=b.len()/2;s=b[0]as u64^((b[m]as u64)<<8)^((b[b.len()-1]as u64)<<16)}black_box(s)}
          fn main(){let mut a=std::env::args().skip(1);let mode=a.next().unwrap();let p=a.next().unwrap();let d=std::fs::read(p).unwrap();if mode=="hash"{println!("{:016x}",hash(&d));return}let n:usize=a.next().unwrap().parse().unwrap();black_box(dec(&d));let t=Instant::now();let mut s=0;for _ in 0..n{s^=dec(&d)}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64)}
          RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/b.rs "$d/examples/nz_y2_fixed.rs";(cd "$d"&&RUSTFLAGS='-C target-cpu=native' cargo build --release --example nz_y2_fixed);done
      - name: Validate and benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/119 /tmp/136;curl -L --fail --retry 5 -o /tmp/a.zip https://github.com/user-attachments/files/17482915/sample.zip;unzip -q /tmp/a.zip -d /tmp/119;curl -L --fail --retry 5 -o /tmp/b.zip https://github.com/user-attachments/files/20597234/honk.webp.zip;unzip -q /tmp/b.zip -d /tmp/136
          I119=$(find /tmp/119 -iname '*.webp'|head -n1);I136=$(find /tmp/136 -iname '*.webp'|head -n1);B=/tmp/base/target/release/examples/nz_y2_fixed;C=/tmp/cand/target/release/examples/nz_y2_fixed
          test "$($B hash "$I119")" = "$($C hash "$I119")";test "$($B hash "$I136")" = "$($C hash "$I136")";: >/tmp/r.tsv
          for r in {1..13};do if ((r%2));then o='base cand';else o='cand base';fi;for v in $o;do [[ $v == base ]]&&x=$B||x=$C;u=$(taskset -c 0 "$x" bench "$I119" 3);printf 'issue119\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$x" bench "$I136" 20);printf 'issue136\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
      - name: Persist
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          import csv,os,statistics,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:x=float(x);g.setdefault((w,v),[]).append(x);rr.setdefault((w,int(r)),{})[v]=x
          L=['# Fixed-ref Y2 extent benchmark','', '- baseline: `13448c6a17180ee9939154b052dd70b44cd1729c`','- candidate: `14f163a9d2b1e6a7c34d33259bb78311e6fe3ef4`',f'- CPU: `{os.environ["CPU"]}`','- full-output hashes match outside timed region','','| Workload | baseline | candidate | speedup | paired median | range |','|---|---:|---:|---:|---:|---:|']
          for w in ('issue119','issue136'):
              a=statistics.median(g[w,'base']);b=statistics.median(g[w,'cand']);p=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {a:.3f} us | {b:.3f} us | {a/b:.3f}x | {statistics.median(p):.3f}x | {min(p):.3f}–{max(p):.3f}x |')
          pathlib.Path('benchmark-nz-y2-fixed.md').write_text('\n'.join(L)+'\n')
          PY
          git add benchmark-nz-y2-fixed.md;git commit -m 'Record fixed Y2 extent benchmark';git push origin HEAD:bench-libwebp-nz-y2-fixed