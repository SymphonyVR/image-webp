name: Temporary VP8 range normalization benchmark
on:
  push:
    branches: [ bench-range-normalize ]
    paths: [ .github/workflows/bench-range-normalize.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Record environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "BASELINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CPU_MODEL=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Apply candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossy/arithmetic_decoder.rs'); s=p.read_text()
          old='let shift = range.leading_zeros().saturating_sub(24);'
          new='let shift = range.leading_zeros() - 24;'
          if s.count(old) != 1: raise SystemExit(f'expected one pattern, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt
          git diff --check
          git add src/lossy/arithmetic_decoder.rs
          git commit -m 'Use VP8 range invariant during normalization'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify
        shell: bash
        run: |
          set -euxo pipefail
          cargo test -v
          cargo clippy --all-features -- -D warnings
          cargo fmt -- --check
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 build -v
      - name: Build A/B
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/base "$BASELINE_SHA"
          git worktree add --detach /tmp/cand "$CANDIDATE_SHA"
          cat >/tmp/b.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder}; use std::{hint::black_box,io::Cursor,time::Instant};
          fn one(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut s=0u64;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>s=s.wrapping_add(t as u64).wrapping_add(b[b.len()/2]as u64),Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();s=b[b.len()/2]as u64}black_box(s)}
          fn main(){let mut a=std::env::args().skip(1);let p=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let w:usize=a.next().unwrap().parse().unwrap();let d=std::fs::read(p).unwrap();for _ in 0..w{black_box(one(&d));}let t=Instant::now();let mut s=0;for _ in 0..n{s^=one(&d);}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64)}
          RS
          for d in /tmp/base /tmp/cand; do mkdir -p "$d/examples"; cp /tmp/b.rs "$d/examples/b.rs"; (cd "$d" && cargo build --release --example b); done
      - name: Fixtures
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/119 /tmp/136
          curl -L --fail --retry 3 -o /tmp/119.zip https://github.com/user-attachments/files/17482915/sample.zip; unzip -q /tmp/119.zip -d /tmp/119
          curl -L --fail --retry 3 -o /tmp/136.zip https://github.com/user-attachments/files/20597234/honk.webp.zip; unzip -q /tmp/136.zip -d /tmp/136
          echo "I119=$(find /tmp/119 -iname '*.webp' | head -n1)" >> "$GITHUB_ENV"
          echo "I136=$(find /tmp/136 -iname '*.webp' | head -n1)" >> "$GITHUB_ENV"
      - name: Benchmark
        shell: bash
        run: |
          set -euxo pipefail
          B=/tmp/base/target/release/examples/b; C=/tmp/cand/target/release/examples/b; : >/tmp/r.tsv
          taskset -c 0 "$B" "$I119" 1 1 >/dev/null; taskset -c 0 "$C" "$I119" 1 1 >/dev/null
          for r in {1..11}; do if ((r%2));then o='baseline candidate';else o='candidate baseline';fi;for v in $o;do [[ $v == baseline ]]&&x=$B||x=$C; a=$(taskset -c 0 "$x" "$I119" 3 0); printf 'issue119\t%s\t%s\t%s\n' "$r" "$v" "$a">>/tmp/r.tsv; a=$(taskset -c 0 "$x" "$I136" 20 0); printf 'issue136\t%s\t%s\t%s\n' "$r" "$v" "$a">>/tmp/r.tsv;done;done
      - name: Persist
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import csv,os,statistics,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:x=float(x);g.setdefault((w,v),[]).append(x);rr.setdefault((w,int(r)),{})[v]=x
          L=['# VP8 range normalization benchmark','',f'- baseline: `{os.environ["BASELINE_SHA"]}`',f'- candidate: `{os.environ["CANDIDATE_SHA"]}`',f'- CPU: `{os.environ.get("CPU_MODEL")}`','- safe Rust; MSRV 1.80.1; normal release target','','| Workload | baseline | candidate | ratio | paired median | range |','|---|---:|---:|---:|---:|---:|']
          for w in ('issue119','issue136'):
            b=statistics.median(g[w,'baseline']);c=statistics.median(g[w,'candidate']);p=[z['baseline']/z['candidate'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {b:.3f} us | {c:.3f} us | {b/c:.3f}x | {statistics.median(p):.3f}x | {min(p):.3f}–{max(p):.3f}x |')
          pathlib.Path('/tmp/out.md').write_text('\n'.join(L+['','```tsv','workload\tround\tvariant\tus']+['\t'.join(x) for x in rows]+['```','']))
          PY
          git reset --hard "$BASELINE_SHA"; cp /tmp/out.md benchmark-range-normalize.md; git add benchmark-range-normalize.md; git commit -m 'Record VP8 range normalization benchmark'; git push origin HEAD:bench-range-normalize
