name: Fused VP8 transform-add benchmark
on:
  push:
    branches: [ bench-transform-add ]
    paths: [ .github/workflows/bench-transform-add.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Benchmark fixed refs
        shell: bash
        run: |
          set -euxo pipefail
          BASE=13448c6a17180ee9939154b052dd70b44cd1729c
          MASK=f932b8ca4df52027c1efdfd6400d7fcc666fcb88
          FUSED=53906d7967e8cafe21962044e510c10099bced30
          echo "BASE=$BASE" >> "$GITHUB_ENV"; echo "MASK=$MASK" >> "$GITHUB_ENV"; echo "FUSED=$FUSED" >> "$GITHUB_ENV"
          echo "CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE"; git worktree add --detach /tmp/mask "$MASK"; git worktree add --detach /tmp/fused "$FUSED"
          cat >/tmp/bench.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder}; use std::{hint::black_box,io::Cursor,time::Instant};
          #[inline] fn hb(mut h:u64,b:u8)->u64{h^=b as u64;h.wrapping_mul(1099511628211)}
          fn hash(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut h=1469598103934665603;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{for z in t.to_le_bytes(){h=hb(h,z)}for &z in &b{h=hb(h,z)}},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();for &z in &b{h=hb(h,z)}}h}
          fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut s=0u64;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{let m=b.len()/2;s=s.wrapping_add(t as u64)^b[0]as u64^((b[m]as u64)<<8)^((b[b.len()-1]as u64)<<16)},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();let m=b.len()/2;s=b[0]as u64^((b[m]as u64)<<8)^((b[b.len()-1]as u64)<<16)}black_box(s)}
          fn main(){let mut a=std::env::args().skip(1);let mode=a.next().unwrap();let p=a.next().unwrap();let d=std::fs::read(p).unwrap();if mode=="hash"{println!("{:016x}",hash(&d));return}let n:usize=a.next().unwrap().parse().unwrap();black_box(dec(&d));let t=Instant::now();let mut s=0;for _ in 0..n{s^=dec(&d)}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64)}
          RS
          for d in /tmp/base /tmp/mask /tmp/fused; do mkdir -p "$d/examples"; cp /tmp/bench.rs "$d/examples/tadd.rs"; (cd "$d" && RUSTFLAGS='-C target-cpu=native' cargo build --release --example tadd); done
          mkdir -p /tmp/119 /tmp/136
          curl -L --fail --retry 5 -o /tmp/a.zip https://github.com/user-attachments/files/17482915/sample.zip; unzip -q /tmp/a.zip -d /tmp/119
          curl -L --fail --retry 5 -o /tmp/b.zip https://github.com/user-attachments/files/20597234/honk.webp.zip; unzip -q /tmp/b.zip -d /tmp/136
          I119=$(find /tmp/119 -iname '*.webp'|head -n1); I136=$(find /tmp/136 -iname '*.webp'|head -n1); B=/tmp/base/target/release/examples/tadd; M=/tmp/mask/target/release/examples/tadd; F=/tmp/fused/target/release/examples/tadd
          H119=$($B hash "$I119"); test "$H119" = "$($M hash "$I119")"; test "$H119" = "$($F hash "$I119")"
          H136=$($B hash "$I136"); test "$H136" = "$($M hash "$I136")"; test "$H136" = "$($F hash "$I136")"
          : >/tmp/r.tsv
          for r in {1..11}; do
            case $((r%3)) in 1) o='base mask fused';; 2) o='mask fused base';; 0) o='fused base mask';; esac
            for v in $o; do case $v in base)x=$B;;mask)x=$M;;fused)x=$F;;esac; u=$(taskset -c 0 "$x" bench "$I119" 3); printf 'issue119\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv; u=$(taskset -c 0 "$x" bench "$I136" 20); printf 'issue136\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv; done
          done
      - name: Persist
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          import csv,os,statistics,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t')); g={}; rr={}
          for w,r,v,x in rows: x=float(x); g.setdefault((w,v),[]).append(x); rr.setdefault((w,int(r)),{})[v]=x
          L=['# Fused VP8 transform-add benchmark','',f'- baseline: `{os.environ["BASE"]}`',f'- mask: `{os.environ["MASK"]}`',f'- fused: `{os.environ["FUSED"]}`',f'- CPU: `{os.environ["CPU"]}`','- full decoded outputs match before timing','','| Workload | base | mask | fused | fused/base paired | fused/mask paired |','|---|---:|---:|---:|---:|---:|']
          for w in ('issue119','issue136'):
            b=statistics.median(g[w,'base']); m=statistics.median(g[w,'mask']); f=statistics.median(g[w,'fused']); pfb=[z['base']/z['fused'] for (ww,_),z in sorted(rr.items()) if ww==w]; pfm=[z['mask']/z['fused'] for (ww,_),z in sorted(rr.items()) if ww==w]; L.append(f'| {w} | {b:.3f} us | {m:.3f} us | {f:.3f} us | {statistics.median(pfb):.3f}x | {statistics.median(pfm):.3f}x |')
          pathlib.Path('benchmark-transform-add.md').write_text('\n'.join(L+['']))
          PY
          git add benchmark-transform-add.md; git commit -m 'Record transform-add benchmark'; git push origin HEAD:bench-transform-add
