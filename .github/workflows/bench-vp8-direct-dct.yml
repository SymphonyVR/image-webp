name: Benchmark direct VP8 DCT arithmetic decoding
on:
  push:
    branches: [ bench-vp8-direct-dct ]
    paths: [ .github/workflows/bench-vp8-direct-dct.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build direct-DCT candidate
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^)
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE"
          cp -a /tmp/base /tmp/cand
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cand/src/lossy/arithmetic_decoder.rs');s=p.read_text()
          start=s.index('    #[inline(never)]\n    pub(crate) fn read_dct_value(')
          end=s.index('    // This is generic and inlined just to skip the first bounds check.', start)
          body=r'''    #[inline(never)]
    pub(crate) fn read_dct_value(&mut self, probs: &[u8; 11], skip_eob: bool) -> BitResult<i16> {
        let mut res = self.start_accumulated_result();
        if !skip_eob && !self.cold_read_bit(probs[0]).or_accumulate(&mut res) {
            return self.keep_accumulating(res, DCT_VALUE_EOB);
        }
        if !self.cold_read_bit(probs[1]).or_accumulate(&mut res) {
            return self.keep_accumulating(res, 0);
        }

        let abs = if !self.cold_read_bit(probs[2]).or_accumulate(&mut res) {
            1i16
        } else if !self.cold_read_bit(probs[3]).or_accumulate(&mut res) {
            if !self.cold_read_bit(probs[4]).or_accumulate(&mut res) {
                2
            } else {
                3 + i16::from(self.cold_read_bit(probs[5]).or_accumulate(&mut res))
            }
        } else if !self.cold_read_bit(probs[6]).or_accumulate(&mut res) {
            if !self.cold_read_bit(probs[7]).or_accumulate(&mut res) {
                5 + i16::from(self.cold_read_bit(PROB_DCT_CAT[0][0]).or_accumulate(&mut res))
            } else {
                7 + 2 * i16::from(self.cold_read_bit(PROB_DCT_CAT[1][0]).or_accumulate(&mut res))
                    + i16::from(self.cold_read_bit(PROB_DCT_CAT[1][1]).or_accumulate(&mut res))
            }
        } else {
            let hi = self.cold_read_bit(probs[8]).or_accumulate(&mut res);
            let lo = self.cold_read_bit(probs[9 + usize::from(hi)]).or_accumulate(&mut res);
            let cat = 2 + 2 * usize::from(hi) + usize::from(lo);
            let mut extra = 0i16;
            for prob in PROB_DCT_CAT[cat].iter().copied() {
                if prob == 0 { break; }
                extra = extra + extra + i16::from(self.cold_read_bit(prob).or_accumulate(&mut res));
            }
            i16::from(DCT_CAT_BASE[cat]) + extra
        };

        let signed = if self.cold_read_bit(128).or_accumulate(&mut res) { -abs } else { abs };
        self.keep_accumulating(res, signed)
    }

'''
          p.write_text(s[:start]+body+s[end:])
          PY
          (cd /tmp/cand && cargo fmt && cargo test -q)
          echo "CAND_SOURCE_SHA=ephemeral" >> "$GITHUB_ENV"
          cat >/tmp/bench.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder}; use std::{hint::black_box,io::Cursor,time::Instant};
          #[inline] fn hb(mut h:u64,b:u8)->u64{h^=b as u64;h.wrapping_mul(1099511628211)}
          fn hash(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut h=1469598103934665603;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{for z in t.to_le_bytes(){h=hb(h,z)}for &z in &b{h=hb(h,z)}},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();for &z in &b{h=hb(h,z)}}h}
          fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut s=0u64;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{let m=b.len()/2;s=s.wrapping_add(t as u64)^b[0]as u64^((b[m]as u64)<<8)^((b[b.len()-1]as u64)<<16)},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();let m=b.len()/2;s=b[0]as u64^((b[m]as u64)<<8)^((b[b.len()-1]as u64)<<16)}black_box(s)}
          fn main(){let mut a=std::env::args().skip(1);let mode=a.next().unwrap();let p=a.next().unwrap();let d=std::fs::read(p).unwrap();if mode=="hash"{println!("{:016x}",hash(&d));return}let n:usize=a.next().unwrap().parse().unwrap();black_box(dec(&d));let t=Instant::now();let mut s=0;for _ in 0..n{s^=dec(&d)}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64)}
          RS
          for d in /tmp/base /tmp/cand; do mkdir -p "$d/examples"; cp /tmp/bench.rs "$d/examples/direct_dct.rs"; (cd "$d" && RUSTFLAGS='-C target-cpu=native' cargo build --release --example direct_dct); done
          mkdir -p /tmp/119 /tmp/136
          curl -L --fail --retry 5 -o /tmp/a.zip https://github.com/user-attachments/files/17482915/sample.zip; unzip -q /tmp/a.zip -d /tmp/119
          curl -L --fail --retry 5 -o /tmp/b.zip https://github.com/user-attachments/files/20597234/honk.webp.zip; unzip -q /tmp/b.zip -d /tmp/136
          I119=$(find /tmp/119 -iname '*.webp'|head -n1); I136=$(find /tmp/136 -iname '*.webp'|head -n1); B=/tmp/base/target/release/examples/direct_dct; C=/tmp/cand/target/release/examples/direct_dct
          test "$($B hash "$I119")" = "$($C hash "$I119")"; test "$($B hash "$I136")" = "$($C hash "$I136")"
          : >/tmp/r.tsv
          for r in {1..17}; do if ((r%2)); then o='base cand'; else o='cand base'; fi; for v in $o; do [[ $v == base ]]&&x=$B||x=$C; u=$(taskset -c 0 "$x" bench "$I119" 5); printf 'issue119\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv; u=$(taskset -c 0 "$x" bench "$I136" 50); printf 'issue136\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv; done; done
      - name: Persist result
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,os,statistics,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:x=float(x);g.setdefault((w,v),[]).append(x);rr.setdefault((w,int(r)),{})[v]=x
          L=['# Direct VP8 DCT arithmetic benchmark','',f'- baseline: `{os.environ["BASE"]}`',f'- CPU: `{os.environ["CPU"]}`','- ephemeral candidate replaces speculative DCT transaction with direct EOF-aware bit reads','- full decoded outputs match before timing','','| Workload | baseline | candidate | paired median | range |','|---|---:|---:|---:|---:|']
          for w in ('issue119','issue136'):
            b=statistics.median(g[w,'base']);c=statistics.median(g[w,'cand']);p=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {b:.3f} us | {c:.3f} us | {statistics.median(p):.4f}x | {min(p):.4f}–{max(p):.4f}x |')
          pathlib.Path('benchmark-vp8-direct-dct.md').write_text('\n'.join(L+['']))
          PY
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8-direct-dct.md; git commit -m 'Record direct VP8 DCT arithmetic benchmark'; git push origin HEAD:bench-vp8-direct-dct
