name: Benchmark safe-Rust VP8 structural candidates
on:
  push:
    branches: [ bench-vp8-safe-matrix ]
    paths: [ .github/workflows/bench-vp8-safe-matrix.yml ]
permissions:
  contents: write
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Prepare variants
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^);echo "BASE=$BASE" >> "$GITHUB_ENV";echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE"
          for v in noinline borders fixed combined;do cp -a /tmp/base "/tmp/$v";done
          python3 - <<'PY'
          from pathlib import Path
          def noinline(root):
            p=Path(root)/'src/lossy/mod.rs';s=p.read_text();old='''    fn read_coefficients(\n        &mut self,\n''';new='''    #[inline(never)]\n    fn read_coefficients(\n        &mut self,\n''';assert old in s;s=s.replace(old,new,1);p.write_text(s)
          def borders(root):
            p=Path(root)/'src/lossy/mod.rs';s=p.read_text();old='''            self.left_border_y = vec![129u8; 1 + 16];\n            self.left_border_u = vec![129u8; 1 + 8];\n            self.left_border_v = vec![129u8; 1 + 8];\n''';new='''            self.left_border_y.fill(129);\n            self.left_border_u.fill(129);\n            self.left_border_v.fill(129);\n''';assert old in s;s=s.replace(old,new,1);p.write_text(s)
          def fixed(root):
            p=Path(root)/'src/lossy/prediction.rs';s=p.read_text();old='''pub(crate) fn add_residue(\n    pblock: &mut [u8],\n''';new='''pub(crate) fn add_residue<const N: usize>(\n    pblock: &mut [u8; N],\n''';assert old in s;s=s.replace(old,new,1);marker='''    let mut pos = y0 * stride + x0;\n''';assert marker in s;s=s.replace(marker,'''    assert!((y0 + 3) * stride + x0 + 3 < N);\n    let mut pos = y0 * stride + x0;\n''',1);old='''pub(crate) fn predict_4x4(ws: &mut [u8], stride: usize, modes: &[IntraMode], resdata: &[i32]) {''';new='''pub(crate) fn predict_4x4<const N: usize>(\n    ws: &mut [u8; N],\n    stride: usize,\n    modes: &[IntraMode],\n    resdata: &[i32],\n) {''';assert old in s;s=s.replace(old,new,1);p.write_text(s)
          noinline('/tmp/noinline');borders('/tmp/borders');fixed('/tmp/fixed');noinline('/tmp/combined');borders('/tmp/combined');fixed('/tmp/combined')
          PY
          rustup toolchain install 1.80.1 --profile minimal
          for d in /tmp/noinline /tmp/borders /tmp/fixed /tmp/combined;do (cd "$d"&&cargo fmt&&cargo test -q&&cargo doc -q&&cargo clippy --all-features -- -D warnings&&cargo fmt -- --check&&cargo +1.80.1 build -q);done
      - name: Build issue benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/i119 /tmp/i136
          curl -L --fail --retry 3 -o /tmp/i119.zip https://github.com/user-attachments/files/17482915/sample.zip;unzip -q /tmp/i119.zip -d /tmp/i119
          curl -L --fail --retry 3 -o /tmp/i136.zip https://github.com/user-attachments/files/20597234/honk.webp.zip;unzip -q /tmp/i136.zip -d /tmp/i136
          echo "I119=$(find /tmp/i119 -type f -iname '*.webp'|head -1)" >> "$GITHUB_ENV";echo "I136=$(find /tmp/i136 -type f -iname '*.webp'|head -1)" >> "$GITHUB_ENV"
          cat >/tmp/bench.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder};use std::{hint::black_box,io::Cursor,time::Instant};
          fn fnv(mut h:u64,b:&[u8])->u64{for &z in b{h=(h^z as u64).wrapping_mul(1099511628211)}h}
          fn run(d:&[u8],hash:bool)->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut h=1469598103934665603u64;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{h=fnv(h,&t.to_le_bytes());h=fnv(h,&b)},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();h=fnv(h,&b)}if hash{h}else{black_box(h)}}
          fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let p=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let d=std::fs::read(p).unwrap();if m=="hash"{println!("{:016x}",run(&d,true));return}black_box(run(&d,false));let t=Instant::now();let mut h=0;for _ in 0..n{h^=run(&d,false)}black_box(h);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64)}
RS
          for d in base noinline borders fixed combined;do mkdir -p "/tmp/$d/examples";cp /tmp/bench.rs "/tmp/$d/examples/mx.rs";(cd "/tmp/$d"&&cargo build --release --example mx -q);done
      - name: Hash and time
        shell: bash
        run: |
          set -euxo pipefail
          B=/tmp/base/target/release/examples/mx
          for f in "$I119" "$I136";do H=$($B hash "$f" 1);for v in noinline borders fixed combined;do test "$H" = "$(/tmp/$v/target/release/examples/mx hash "$f" 1)";done;done
          : >/tmp/r.tsv
          for r in {1..13};do variants=(base noinline borders fixed combined);if ((r%2==0));then variants=(combined fixed borders noinline base);fi;for v in "${variants[@]}";do X=/tmp/$v/target/release/examples/mx;u=$(taskset -c 0 "$X" bench "$I119" 3);printf '119\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$X" bench "$I136" 20);printf '136\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
      - name: Persist
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,statistics,pathlib,os
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:g.setdefault((w,v),[]).append(float(x));rr.setdefault((w,int(r)),{})[v]=float(x)
          L=['# Safe-Rust VP8 structural candidate matrix','',f'- baseline: `{os.environ["BASE"]}`',f'- CPU: `{os.environ["CPU"]}`','- tests/docs/Clippy/fmt/MSRV passed for all candidates','- hashes include every animation frame and match baseline','','| workload | variant | median | paired speedup vs base | range |','|---|---|---:|---:|---:|']
          for w in ('119','136'):
            for v in ('noinline','borders','fixed','combined'):
              q=[z['base']/z[v] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| issue {w} | {v} | {statistics.median(g[w,v]):.3f} us | {statistics.median(q):.4f}x | {min(q):.4f}–{max(q):.4f}x |')
          pathlib.Path('benchmark-vp8-safe-matrix.md').write_text('\n'.join(L+['']))
          PY
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add benchmark-vp8-safe-matrix.md;git commit -m 'Record safe-Rust VP8 candidate matrix';git push origin HEAD:bench-vp8-safe-matrix
