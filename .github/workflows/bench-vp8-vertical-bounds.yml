name: Benchmark VP8 vertical bounds proofs
on:
  push:
    branches: [ bench-vp8-vertical-bounds ]
    paths: [ .github/workflows/bench-vp8-vertical-bounds.yml ]
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply and verify
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossy/loop_filter.rs');s=p.read_text()
          reps={
          '''fn common_adjust_vertical(\n    use_outer_taps: bool,\n    pixels: &mut [u8],\n    point: usize,\n    stride: usize,\n) -> i32 {\n''':'''fn common_adjust_vertical(\n    use_outer_taps: bool,\n    pixels: &mut [u8],\n    point: usize,\n    stride: usize,\n) -> i32 {\n    assert!(point >= 2 * stride && point + stride < pixels.len());\n''',
          '''fn simple_threshold_vertical(\n    filter_limit: i32,\n    pixels: &[u8],\n    point: usize,\n    stride: usize,\n) -> bool {\n''':'''fn simple_threshold_vertical(\n    filter_limit: i32,\n    pixels: &[u8],\n    point: usize,\n    stride: usize,\n) -> bool {\n    assert!(point >= 2 * stride && point + stride < pixels.len());\n''',
          '''fn should_filter_vertical(\n    interior_limit: u8,\n    edge_limit: u8,\n    pixels: &[u8],\n    point: usize,\n    stride: usize,\n) -> bool {\n''':'''fn should_filter_vertical(\n    interior_limit: u8,\n    edge_limit: u8,\n    pixels: &[u8],\n    point: usize,\n    stride: usize,\n) -> bool {\n    assert!(point >= 4 * stride && point + 3 * stride < pixels.len());\n''',
          '''fn high_edge_variance_vertical(threshold: u8, pixels: &[u8], point: usize, stride: usize) -> bool {\n''':'''fn high_edge_variance_vertical(threshold: u8, pixels: &[u8], point: usize, stride: usize) -> bool {\n    assert!(point >= 2 * stride && point + stride < pixels.len());\n'''
          }
          for a,b in reps.items():
            if a not in s: raise SystemExit('marker missing')
            s=s.replace(a,b,1)
          p.write_text(s)
          PY
          cargo fmt
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add src/lossy/loop_filter.rs;git commit -m 'Prove VP8 vertical filter regions in bounds'
          CAND=$(git rev-parse HEAD);echo "BASE=$BASE" >> "$GITHUB_ENV";echo "CAND=$CAND" >> "$GITHUB_ENV";echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          cargo test -q;cargo doc -q;cargo clippy --all-features -- -D warnings;cargo fmt -- --check;rustup toolchain install 1.80.1 --profile minimal;cargo +1.80.1 build -q
      - name: Benchmark issue workloads
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/base "$BASE";git worktree add --detach /tmp/cand "$CAND";mkdir -p /tmp/i119 /tmp/i136;curl -L --fail --retry 3 -o /tmp/i119.zip https://github.com/user-attachments/files/17482915/sample.zip;unzip -q /tmp/i119.zip -d /tmp/i119;curl -L --fail --retry 3 -o /tmp/i136.zip https://github.com/user-attachments/files/20597234/honk.webp.zip;unzip -q /tmp/i136.zip -d /tmp/i136;I119=$(find /tmp/i119 -type f -iname '*.webp'|head -1);I136=$(find /tmp/i136 -type f -iname '*.webp'|head -1)
          cat >/tmp/b.rs <<'RS'
          use image_webp::{DecodingError,WebPDecoder};use std::{hint::black_box,io::Cursor,time::Instant};fn fnv(mut h:u64,b:&[u8])->u64{for &z in b{h=(h^z as u64).wrapping_mul(1099511628211)}h}fn run(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];let mut h=1469598103934665603;if x.is_animated(){loop{match x.read_frame(&mut b){Ok(t)=>{h=fnv(h,&t.to_le_bytes());h=fnv(h,&b)},Err(DecodingError::NoMoreFrames)=>break,Err(e)=>panic!("{e:?}")}}}else{x.read_image(&mut b).unwrap();h=fnv(h,&b)}h}fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let p=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let d=std::fs::read(p).unwrap();if m=="hash"{println!("{:016x}",run(&d));return}black_box(run(&d));let t=Instant::now();let mut s=0;for _ in 0..n{s^=run(&d)}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64)}
RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/b.rs "$d/examples/vb.rs";(cd "$d"&&cargo build --release --example vb -q);done;B=/tmp/base/target/release/examples/vb;C=/tmp/cand/target/release/examples/vb;test "$($B hash "$I119" 1)" = "$($C hash "$I119" 1)";test "$($B hash "$I136" 1)" = "$($C hash "$I136" 1)";: >/tmp/r.tsv
          for r in {1..17};do if ((r%2));then O='base cand';else O='cand base';fi;for v in $O;do [[ $v == base ]]&&X=$B||X=$C;u=$(taskset -c 0 "$X" bench "$I119" 3);printf '119\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$X" bench "$I136" 20);printf '136\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
          python3 - <<'PY'
          import csv,statistics,pathlib,os
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));rr={}
          for w,r,v,x in rows:rr.setdefault((w,int(r)),{})[v]=float(x)
          L=['# VP8 vertical bounds-proof benchmark','',f'- baseline: `{os.environ["BASE"]}`',f'- candidate: `{os.environ["CAND"]}`',f'- CPU: `{os.environ["CPU"]}`','- full verification and all-frame hashes passed','','| workload | paired speedup | range |','|---|---:|---:|']
          for w in ('119','136'):
            q=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| issue {w} | {statistics.median(q):.4f}x | {min(q):.4f}–{max(q):.4f}x |')
          pathlib.Path('benchmark-vp8-vertical-bounds.md').write_text('\n'.join(L+['']))
          PY
          git add benchmark-vp8-vertical-bounds.md;git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git commit -m 'Record VP8 vertical bounds benchmark';git push origin HEAD:bench-vp8-vertical-bounds
