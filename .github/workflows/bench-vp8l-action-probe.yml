name: Probe VP8L Actions
on:
  push:
    branches: [ bench-vp8l-action-probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist probe
        shell: bash
        run: |
          date -u > benchmark-vp8l-action-probe.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-action-probe.txt
          git commit -m 'Record Actions probe'
          git push origin HEAD:bench-vp8l-action-probe
