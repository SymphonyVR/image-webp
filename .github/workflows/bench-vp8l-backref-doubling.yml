name: Benchmark VP8L pattern-copy engine
on:
  push:
    branches: [ bench-vp8l-backref-doubling ]
    paths: [ .github/workflows/bench-vp8l-backref-doubling.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply safe pattern-copy candidate
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossless/decoder/mod.rs');s=p.read_text()
          marker='''const ALPHABET_SIZE: [u16; HUFFMAN_CODES_PER_META_CODE] = [256 + 24, 256, 256, 256, 40];\n'''
          helper=r'''

#[inline]
fn copy_backreference(data: &mut [u8], index: usize, distance: usize, length: usize) {
    let destination_start = index * 4;
    let byte_len = length * 4;

    if distance == 1 {
        let value: [u8; 4] = data[destination_start - 4..destination_start]
            .try_into()
            .unwrap();
        let destination = &mut data[destination_start..destination_start + byte_len];
        destination[..4].copy_from_slice(&value);
        let mut copied = 4;
        while copied < byte_len {
            let amount = copied.min(byte_len - copied);
            destination.copy_within(..amount, copied);
            copied += amount;
        }
        return;
    }

    let source_start = (index - distance) * 4;
    if distance >= length {
        let (before_destination, destination) = data.split_at_mut(destination_start);
        destination[..byte_len]
            .copy_from_slice(&before_destination[source_start..source_start + byte_len]);
        return;
    }

    let period_bytes = distance * 4;
    let (before_destination, destination_tail) = data.split_at_mut(destination_start);
    let destination = &mut destination_tail[..byte_len];
    destination[..period_bytes]
        .copy_from_slice(&before_destination[source_start..source_start + period_bytes]);

    let mut copied = period_bytes;
    while copied < byte_len {
        let amount = copied.min(byte_len - copied);
        destination.copy_within(..amount, copied);
        copied += amount;
    }
}
'''
          if marker not in s: raise SystemExit('constant marker missing')
          s=s.replace(marker,marker+helper,1)
          start=s.index('''                if dist == 1 {\n                    let value: [u8; 4]''')
          end=s.index('''                index += length;''',start)
          old=s[start:end]
          # Preserve color-cache update semantics: dist==1 requires no insertion because the repeated color is already cached.
          new='''                copy_backreference(data, index, dist, length);\n\n                if dist != 1 {\n                    if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                        for pixel in data[index * 4..][..length * 4].chunks_exact(4) {\n                            color_cache.insert(pixel.try_into().unwrap());\n                        }\n                    }\n                }\n'''
          p.write_text(s[:start]+new+s[end:])
          PY
          cargo fmt
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add src/lossless/decoder/mod.rs;git commit -m 'Use bulk pattern copies for VP8L backreferences'
          CAND=$(git rev-parse HEAD);echo "BASE=$BASE" >> "$GITHUB_ENV";echo "CAND=$CAND" >> "$GITHUB_ENV";echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          cargo test -v;cargo doc -v;cargo clippy --all-features -- -D warnings;cargo fmt -- --check;rustup toolchain install 1.80.1 --profile minimal;cargo +1.80.1 build -v
      - name: Prepare VP8L workloads
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/base "$BASE";git worktree add --detach /tmp/cand "$CAND"
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def chunks(d):
            if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP':return []
            o=[];p=12
            while p+8<=len(d):f=d[p:p+4];n=int.from_bytes(d[p+4:p+8],'little');o.append(f);p+=8+n+(n&1)
            return o
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
            c=chunks(p.read_bytes())
            if b'VP8L' in c and b'ANIM' not in c:print(p)
          PY
          sudo apt-get update -qq;sudo apt-get install -y webp
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
            f.write(f'P6\n{w} {h}\n255\n'.encode());row=bytearray(w*3)
            for y in range(h):
              for x in range(w):
                i=x*3;row[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255;row[i+1]=(x*2+y*7+((x*y)>>10))&255;row[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
              f.write(row)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          cat >/tmp/bench.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};
          fn hash(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b.iter().fold(1469598103934665603u64,|h,&z|(h^z as u64).wrapping_mul(1099511628211))}
          fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();black_box(b[0]as u64^((b[b.len()/2]as u64)<<8)^((b[b.len()-1]as u64)<<16))}
          fn main(){let mut a=std::env::args().skip(1);let mode=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if mode=="hash"{for d in &ds{println!("{:016x}",hash(d))}return}for d in &ds{black_box(dec(d));}let t=Instant::now();let mut s=0;for _ in 0..n{for d in &ds{s^=dec(d)}}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
          RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/bench.rs "$d/examples/backref2.rs";(cd "$d"&&cargo build --release --example backref2);done
      - name: Verify output and time
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -t BF </tmp/files.txt;CF=();for p in "${BF[@]}";do CF+=("${p/\/tmp\/base/\/tmp\/cand}");done;B=/tmp/base/target/release/examples/backref2;C=/tmp/cand/target/release/examples/backref2
          diff -u <($B hash 1 "${BF[@]}" /tmp/large.webp) <($C hash 1 "${CF[@]}" /tmp/large.webp)
          : >/tmp/r.tsv
          for r in {1..17};do if ((r%2));then o='base cand';else o='cand base';fi;for v in $o;do if [[ $v == base ]];then x=$B;f=("${BF[@]}");else x=$C;f=("${CF[@]}");fi;u=$(taskset -c 0 "$x" bench 120 "${f[@]}");printf 'corpus\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$x" bench 2 /tmp/large.webp);printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
      - name: Persist
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,statistics,os,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:g.setdefault((w,v),[]).append(float(x));rr.setdefault((w,int(r)),{})[v]=float(x)
          L=['# VP8L bulk pattern-copy benchmark','',f'- baseline: `{os.environ["BASE"]}`',f'- candidate: `{os.environ["CAND"]}`',f'- CPU: `{os.environ["CPU"]}`','- full hashes match; tests/docs/Clippy/fmt/MSRV passed','','| workload | baseline | candidate | paired median | range |','|---|---:|---:|---:|---:|']
          for w in ('corpus','large'):
            b=statistics.median(g[w,'base']);c=statistics.median(g[w,'cand']);p=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {b:.3f} us | {c:.3f} us | {statistics.median(p):.4f}x | {min(p):.4f}–{max(p):.4f}x |')
          pathlib.Path('benchmark-vp8l-backref-doubling.md').write_text('\n'.join(L+['']))
          PY
          git add benchmark-vp8l-backref-doubling.md;git commit -m 'Record VP8L pattern-copy benchmark';git push origin HEAD:bench-vp8l-backref-doubling
