name: Materialize VP8L pattern-copy source
on:
  push:
    branches: [ bench-vp8l-backref-doubling ]
    paths: [ .github/workflows/bench-vp8l-backref-doubling.yml ]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and publish candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossless/decoder/mod.rs');s=p.read_text()
          marker='const ALPHABET_SIZE: [u16; HUFFMAN_CODES_PER_META_CODE] = [256 + 24, 256, 256, 256, 40];\n'
          helper=r'''

#[inline]
fn copy_backreference(data: &mut [u8], index: usize, distance: usize, length: usize) {
    let destination_start = index * 4;
    let byte_len = length * 4;

    if distance == 1 {
        let value: [u8; 4] = data[destination_start - 4..destination_start]
            .try_into()
            .unwrap();
        let destination = &mut data[destination_start..destination_start + byte_len];
        destination[..4].copy_from_slice(&value);
        let mut copied = 4;
        while copied < byte_len {
            let amount = copied.min(byte_len - copied);
            destination.copy_within(..amount, copied);
            copied += amount;
        }
        return;
    }

    let source_start = (index - distance) * 4;
    if distance >= length {
        let (before_destination, destination) = data.split_at_mut(destination_start);
        destination[..byte_len]
            .copy_from_slice(&before_destination[source_start..source_start + byte_len]);
        return;
    }

    let period_bytes = distance * 4;
    let (before_destination, destination_tail) = data.split_at_mut(destination_start);
    let destination = &mut destination_tail[..byte_len];
    destination[..period_bytes]
        .copy_from_slice(&before_destination[source_start..source_start + period_bytes]);

    let mut copied = period_bytes;
    while copied < byte_len {
        let amount = copied.min(byte_len - copied);
        destination.copy_within(..amount, copied);
        copied += amount;
    }
}
'''
          if marker not in s: raise SystemExit('constant marker missing')
          s=s.replace(marker,marker+helper,1)
          start=s.index('                if dist == 1 {\n                    let value: [u8; 4]')
          end=s.index('                index += length;',start)
          new='''                copy_backreference(data, index, dist, length);\n\n                if dist != 1 {\n                    if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                        for pixel in data[index * 4..][..length * 4].chunks_exact(4) {\n                            color_cache.insert(pixel.try_into().unwrap());\n                        }\n                    }\n                }\n'''
          p.write_text(s[:start]+new+s[end:])
          PY
          cargo fmt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/mod.rs
          git commit -m 'Use bulk pattern copies for VP8L backreferences'
          git push origin HEAD:bench-vp8l-backref-doubling
