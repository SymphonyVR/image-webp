name: Benchmark VP8L block bound
on:
  push:
    branches: [bench-vp8l-block-bound-current]
    paths: [.github/workflows/bench-vp8l-block-bound-current.yml]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - name: Build and benchmark
        shell: bash
        run: |
          set -euxo pipefail
          BASE=84d8d20753fce0a9972e8a244fdf929b5a55671c; echo "BASE=$BASE" >> "$GITHUB_ENV"; echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE"; git worktree add --detach /tmp/cand "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cand/src/lossless/decoder/mod.rs');s=p.read_text();old='while *index < num_values && *index < block_end {';new='while *index < block_end {';assert s.count(old)==1;p.write_text(s.replace(old,new,1))
          PY
          cd /tmp/cand; cargo fmt; cargo test -q; cargo test --release -q; cargo doc --no-deps -q; cargo clippy -- -D warnings; cargo fmt -- --check; cargo +1.80.1 build -q; cargo +1.80.1 build --release -q
          cat >/tmp/b.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};fn d(x:&[u8])->Vec<u8>{let mut q=WebPDecoder::new(Cursor::new(x)).unwrap();let mut b=vec![0;q.output_buffer_size().unwrap()];q.read_image(&mut b).unwrap();b}fn h(x:&[u8])->u64{d(x).iter().fold(0xcbf29ce484222325u64,|a,&z|(a^z as u64).wrapping_mul(1099511628211))}fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if m=="h"{for x in&ds{println!("{:016x}",h(x))}return}for x in&ds{black_box(d(x));}let t=Instant::now();for _ in 0..n{for x in&ds{black_box(d(x));}}println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
          RS
          for d in /tmp/base /tmp/cand; do mkdir -p "$d/examples"; cp /tmp/b.rs "$d/examples/bb.rs"; (cd "$d" && RUSTFLAGS='-C target-cpu=native' cargo build --release --example bb -q); done
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def ch(p):
            d=p.read_bytes();o=[];q=12
            if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP':return o
            while q+8<=len(d):t=d[q:q+4];n=int.from_bytes(d[q+4:q+8],'little');o.append(t);q+=8+n+(n&1)
            return o
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
            c=ch(p)
            if b'VP8L' in c and b'ANIM' not in c:print(p)
          PY
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
            f.write(f'P6\n{w} {h}\n255\n'.encode());r=bytearray(w*3)
            for y in range(h):
              for x in range(w):i=x*3;r[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255;r[i+1]=(x*2+y*7+((x*y)>>10))&255;r[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
              f.write(r)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          mapfile -t BF </tmp/files.txt; CF=(); for p in "${BF[@]}"; do CF+=("${p/\/tmp\/base/\/tmp\/cand}"); done; B=/tmp/base/target/release/examples/bb; C=/tmp/cand/target/release/examples/bb
          diff -u <($B h 1 "${BF[@]}" /tmp/large.webp) <($C h 1 "${CF[@]}" /tmp/large.webp)
          : >/tmp/r.tsv
          for r in {1..17}; do if ((r%2));then O='base cand';else O='cand base';fi; for v in $O;do if [[ $v == base ]];then X=$B;F=("${BF[@]}");else X=$C;F=("${CF[@]}");fi;u=$(taskset -c 0 "$X" t 80 "${F[@]}");printf 'corpus\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$X" t 4 /tmp/large.webp);printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import csv,statistics,os;from pathlib import Path
          rr={}
          for w,r,v,x in csv.reader(open('/tmp/r.tsv'),delimiter='\t'):rr.setdefault((w,int(r)),{})[v]=float(x)
          L=['# VP8L block-bound current-tree benchmark','',f'- baseline: `{os.environ["BASE"]}`',f'- CPU: `{os.environ["CPU"]}`','- removes redundant image-end comparison from the entropy loop; full verification passed','','| workload | paired median | positive | range |','|---|---:|---:|---:|']
          for w in ('corpus','large'):
            q=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | **{statistics.median(q):.4f}x** | {sum(x>1 for x in q)}/{len(q)} | {min(q):.4f}–{max(q):.4f}x |')
          Path('benchmark-vp8l-block-bound-current.md').write_text('\n'.join(L)+'\n');print('\n'.join(L))
          PY
      - name: Persist result
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-block-bound-current.md; git commit -m 'Record VP8L block-bound benchmark'; git push origin HEAD:bench-vp8l-block-bound-current
