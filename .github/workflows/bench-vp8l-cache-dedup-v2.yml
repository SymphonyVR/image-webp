name: Benchmark VP8L cache dedup v2
on:
  push:
    branches: [ bench-vp8l-cache-dedup-v2 ]
    paths: [ .github/workflows/bench-vp8l-cache-dedup-v2.yml ]
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MSRV
        run: rustup toolchain install 1.80.1 --profile minimal
      - name: Build variants
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^); echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          for v in base tail dedup; do git worktree add --detach "/tmp/$v" "$BASE"; done
          python3 - <<'PY'
          from pathlib import Path
          def tail(root):
              p=Path(root)/'src/lossless/decoder/mod.rs';s=p.read_text()
              old='''                    if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                        for pixel in data[index * 4..][..length * 4].chunks_exact(4) {\n                            color_cache.insert(pixel.try_into().unwrap());\n                        }\n                    }\n'''
              new='''                    if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                        let cache_pixels = length.min(dist);\n                        let cache_start = index + length - cache_pixels;\n                        for pixel in data[cache_start * 4..][..cache_pixels * 4].chunks_exact(4) {\n                            color_cache.insert(pixel.try_into().unwrap());\n                        }\n                    }\n'''
              if old not in s: raise SystemExit('tail marker')
              p.write_text(s.replace(old,new,1))
          tail('/tmp/tail')
          p=Path('/tmp/dedup/src/lossless/decoder/mod.rs');s=p.read_text()
          old='''        let color_cache = color_cache_bits.map(|bits| ColorCache {\n            color_cache_bits: bits,\n            color_cache: vec![[0; 4]; 1 << bits],\n        });\n'''
          new='''        let color_cache = color_cache_bits.map(|bits| {\n            let len = 1usize << bits;\n            ColorCache {\n                color_cache_bits: bits,\n                color_cache: vec![[0; 4]; len],\n                seen_generation: vec![0; len],\n                generation: 0,\n            }\n        });\n'''
          if old not in s: raise SystemExit('init marker')
          s=s.replace(old,new,1)
          old='''struct ColorCache {\n    color_cache_bits: u8,\n    color_cache: Vec<[u8; 4]>,\n}\n\nimpl ColorCache {\n    #[inline(always)]\n    fn insert(&mut self, color: [u8; 4]) {\n        let [r, g, b, a] = color;\n        let color_u32 =\n            (u32::from(r) << 16) | (u32::from(g) << 8) | (u32::from(b)) | (u32::from(a) << 24);\n        let index = (0x1e35a7bdu32.wrapping_mul(color_u32)) >> (32 - self.color_cache_bits);\n        self.color_cache[index as usize] = color;\n    }\n'''
          new='''struct ColorCache {\n    color_cache_bits: u8,\n    color_cache: Vec<[u8; 4]>,\n    seen_generation: Vec<u32>,\n    generation: u32,\n}\n\nimpl ColorCache {\n    #[inline(always)]\n    fn index_for(&self, color: [u8; 4]) -> usize {\n        let [r, g, b, a] = color;\n        let color_u32 =\n            (u32::from(r) << 16) | (u32::from(g) << 8) | u32::from(b) | (u32::from(a) << 24);\n        ((0x1e35a7bdu32.wrapping_mul(color_u32)) >> (32 - self.color_cache_bits)) as usize\n    }\n\n    #[inline(always)]\n    fn insert(&mut self, color: [u8; 4]) {\n        let index = self.index_for(color);\n        self.color_cache[index] = color;\n    }\n\n    fn insert_backreference_tail(&mut self, pixels: &[u8]) {\n        self.generation = self.generation.wrapping_add(1);\n        if self.generation == 0 {\n            self.seen_generation.fill(0);\n            self.generation = 1;\n        }\n        let generation = self.generation;\n        for pixel in pixels.rchunks_exact(4) {\n            let color: [u8; 4] = pixel.try_into().unwrap();\n            let index = self.index_for(color);\n            if self.seen_generation[index] != generation {\n                self.seen_generation[index] = generation;\n                self.color_cache[index] = color;\n            }\n        }\n    }\n'''
          if old not in s: raise SystemExit('cache marker')
          s=s.replace(old,new,1)
          old='''                    if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                        for pixel in data[index * 4..][..length * 4].chunks_exact(4) {\n                            color_cache.insert(pixel.try_into().unwrap());\n                        }\n                    }\n'''
          new='''                    if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                        let cache_pixels = length.min(dist);\n                        let cache_start = index + length - cache_pixels;\n                        color_cache.insert_backreference_tail(\n                            &data[cache_start * 4..][..cache_pixels * 4],\n                        );\n                    }\n'''
          if old not in s: raise SystemExit('loop marker')
          p.write_text(s.replace(old,new,1))
          PY
          (cd /tmp/dedup && cargo fmt && cargo test -q && cargo doc -q && cargo clippy --all-features -- -D warnings && cargo fmt -- --check && cargo +1.80.1 build -q)
          cat >/tmp/bench.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};
          fn hash(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b.iter().fold(1469598103934665603u64,|h,&z|(h^z as u64).wrapping_mul(1099511628211))}
          fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();black_box(b[0]as u64^((b[b.len()/2]as u64)<<8))}
          fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let p=a.next().unwrap();let d=std::fs::read(p).unwrap();if m=="hash"{println!("{:016x}",hash(&d));return}let n:usize=a.next().unwrap().parse().unwrap();black_box(dec(&d));let t=Instant::now();for _ in 0..n{black_box(dec(&d));}println!("{:.3}",t.elapsed().as_secs_f64()*1e6/n as f64)}
          RS
          for v in base tail dedup; do mkdir -p "/tmp/$v/examples";cp /tmp/bench.rs "/tmp/$v/examples/cd.rs";(cd "/tmp/$v"&&cargo build --release --example cd -q);done
          sudo apt-get update -qq;sudo apt-get install -y webp
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
            f.write(f'P6\n{w} {h}\n255\n'.encode());row=bytearray(w*3)
            for y in range(h):
              for x in range(w):
                i=x*3;row[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255;row[i+1]=(x*2+y*7+((x*y)>>10))&255;row[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
              f.write(row)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          REAL=/tmp/base/tests/images/gallery2/3_webp_ll.webp
          for p in /tmp/large.webp "$REAL";do H=$(/tmp/base/target/release/examples/cd hash "$p");for v in tail dedup;do q=$p;[[ $p == "$REAL" ]]&&q=${p/\/tmp\/base/\/tmp\/$v};test "$H" = "$(/tmp/$v/target/release/examples/cd hash "$q")";done;done
          : >/tmp/r.tsv
          for r in {1..25};do if ((r%2));then O='base tail dedup';else O='dedup tail base';fi;for v in $O;do X=/tmp/$v/target/release/examples/cd;real=/tmp/$v/tests/images/gallery2/3_webp_ll.webp;u=$(taskset -c 0 "$X" bench /tmp/large.webp 3);printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$X" bench "$real" 8);printf 'real\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
          python3 - <<'PY'
          import csv,statistics,pathlib,os
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:x=float(x);g.setdefault((w,v),[]).append(x);rr.setdefault((w,int(r)),{})[v]=x
          L=['# VP8L cache-tail dedup v2','',f'- CPU: `{os.environ["CPU"]}`','- dedup passes tests/docs/Clippy/fmt/MSRV; full output hashes match','','| workload | variant | median | vs baseline | vs tail |','|---|---|---:|---:|---:|']
          for w in ('real','large'):
            for v in ('tail','dedup'):
              pb=[z['base']/z[v] for (ww,_),z in sorted(rr.items()) if ww==w];pt=[z['tail']/z[v] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {v} | {statistics.median(g[w,v]):.3f} us | {statistics.median(pb):.4f}x | {statistics.median(pt):.4f}x |')
          pathlib.Path('benchmark-vp8l-cache-dedup-v2.md').write_text('\n'.join(L+['']))
          PY
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add benchmark-vp8l-cache-dedup-v2.md;git commit -m 'Record VP8L cache dedup v2';git push origin HEAD:bench-vp8l-cache-dedup-v2
