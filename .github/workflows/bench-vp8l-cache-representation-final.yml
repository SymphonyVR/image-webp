name: Benchmark final VP8L cache representation

on:
  push:
    branches: [ bench-vp8l-cache-representation-final ]
    paths: [ .github/workflows/bench-vp8l-cache-representation-final.yml ]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - name: Build candidates
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^);echo "BASE=$BASE" >> "$GITHUB_ENV";echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE"
          for v in hash packed both;do git worktree add --detach "/tmp/$v" "$BASE";done
          cat >/tmp/patch.py <<'PY'
          import sys
          from pathlib import Path
          v=sys.argv[1];p=Path(sys.argv[2])/'src/lossless/decoder/mod.rs';s=p.read_text()
          if v in ('hash','both'):
            old='''        let [r, g, b, a] = color;
        let color_u32 =
            (u32::from(r) << 16) | (u32::from(g) << 8) | (u32::from(b)) | (u32::from(a) << 24);
'''
            new='''        let [r, g, b, a] = color;
        let color_u32 = u32::from_be_bytes([a, r, g, b]);
'''
            if old not in s:raise SystemExit('hash marker')
            s=s.replace(old,new,1)
          if v in ('packed','both'):
            s=s.replace('color_cache: vec![[0; 4]; 1 << bits],','color_cache: vec![0; 1 << bits],',1)
            s=s.replace('color_cache: Vec<[u8; 4]>,','color_cache: Vec<u32>,',1)
            old='''        self.color_cache[index as usize] = color;
    }

    #[inline(always)]
    fn lookup(&self, index: usize) -> [u8; 4] {
        self.color_cache[index]
'''
            new='''        self.color_cache[index as usize] = u32::from_le_bytes(color);
    }

    #[inline(always)]
    fn lookup(&self, index: usize) -> [u8; 4] {
        self.color_cache[index].to_le_bytes()
'''
            if old not in s:raise SystemExit('packed marker')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rustup toolchain install 1.80.1 --profile minimal
          for v in hash packed both;do python3 /tmp/patch.py "$v" "/tmp/$v";(cd "/tmp/$v"&&cargo fmt&&cargo test -q&&cargo +1.80.1 build -q);done
      - name: Prepare benchmark
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def chunks(d):
            if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP':return []
            o=[];p=12
            while p+8<=len(d):f=d[p:p+4];n=int.from_bytes(d[p+4:p+8],'little');o.append(f);p+=8+n+(n&1)
            return o
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
            c=chunks(p.read_bytes())
            if b'VP8L' in c and b'ANIM' not in c:print(p)
          PY
          sudo apt-get update -qq;sudo apt-get install -y webp >/dev/null
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
            f.write(f'P6\n{w} {h}\n255\n'.encode());row=bytearray(w*3)
            for y in range(h):
              for x in range(w):
                i=x*3;row[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255;row[i+1]=(x*2+y*7+((x*y)>>10))&255;row[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
              f.write(row)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          cat >/tmp/b.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};fn image(d:&[u8])->Vec<u8>{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b}fn hash(d:&[u8])->u64{image(d).iter().fold(1469598103934665603u64,|h,&b|(h^u64::from(b)).wrapping_mul(1099511628211))}fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if m=="hash"{for d in&ds{println!("{:016x}",hash(d))}return}for d in&ds{black_box(image(d));}let t=Instant::now();for _ in 0..n{for d in&ds{black_box(image(d));}}println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
          RS
          for v in base hash packed both;do mkdir -p "/tmp/$v/examples";cp /tmp/b.rs "/tmp/$v/examples/cache_repr.rs";(cd "/tmp/$v"&&RUSTFLAGS='-C target-cpu=native' cargo build --release --example cache_repr -q);done
      - name: Verify benchmark persist
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -t BF </tmp/files.txt;B=/tmp/base/target/release/examples/cache_repr
          for v in hash packed both;do CF=();for p in "${BF[@]}";do CF+=("${p/\/tmp\/base/\/tmp\/$v}");done;C="/tmp/$v/target/release/examples/cache_repr";diff -u <($B hash 1 "${BF[@]}" /tmp/large.webp) <($C hash 1 "${CF[@]}" /tmp/large.webp);done
          : >/tmp/r.tsv
          for r in {1..17};do for v in base hash packed both;do if [[ $v == base ]];then X=$B;F=("${BF[@]}");else X="/tmp/$v/target/release/examples/cache_repr";F=();for p in "${BF[@]}";do F+=("${p/\/tmp\/base/\/tmp\/$v}");done;fi;u=$(taskset -c 0 "$X" bench 70 "${F[@]}");printf 'corpus\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$X" bench 4 /tmp/large.webp);printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
          python3 - <<'PY'
          import csv,statistics,os
          from pathlib import Path
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));rr={}
          for w,r,v,x in rows:rr.setdefault((w,int(r)),{})[v]=float(x)
          lines=['# Final VP8L cache representation matrix','',f'- baseline: `{os.environ["BASE"]}`',f'- CPU: `{os.environ["CPU"]}`','- hashes + tests + MSRV 1.80.1 passed','','| workload | candidate | paired median | positive | range |','|---|---|---:|---:|---:|']
          for w in ('corpus','large'):
            for v in ('hash','packed','both'):
              q=[z['base']/z[v] for (ww,_),z in sorted(rr.items()) if ww==w];lines.append(f'| {w} | {v} | {statistics.median(q):.4f}x | {sum(x>1 for x in q)}/{len(q)} | {min(q):.4f}–{max(q):.4f}x |')
          Path('benchmark-vp8l-cache-representation-final.md').write_text('\n'.join(lines+['']))
          PY
          cat benchmark-vp8l-cache-representation-final.md
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add benchmark-vp8l-cache-representation-final.md;git commit -m 'Record final VP8L cache representation';git push origin HEAD:bench-vp8l-cache-representation-final
