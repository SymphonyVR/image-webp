name: Benchmark VP8L color delta LUT current
on:
  push:
    branches: [bench-vp8l-color-delta-lut-current]
    paths:
      - tools/bench_vp8l_color_delta_lut_current.py
      - .github/workflows/bench-vp8l-color-delta-lut-current.yml
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - run: rustup toolchain install 1.80.1 --profile minimal
      - name: Benchmark LUT candidates
        run: |
          sed -i "s/'cargo','clippy','--','-D','warnings'/'cargo','clippy','--','-D','warnings','-A','dead-code'/" tools/bench_vp8l_color_delta_lut_current.py
          python3 tools/bench_vp8l_color_delta_lut_current.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-color-delta-lut-current.md
          git commit -m 'Record color delta LUT matrix'
          git push origin HEAD:bench-vp8l-color-delta-lut-current
