name: Isolate VP8L exact color tiles

on:
  push:
    branches: [ bench-vp8l-color-exact-isolate ]
    paths: [ .github/workflows/bench-vp8l-color-exact-isolate.yml ]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - name: Build candidates
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^);echo "BASE=$BASE" >> "$GITHUB_ENV";echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE"
          for v in exact exact-inc exact-hoist;do git worktree add --detach "/tmp/$v" "$BASE";done
          cat >/tmp/patch.py <<'PY'
          import sys
          from pathlib import Path
          v=sys.argv[1];p=Path(sys.argv[2])/'src/lossless/decoder/reverse_transform.rs';s=p.read_text();a=s.index('pub(crate) fn apply_color_transform(');b=s.index('\npub(crate) fn apply_subtract_green_transform',a)
          inc=v=='exact-inc';hoist=v=='exact-hoist'
          head='''pub(crate) fn apply_color_transform(\n    image_data: &mut [u8],\n    width: u16,\n    size_bits: u8,\n    transform_data: &[u8],\n) {\n    let block_xsize = usize::from(subsample_size(width, size_bits));\n    let width = usize::from(width);\n    let block_bytes = 4usize << size_bits;\n'''
          if inc:head+='''    let tile_mask = (1usize << size_bits) - 1;\n    let mut row_transform_data_start = 0usize;\n'''
          head+='''    for (y, row) in image_data.chunks_exact_mut(width * 4).enumerate() {\n'''
          if inc:head+='''        let row_tf_data = &transform_data[row_transform_data_start..];\n'''
          else:head+='''        let row_transform_data_start = (y >> size_bits) * block_xsize * 4;\n        let row_tf_data = &transform_data[row_transform_data_start..];\n'''
          pix='''            let red_to_blue = transform[0]'''+(' as i8' if hoist else '')+''';
            let green_to_blue = transform[1]'''+(' as i8' if hoist else '')+''';
            let green_to_red = transform[2]'''+(' as i8' if hoist else '')+''';
            for pixel in block.chunks_exact_mut(4) {
                let green = u32::from(pixel[1]);
                let mut temp_red = u32::from(pixel[0]);
                let mut temp_blue = u32::from(pixel[2]);
                temp_red += color_transform_delta('''+('green_to_red' if hoist else 'green_to_red as i8')+''', green as i8);
                temp_blue += color_transform_delta('''+('green_to_blue' if hoist else 'green_to_blue as i8')+''', green as i8);
                temp_blue += color_transform_delta('''+('red_to_blue' if hoist else 'red_to_blue as i8')+''', temp_red as i8);
                pixel[0] = (temp_red & 0xff) as u8;
                pixel[2] = (temp_blue & 0xff) as u8;
            }
'''
          body='''        let mut blocks = row.chunks_exact_mut(block_bytes);
        let mut transforms = row_tf_data.chunks_exact(4);
        for (block, transform) in (&mut blocks).zip(&mut transforms) {
'''+pix+'''        }
        let rem = blocks.into_remainder();
        if !rem.is_empty() {
            if let Some(transform) = transforms.next() {
                let block = rem;
'''+''.join('                '+x+'\n' for x in pix.splitlines())+'''            }
        }
'''
          if inc:body+='''        if ((y + 1) & tile_mask) == 0 { row_transform_data_start += block_xsize * 4; }
'''
          new=head+body+'    }\n}\n';p.write_text(s[:a]+new+s[b:])
          PY
          rustup toolchain install 1.80.1 --profile minimal
          for v in exact exact-inc exact-hoist;do python3 /tmp/patch.py "$v" "/tmp/$v";(cd "/tmp/$v"&&cargo fmt&&cargo test -q&&cargo +1.80.1 build -q);done
      - name: Prepare benchmark
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def chunks(d):
            if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP':return []
            o=[];p=12
            while p+8<=len(d):f=d[p:p+4];n=int.from_bytes(d[p+4:p+8],'little');o.append(f);p+=8+n+(n&1)
            return o
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
            c=chunks(p.read_bytes())
            if b'VP8L' in c and b'ANIM' not in c:print(p)
          PY
          sudo apt-get update -qq;sudo apt-get install -y webp >/dev/null
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
            f.write(f'P6\n{w} {h}\n255\n'.encode());row=bytearray(w*3)
            for y in range(h):
              for x in range(w):
                i=x*3;row[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255;row[i+1]=(x*2+y*7+((x*y)>>10))&255;row[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
              f.write(row)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          cat >/tmp/b.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};fn image(d:&[u8])->Vec<u8>{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b}fn hash(d:&[u8])->u64{image(d).iter().fold(1469598103934665603u64,|h,&b|(h^u64::from(b)).wrapping_mul(1099511628211))}fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if m=="hash"{for d in&ds{println!("{:016x}",hash(d))}return}for d in&ds{black_box(image(d));}let t=Instant::now();for _ in 0..n{for d in&ds{black_box(image(d));}}println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
          RS
          for v in base exact exact-inc exact-hoist;do mkdir -p "/tmp/$v/examples";cp /tmp/b.rs "/tmp/$v/examples/exact_color.rs";(cd "/tmp/$v"&&RUSTFLAGS='-C target-cpu=native' cargo build --release --example exact_color -q);done
      - name: Verify benchmark persist
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -t BF </tmp/files.txt;B=/tmp/base/target/release/examples/exact_color
          for v in exact exact-inc exact-hoist;do CF=();for p in "${BF[@]}";do CF+=("${p/\/tmp\/base/\/tmp\/$v}");done;C="/tmp/$v/target/release/examples/exact_color";diff -u <($B hash 1 "${BF[@]}" /tmp/large.webp) <($C hash 1 "${CF[@]}" /tmp/large.webp);done
          : >/tmp/r.tsv
          for r in {1..17};do for v in base exact exact-inc exact-hoist;do if [[ $v == base ]];then X=$B;F=("${BF[@]}");else X="/tmp/$v/target/release/examples/exact_color";F=();for p in "${BF[@]}";do F+=("${p/\/tmp\/base/\/tmp\/$v}");done;fi;u=$(taskset -c 0 "$X" bench 70 "${F[@]}");printf 'corpus\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$X" bench 4 /tmp/large.webp);printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
          python3 - <<'PY'
          import csv,statistics,os
          from pathlib import Path
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:g.setdefault((w,v),[]).append(float(x));rr.setdefault((w,int(r)),{})[v]=float(x)
          lines=['# VP8L exact color-tile isolation','',f'- baseline: `{os.environ["BASE"]}`',f'- CPU: `{os.environ["CPU"]}`','- hashes + tests + MSRV 1.80.1 passed','','| workload | candidate | paired median | positive | range |','|---|---|---:|---:|---:|']
          for w in ('corpus','large'):
            for v in ('exact','exact-inc','exact-hoist'):
              q=[z['base']/z[v] for (ww,_),z in sorted(rr.items()) if ww==w];lines.append(f'| {w} | {v} | {statistics.median(q):.4f}x | {sum(x>1 for x in q)}/{len(q)} | {min(q):.4f}–{max(q):.4f}x |')
          Path('benchmark-vp8l-color-exact-isolate.md').write_text('\n'.join(lines+['']))
          PY
          cat benchmark-vp8l-color-exact-isolate.md
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add benchmark-vp8l-color-exact-isolate.md;git commit -m 'Record exact VP8L color tile isolation';git push origin HEAD:bench-vp8l-color-exact-isolate
