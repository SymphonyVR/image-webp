name: VP8L color/green fusion benchmark
on:
  push:
    branches: [ bench-vp8l-color-green-fusion ]
    paths: [ .github/workflows/bench-vp8l-color-green-fusion.yml ]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Verify candidate and prepare corpus
        shell: bash
        run: |
          set -euxo pipefail
          BASE=677794add99a6a68eeb3e183853480e2308ac4f8
          CAND=ff59c573671529d32aaff9870b9072ced377ce8c
          echo "BASE=$BASE" >> "$GITHUB_ENV"; echo "CAND=$CAND" >> "$GITHUB_ENV"
          echo "CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE"; git worktree add --detach /tmp/cand "$CAND"
          (cd /tmp/cand && cargo test -v && cargo doc -v && cargo clippy --all-features -- -D warnings && cargo fmt -- --check)
          rustup toolchain install 1.80.1 --profile minimal
          (cd /tmp/cand && cargo +1.80.1 build -v)
          python3 - <<'PY' >/tmp/vp8l-files.txt
          from pathlib import Path
          def chunks(data):
              if len(data)<12 or data[:4]!=b'RIFF' or data[8:12]!=b'WEBP': return []
              out=[];p=12
              while p+8<=len(data):
                  f=data[p:p+4];n=int.from_bytes(data[p+4:p+8],'little');out.append(f);p+=8+n+(n&1)
              return out
          files=[]
          for path in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
              c=chunks(path.read_bytes())
              if b'VP8L' in c and b'ANIM' not in c: files.append(path)
          if not files: raise SystemExit('no static VP8L fixtures')
          print(*files,sep='\n')
          PY
          echo "COUNT=$(wc -l </tmp/vp8l-files.txt)" >> "$GITHUB_ENV"
          cat >/tmp/bench.rs <<'RS'
          use image_webp::WebPDecoder; use std::{hint::black_box,io::Cursor,time::Instant};
          #[inline] fn hb(mut h:u64,b:u8)->u64{h^=b as u64;h.wrapping_mul(1099511628211)}
          fn dh(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b.iter().fold(1469598103934665603,|h,&v|hb(h,v))}
          fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();black_box((b.len()as u64)^b[0]as u64^((b[b.len()/2]as u64)<<8)^((b[b.len()-1]as u64)<<16))}
          fn main(){let mut a=std::env::args().skip(1);let mode=a.next().unwrap();if mode=="hash"{for p in a{let d=std::fs::read(&p).unwrap();println!("{} {:016x}",p,dh(&d));}return}let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let imgs:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();for d in &imgs{black_box(dec(d));}let t=Instant::now();let mut s=0;for _ in 0..n{for d in &imgs{s^=dec(d)}}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*imgs.len())as f64)}
          RS
          for d in /tmp/base /tmp/cand; do mkdir -p "$d/examples"; cp /tmp/bench.rs "$d/examples/fuse_vp8l.rs"; (cd "$d" && cargo build --release --example fuse_vp8l); done
      - name: Hash all outputs and benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -t BF </tmp/vp8l-files.txt
          CF=(); for p in "${BF[@]}"; do CF+=("${p/\/tmp\/base/\/tmp\/cand}"); done
          B=/tmp/base/target/release/examples/fuse_vp8l; C=/tmp/cand/target/release/examples/fuse_vp8l
          "$B" hash "${BF[@]}" | sed 's#/tmp/base#/tmp/tree#' >/tmp/b.hash
          "$C" hash "${CF[@]}" | sed 's#/tmp/cand#/tmp/tree#' >/tmp/c.hash
          diff -u /tmp/b.hash /tmp/c.hash
          : >/tmp/r.tsv
          taskset -c 0 "$B" bench 20 "${BF[@]}" >/dev/null; taskset -c 0 "$C" bench 20 "${CF[@]}" >/dev/null
          for r in {1..17}; do if ((r%2)); then o='base cand'; else o='cand base'; fi; for v in $o; do if [[ $v == base ]]; then x=$B; files=("${BF[@]}"); else x=$C; files=("${CF[@]}"); fi; u=$(taskset -c 0 "$x" bench 120 "${files[@]}"); printf 'vp8l\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv; done; done
      - name: Persist result
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,os,statistics,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for _,r,v,x in rows:x=float(x);g.setdefault(v,[]).append(x);rr.setdefault(int(r),{})[v]=x
          b=statistics.median(g['base']);c=statistics.median(g['cand']);p=[z['base']/z['cand'] for _,z in sorted(rr.items())]
          L=['# VP8L color/green fusion benchmark','',f'- baseline: `{os.environ["BASE"]}`',f'- candidate: `{os.environ["CAND"]}`',f'- CPU: `{os.environ["CPU"]}`',f'- static VP8L fixtures: `{os.environ["COUNT"]}`','- full decoded output hash matched for every fixture','- candidate passed tests, docs, Clippy, formatting, and Rust 1.80.1','- normal release target; 17 alternating paired rounds','','| Workload | baseline | candidate | ratio of medians | paired median | range |','|---|---:|---:|---:|---:|---:|',f'| VP8L corpus | {b:.3f} us | {c:.3f} us | {b/c:.4f}x | {statistics.median(p):.4f}x | {min(p):.4f}–{max(p):.4f}x |']
          pathlib.Path('benchmark-vp8l-color-green-fusion.md').write_text('\n'.join(L+['']))
          PY
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-color-green-fusion.md; git commit -m 'Record VP8L color/green fusion benchmark'; git push origin HEAD:bench-vp8l-color-green-fusion
