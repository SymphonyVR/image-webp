name: Benchmark VP8L paired color multiply v2
on:
  push:
    branches: [bench-vp8l-color-paired-mul-current]
    paths: [.github/workflows/bench-vp8l-color-paired-mul-current-v2.yml]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy,rustfmt"
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - name: Run repaired matrix
        shell: bash
        run: |
          cp tools/bench_vp8l_color_paired_mul_current.py /tmp/pair.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pair.py');s=p.read_text()
          old=" assert old in s;p.write_text(s.replace(old,new,1))"
          new=""" assert old in s\n s=s.replace(old,new,1)\n if v=='pair_byte':\n  old_delta='''fn color_transform_delta(t: i8, c: i8) -> u32 {\\n    (i32::from(t) * i32::from(c)) as u32 >> 5\\n}'''\n  assert old_delta in s\n  s=s.replace(old_delta,'',1)\n p.write_text(s)"""
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          python3 /tmp/pair.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-color-paired-mul-current.md
          git commit -m 'Record VP8L paired color-multiply benchmark'
          git push origin HEAD:bench-vp8l-color-paired-mul-current
