name: Benchmark VP8L color unroll
on:
  push:
    branches: [bench-vp8l-color-unroll-current]
    paths: [.github/workflows/bench-vp8l-color-unroll-current.yml]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy,rustfmt"
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - run: python3 tools/bench_vp8l_color_unroll_current.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-color-unroll-current.md
          git commit -m 'Record VP8L color-unroll benchmark'
          git push origin HEAD:bench-vp8l-color-unroll-current
