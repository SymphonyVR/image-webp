name: Benchmark clean VP8L composed v3
on:
  push:
    branches: [bench-vp8l-composed-v3]
    paths:
      - tools/bench_vp8l_composed_v3.py
      - .github/workflows/bench-vp8l-composed-v3.yml
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: python3 tools/bench_vp8l_composed_v3.py
      - if: always()
        run: |
          if [ -f benchmark-vp8l-composed-v3.md ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add benchmark-vp8l-composed-v3.md
            git commit -m 'Record clean VP8L composed v3 benchmark' || true
            git push origin HEAD:bench-vp8l-composed-v3
          fi
