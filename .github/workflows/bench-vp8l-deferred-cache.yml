name: Benchmark deferred VP8L color cache updates
on:
  push:
    branches: [ bench-vp8l-cache-tail-final ]
    paths: [ .github/workflows/bench-vp8l-deferred-cache.yml ]
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Build candidates
        shell: bash
        run: |
          set -euxo pipefail
          BASE=00c9bf309f8286509832948a67d4fbcdb2933adc
          git worktree add --detach /tmp/base "$BASE";cp -a /tmp/base /tmp/cand
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cand/src/lossless/decoder/mod.rs');s=p.read_text()
          marker='''        let mut tree = &huffman_info.huffman_code_groups[huff_index];\n        let mut index = 0;\n'''
          rep='''        let mut tree = &huffman_info.huffman_code_groups[huff_index];\n        let mut index = 0;\n        let mut last_cached = 0usize;\n'''
          if marker not in s: raise SystemExit('index marker missing')
          s=s.replace(marker,rep,1)
          # Single-node runs are identical pixels: flush prior pending pixels, then one insert represents the whole run.
          old='''                        if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                            color_cache.insert(value);\n                        }\n\n                        index += n;\n'''
          new='''                        if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                            for pixel in data[last_cached * 4..index * 4].chunks_exact(4) {\n                                color_cache.insert(pixel.try_into().unwrap());\n                            }\n                            color_cache.insert(value);\n                            last_cached = index + n;\n                        }\n\n                        index += n;\n'''
          if old not in s: raise SystemExit('single marker missing')
          s=s.replace(old,new,1)
          # Defer ordinary literal inserts.
          old='''                if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                    color_cache.insert([red, green, blue, alpha]);\n                }\n                index += 1;\n'''
          if old not in s: raise SystemExit('literal marker missing')
          s=s.replace(old,'                index += 1;\n',1)
          # Defer ordinary backref inserts.
          old='''                    if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                        for pixel in data[index * 4..][..length * 4].chunks_exact(4) {\n                            color_cache.insert(pixel.try_into().unwrap());\n                        }\n                    }\n'''
          if old not in s: raise SystemExit('backref marker missing')
          s=s.replace(old,'',1)
          # Flush only when a cache code can observe cache state. Cache-derived pixels hash back to their own slot, so advance last_cached after emitting them.
          old='''                let color_cache = huffman_info\n                    .color_cache\n                    .as_mut()\n                    .ok_or(DecodingError::BitStreamError)?;\n                let color = color_cache.lookup((code - 280).into());\n'''
          new='''                let color_cache = huffman_info\n                    .color_cache\n                    .as_mut()\n                    .ok_or(DecodingError::BitStreamError)?;\n                for pixel in data[last_cached * 4..index * 4].chunks_exact(4) {\n                    color_cache.insert(pixel.try_into().unwrap());\n                }\n                last_cached = index;\n                let color = color_cache.lookup((code - 280).into());\n'''
          if old not in s: raise SystemExit('lookup marker missing')
          s=s.replace(old,new,1)
          # Advance over one or two cache-derived pixels; reinserting them is a no-op on the same cache slot.
          old='''                data[index * 4..][..4].copy_from_slice(&color);\n                index += 1;\n\n                if index < next_block_start {\n'''
          new='''                data[index * 4..][..4].copy_from_slice(&color);\n                index += 1;\n                last_cached = index;\n\n                if index < next_block_start {\n'''
          if old not in s: raise SystemExit('lookup advance marker missing')
          s=s.replace(old,new,1)
          old='''                            data[index * 4..][..4]\n                                .copy_from_slice(&color_cache.lookup((code - 280).into()));\n                            index += 1;\n'''
          new='''                            data[index * 4..][..4]\n                                .copy_from_slice(&color_cache.lookup((code - 280).into()));\n                            index += 1;\n                            last_cached = index;\n'''
          if old not in s: raise SystemExit('second cache marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          (cd /tmp/cand&&cargo fmt&&cargo test -q&&cargo doc -q&&cargo clippy --all-features -- -D warnings&&cargo fmt -- --check)
          rustup toolchain install 1.80.1 --profile minimal
          (cd /tmp/cand&&cargo +1.80.1 build -q)
          echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
      - name: Benchmark
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def chunks(d):
            if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP':return []
            o=[];p=12
            while p+8<=len(d):f=d[p:p+4];n=int.from_bytes(d[p+4:p+8],'little');o.append(f);p+=8+n+(n&1)
            return o
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
            c=chunks(p.read_bytes())
            if b'VP8L' in c and b'ANIM' not in c:print(p)
          PY
          sudo apt-get update -qq;sudo apt-get install -y webp
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
            f.write(f'P6\n{w} {h}\n255\n'.encode());row=bytearray(w*3)
            for y in range(h):
              for x in range(w):
                i=x*3;row[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255;row[i+1]=(x*2+y*7+((x*y)>>10))&255;row[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
              f.write(row)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          cat >/tmp/bench.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};
          fn hash(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b.iter().fold(1469598103934665603u64,|h,&z|(h^z as u64).wrapping_mul(1099511628211))}
          fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();black_box(b[0]as u64^((b[b.len()/2]as u64)<<8)^((b[b.len()-1]as u64)<<16))}
          fn main(){let mut a=std::env::args().skip(1);let mode=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if mode=="hash"{for d in &ds{println!("{:016x}",hash(d))}return}for d in &ds{black_box(dec(d));}let t=Instant::now();let mut s=0;for _ in 0..n{for d in &ds{s^=dec(d)}}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/bench.rs "$d/examples/dcache.rs";(cd "$d"&&cargo build --release --example dcache -q);done
          mapfile -t BF </tmp/files.txt;CF=();for p in "${BF[@]}";do CF+=("${p/\/tmp\/base/\/tmp\/cand}");done;B=/tmp/base/target/release/examples/dcache;C=/tmp/cand/target/release/examples/dcache
          diff -u <($B hash 1 "${BF[@]}" /tmp/large.webp) <($C hash 1 "${CF[@]}" /tmp/large.webp)
          : >/tmp/r.tsv
          for r in {1..17};do if ((r%2));then o='base cand';else o='cand base';fi;for v in $o;do if [[ $v == base ]];then x=$B;f=("${BF[@]}");else x=$C;f=("${CF[@]}");fi;u=$(taskset -c 0 "$x" bench 120 "${f[@]}");printf 'corpus\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$x" bench 2 /tmp/large.webp);printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
      - name: Persist
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,statistics,os,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:g.setdefault((w,v),[]).append(float(x));rr.setdefault((w,int(r)),{})[v]=float(x)
          L=['# VP8L deferred color-cache benchmark','',f'- CPU: `{os.environ["CPU"]}`','- full hashes match; tests/docs/Clippy/fmt/MSRV passed','','| workload | baseline | candidate | paired median | range |','|---|---:|---:|---:|---:|']
          for w in ('corpus','large'):
            b=statistics.median(g[w,'base']);c=statistics.median(g[w,'cand']);p=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {b:.3f} us | {c:.3f} us | {statistics.median(p):.4f}x | {min(p):.4f}–{max(p):.4f}x |')
          pathlib.Path('benchmark-vp8l-deferred-cache.md').write_text('\n'.join(L+['']))
          PY
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add benchmark-vp8l-deferred-cache.md;git commit -m 'Record VP8L deferred-cache benchmark';git push origin HEAD:bench-vp8l-cache-tail-final
