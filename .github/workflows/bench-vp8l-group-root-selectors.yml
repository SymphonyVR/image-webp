name: VP8L group-root selector matrix

on:
  push:
    branches: [bench-vp8l-group-root-selectors]
    paths:
      - tools/bench_vp8l_group_root_selectors.py
      - .github/workflows/bench-vp8l-group-root-selectors.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - name: Benchmark selectors
        run: python3 tools/bench_vp8l_group_root_selectors.py
      - name: Persist selector matrix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-group-root-selectors.md
          git commit -m 'Record VP8L group-root selector matrix'
          git pull --rebase origin bench-vp8l-group-root-selectors
          git push origin HEAD:bench-vp8l-group-root-selectors
