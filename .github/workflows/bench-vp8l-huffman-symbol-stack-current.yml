name: Benchmark VP8L Huffman symbol stack
on:
  push:
    branches: [bench-vp8l-huffman-symbol-stack-current]
    paths: [.github/workflows/bench-vp8l-huffman-symbol-stack-current.yml]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy,rustfmt"
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - name: Run current-tree matrix
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/SymphonyVR/image-webp/bench-vp8l-secondary-reserve-current/tools/bench_vp8l_secondary_reserve_current.py -o /tmp/sym.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sym.py');s=p.read_text()
          s=s.replace("BASE='84d8d20753fce0a9972e8a244fdf929b5a55671c'","BASE='4f322d44fb38747659451db3d7f1dac7ff8ff21f'")
          s=s.replace("TMP=Path('/tmp/vp8l-secondary-reserve')","TMP=Path('/tmp/vp8l-huffman-symbol-stack')")
          s=s.replace("VS=('base','r32','r64','r128')","VS=('base','s256','s512')")
          a=s.index('def patch(r,n):');b=s.index('def inv(',a)
          replacement=r'''def patch(r,n):
 p=r/'src/lossless/decoder/huffman.rs';s=p.read_text()
 old='        let mut sorted_symbols = vec![0u16; code_lengths.len()];\n'
 new=f''' + "'''" + r'''        let mut sorted_symbols_stack = [0u16; {n}];
        let mut sorted_symbols_heap = Vec::new();
        let sorted_symbols: &mut [u16] = if code_lengths.len() <= {n} {{
            &mut sorted_symbols_stack[..code_lengths.len()]
        }} else {{
            sorted_symbols_heap.resize(code_lengths.len(), 0);
            &mut sorted_symbols_heap
        }};
''' + "'''" + r'''
 assert old in s;p.write_text(s.replace(old,new,1))
'''
          s=s[:a]+replacement+s[b:]
          s=s.replace("int(v[1:])","int(v[1:])")
          s=s.replace('VP8L secondary Huffman reserve current-tree matrix','VP8L Huffman symbol-stack current-tree matrix')
          s=s.replace('benchmark-vp8l-secondary-reserve-current.md','benchmark-vp8l-huffman-symbol-stack-current.md')
          p.write_text(s)
          PY
          python3 /tmp/sym.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-huffman-symbol-stack-current.md
          git commit -m 'Record VP8L Huffman symbol-stack benchmark'
          git push origin HEAD:bench-vp8l-huffman-symbol-stack-current
