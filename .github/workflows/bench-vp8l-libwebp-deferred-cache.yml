name: Benchmark VP8L libwebp-style deferred cache
on:
  push:
    branches: [ bench-vp8l-libwebp-deferred-cache ]
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Build candidate
        shell: bash
        run: |
          set -euxo pipefail
          BASE=2d4578f05c46f7d55060ec7384d8dac654107ba1
          git worktree add --detach /tmp/base "$BASE"
          git worktree add --detach /tmp/cand "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cand/src/lossless/decoder/mod.rs')
          s=p.read_text()
          s=s.replace('''        let mut index = 0;\n\n        let mut next_block_start = 0;\n''','''        let mut index = 0;\n        // Match libwebp's last_cached strategy: decoded pixels are only\n        // inserted when a cache lookup can observe the cache state.\n        let mut last_cached = 0usize;\n\n        let mut next_block_start = 0;\n''',1)
          for old in [
          '''                        if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                            color_cache.insert(value);\n                        }\n\n''',
          '''                if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                    color_cache.insert([red, green, blue, alpha]);\n                }\n''',
          '''                    if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                        // The cache is unobservable while a backreference is copied. For an\n                        // overlapping copy, output is periodic with period `dist`, so only the\n                        // final occurrence of each phase is needed to reproduce the final cache.\n                        let cache_pixels = length.min(dist);\n                        let cache_start = index + length - cache_pixels;\n                        for pixel in data[cache_start * 4..][..cache_pixels * 4].chunks_exact(4) {\n                            color_cache.insert(pixel.try_into().unwrap());\n                        }\n                    }\n''']:
              if old not in s: raise SystemExit('cache insertion marker missing')
              s=s.replace(old,'',1)
          old='''            } else {\n                //color cache, so use previously stored pixels to get this pixel\n                let color_cache = huffman_info\n                    .color_cache\n                    .as_mut()\n                    .ok_or(DecodingError::BitStreamError)?;\n'''
          new='''            } else {\n                // Color-cache state is only observable at a cache lookup. Bring it\n                // up to date in one tight pass, like libwebp's `last_cached`.\n                if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                    for pixel in data[last_cached * 4..index * 4].chunks_exact(4) {\n                        color_cache.insert(pixel.try_into().unwrap());\n                    }\n                    last_cached = index;\n                }\n                let color_cache = huffman_info\n                    .color_cache\n                    .as_mut()\n                    .ok_or(DecodingError::BitStreamError)?;\n'''
          if old not in s: raise SystemExit('lookup marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          (cd /tmp/cand && cargo fmt && cargo test -q && cargo doc -q && cargo clippy --all-features -- -D warnings && cargo fmt -- --check)
          rustup toolchain install 1.80.1 --profile minimal
          (cd /tmp/cand && cargo +1.80.1 build -q)
          echo "CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
      - name: Benchmark
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def chunks(d):
            if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP': return []
            p=12;o=[]
            while p+8<=len(d):
              f=d[p:p+4];n=int.from_bytes(d[p+4:p+8],'little');o.append(f);p+=8+n+(n&1)
            return o
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
            c=chunks(p.read_bytes())
            if b'VP8L' in c and b'ANIM' not in c: print(p)
          PY
          sudo apt-get update -qq
          sudo apt-get install -y webp
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
            f.write(f'P6\n{w} {h}\n255\n'.encode());r=bytearray(w*3)
            for y in range(h):
              for x in range(w):
                i=x*3;r[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255;r[i+1]=(x*2+y*7+((x*y)>>10))&255;r[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
              f.write(r)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          cat >/tmp/bench.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};
          fn decode(d:&[u8])->Vec<u8>{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b}
          fn hash(d:&[u8])->u64{decode(d).iter().fold(1469598103934665603u64,|h,&z|(h^z as u64).wrapping_mul(1099511628211))}
          fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if m=="hash"{for d in &ds{println!("{:016x}",hash(d))}return}for d in &ds{black_box(decode(d));}let t=Instant::now();for _ in 0..n{for d in &ds{black_box(decode(d));}}println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
          RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/bench.rs "$d/examples/dc.rs";(cd "$d"&&cargo build --release --example dc -q);done
          mapfile -t BF </tmp/files.txt;CF=();for p in "${BF[@]}";do CF+=("${p/\/tmp\/base/\/tmp\/cand}");done
          B=/tmp/base/target/release/examples/dc;C=/tmp/cand/target/release/examples/dc
          diff -u <($B hash 1 "${BF[@]}" /tmp/large.webp) <($C hash 1 "${CF[@]}" /tmp/large.webp)
          : >/tmp/r.tsv
          for r in {1..17};do if ((r%2));then O='base cand';else O='cand base';fi;for v in $O;do if [[ $v == base ]];then X=$B;F=("${BF[@]}");else X=$C;F=("${CF[@]}");fi;u=$(taskset -c 0 "$X" bench 80 "${F[@]}");printf 'corpus\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$X" bench 2 /tmp/large.webp);printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
          python3 - <<'PY'
          import csv,statistics,os,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={};rr={}
          for w,r,v,x in rows:g.setdefault((w,v),[]).append(float(x));rr.setdefault((w,int(r)),{})[v]=float(x)
          L=['# VP8L deferred color-cache benchmark','',f'- CPU: `{os.environ["CPU"]}`','- direct safe-Rust port of libwebp last_cached strategy','- full output hashes match; stable/MSRV verification passed','','| workload | baseline | candidate | paired median | range |','|---|---:|---:|---:|---:|']
          for w in ('corpus','large'):
            b=statistics.median(g[w,'base']);c=statistics.median(g[w,'cand']);p=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {b:.3f} us | {c:.3f} us | {statistics.median(p):.4f}x | {min(p):.4f}–{max(p):.4f}x |')
          pathlib.Path('benchmark-vp8l-libwebp-deferred-cache.md').write_text('\n'.join(L+['']))
          PY
          cp /tmp/cand/src/lossless/decoder/mod.rs src/lossless/decoder/mod.rs
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/mod.rs benchmark-vp8l-libwebp-deferred-cache.md
          git commit -m 'Record libwebp-style deferred cache benchmark'
          git push origin HEAD:bench-vp8l-libwebp-deferred-cache
