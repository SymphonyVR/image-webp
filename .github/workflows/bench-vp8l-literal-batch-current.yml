name: Benchmark VP8L batched literal Huffman current
on:
  push:
    branches: [bench-vp8l-literal-batch-current]
    paths:
      - tools/bench_vp8l_literal_batch_current.py
      - .github/workflows/bench-vp8l-literal-batch-current.yml
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - run: python3 tools/bench_vp8l_literal_batch_current.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-literal-batch-current.md
          git commit -m 'Record batched literal Huffman matrix'
          git push origin HEAD:bench-vp8l-literal-batch-current
