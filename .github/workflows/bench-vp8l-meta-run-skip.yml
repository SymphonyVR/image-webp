name: VP8L meta-Huffman run-skip
on:
  push:
    branches: [bench-vp8l-meta-run-skip]
    paths:
      - tools/bench_vp8l_meta_run_skip.py
      - tools/bench_vp8l_meta_run_skip_fixed.py
      - .github/workflows/bench-vp8l-meta-run-skip.yml
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: python3 tools/bench_vp8l_meta_run_skip_fixed.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-meta-run-skip.md
          git commit -m 'Record VP8L meta-Huffman run-skip matrix'
          git push origin HEAD:bench-vp8l-meta-run-skip
