name: Benchmark packed VP8L predictors current final
on:
  push:
    branches: [bench-vp8l-packed-predictors-current]
    paths:
      - tools/bench_vp8l_packed_predictors_current.py
      - .github/workflows/bench-vp8l-packed-predictors-current.yml
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - name: Rebase harness and ignore candidate-only dead helpers
        run: |
          sed -i 's/0881ec1a66f09e11b766c309cf6e651077775bd9/c52de05b9c902a6743941b998c96d5e4d3ba3609/' tools/bench_vp8l_packed_predictors_current.py
          sed -i "s/'cargo','clippy','--','-D','warnings'/'cargo','clippy','--','-D','warnings','-A','dead-code'/" tools/bench_vp8l_packed_predictors_current.py
      - run: python3 tools/bench_vp8l_packed_predictors_current.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-packed-predictors-current.md
          git commit -m 'Record current packed predictor matrix'
          git push origin HEAD:bench-vp8l-packed-predictors-current
