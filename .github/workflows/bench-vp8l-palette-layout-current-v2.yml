name: Benchmark VP8L small-palette layout v2
on:
  push:
    branches: [bench-vp8l-palette-layout-current-v2]
    paths: [.github/workflows/bench-vp8l-palette-layout-current-v2.yml]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy,rustfmt"
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - name: Run matrix on latest composed tree
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/SymphonyVR/image-webp/bench-vp8l-palette-layout-current/tools/bench_vp8l_palette_layout_current.py -o /tmp/pal.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pal.py');s=p.read_text()
          s=s.replace("BASE='84d8d20753fce0a9972e8a244fdf929b5a55671c'","BASE='4f322d44fb38747659451db3d7f1dac7ff8ff21f'")
          s=s.replace("TMP=Path('/tmp/vp8l-palette-layout')","TMP=Path('/tmp/vp8l-palette-layout-v2')")
          a=s.index('def patch_reverse(s):')
          b=s.index('def patch(r,v):',a)
          replacement=r'''def patch_reverse(s):
 a=s.index('    let mut packed_indices_for_row: Vec<u8> = vec![0; packed_image_width_in_blocks];')
 b=s.index('\n}\n\n//predictor functions',a)
 new=''' + "'''" + r'''    for y_rev_idx in 0..height as usize {
        let y = height as usize - 1 - y_rev_idx;
        let packed_row_input_global_offset = y * input_stride_bytes_packed;
        let output_row_global_offset = y * output_stride_bytes_expanded;

        for block_index in (0..packed_image_width_in_blocks).rev() {
            let packed_index = image_data[packed_row_input_global_offset + block_index * 4 + 1];
            let output_offset = output_row_global_offset + block_index * EXP_ENTRY_SIZE;
            let is_final = block_index + 1 == packed_image_width_in_blocks;
            if is_final && final_block_expanded_size_bytes != EXP_ENTRY_SIZE {
                image_data[output_offset..output_offset + final_block_expanded_size_bytes]
                    .copy_from_slice(
                        &expanded_lookup_table_array[packed_index as usize]
                            [..final_block_expanded_size_bytes],
                    );
            } else {
                image_data[output_offset..output_offset + EXP_ENTRY_SIZE]
                    .copy_from_slice(&expanded_lookup_table_array[packed_index as usize]);
            }
        }
    }
''' + "'''" + r'''
 return s[:a]+new+s[b:]
'''
          s=s[:a]+replacement+s[b:]
          s=s.replace('VP8L small-palette layout current-tree matrix','VP8L small-palette layout current-tree matrix v2')
          s=s.replace('benchmark-vp8l-palette-layout-current.md','benchmark-vp8l-palette-layout-current-v2.md')
          p.write_text(s)
          PY
          python3 /tmp/pal.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-palette-layout-current-v2.md
          git commit -m 'Record VP8L small-palette layout v2 benchmark'
          git push origin HEAD:bench-vp8l-palette-layout-current-v2
