name: Confirm VP8L direct predictors on composed tree
on:
  push:
    branches: [bench-vp8l-predictor-direct-on-composed]
    paths:
      - tools/bench_vp8l_predictor_direct_on_composed.py
      - .github/workflows/bench-vp8l-predictor-direct-on-composed.yml
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: python3 tools/bench_vp8l_predictor_direct_on_composed.py
      - if: always()
        run: |
          if [ -f benchmark-vp8l-predictor-direct-on-composed.md ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add benchmark-vp8l-predictor-direct-on-composed.md
            git commit -m 'Record composed-tree direct predictor confirmation' || true
            git push origin HEAD:bench-vp8l-predictor-direct-on-composed
          fi
