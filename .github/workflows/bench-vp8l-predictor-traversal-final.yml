name: Benchmark VP8L predictor traversal
on:
  push:
    branches: [ bench-vp8l-predictor-traversal-final ]
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build candidates
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^);echo "BASE=$BASE" >> "$GITHUB_ENV";echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE";for v in index fuse both;do git worktree add --detach "/tmp/$v" "$BASE";done
          cat >/tmp/patch.py <<'PY'
          import sys
          from pathlib import Path
          v=sys.argv[1];p=Path(sys.argv[2])/'src/lossless/decoder/reverse_transform.rs';s=p.read_text();a=s.index('pub(crate) fn apply_predictor_transform(');b=s.index('pub fn apply_predictor_transform_0(',a)
          pre=r'''pub(crate) fn apply_predictor_transform(
    image_data: &mut [u8], width: u16, height: u16, size_bits: u8, predictor_data: &[u8],
) -> Result<(), DecodingError> {
    let block_xsize=usize::from(subsample_size(width,size_bits));let width=usize::from(width);let height=usize::from(height);
    image_data[3]=image_data[3].wrapping_add(255);apply_predictor_transform_1(image_data,4..width*4,width);
'''
          dispatch=r'''            match predictor {
                0=>apply_predictor_transform_0(image_data,start_index..end_index,width),1=>apply_predictor_transform_1(image_data,start_index..end_index,width),
                2=>apply_predictor_transform_2(image_data,start_index..end_index,width),3=>apply_predictor_transform_3(image_data,start_index..end_index,width),
                4=>apply_predictor_transform_4(image_data,start_index..end_index,width),5=>apply_predictor_transform_5(image_data,start_index..end_index,width),
                6=>apply_predictor_transform_6(image_data,start_index..end_index,width),7=>apply_predictor_transform_7(image_data,start_index..end_index,width),
                8=>apply_predictor_transform_8(image_data,start_index..end_index,width),9=>apply_predictor_transform_9(image_data,start_index..end_index,width),
                10=>apply_predictor_transform_10(image_data,start_index..end_index,width),11=>apply_predictor_transform_11(image_data,start_index..end_index,width),
                12=>apply_predictor_transform_12(image_data,start_index..end_index,width),13=>apply_predictor_transform_13(image_data,start_index..end_index,width),_=>{}
            }
'''
          if v=='index':
            body=r'''    for y in 1..height { for i in 0..4 { image_data[y*width*4+i]=image_data[y*width*4+i].wrapping_add(image_data[(y-1)*width*4+i]); } }
    let tile_mask=(1usize<<size_bits)-1;let mut pred_row=(1usize>>size_bits)*block_xsize;
    for y in 1..height {
        for block_x in 0..block_xsize {
            let predictor=predictor_data[(pred_row+block_x)*4+1];let start_index=(y*width+(block_x<<size_bits).max(1))*4;let end_index=(y*width+((block_x+1)<<size_bits).min(width))*4;
DISPATCH        }
        if ((y+1)&tile_mask)==0 { pred_row+=block_xsize; }
    }
    Ok(())
}
'''
          elif v=='fuse':
            body=r'''    for y in 1..height {
        for i in 0..4 { image_data[y*width*4+i]=image_data[y*width*4+i].wrapping_add(image_data[(y-1)*width*4+i]); }
        for block_x in 0..block_xsize {
            let block_index=(y>>size_bits)*block_xsize+block_x;let predictor=predictor_data[block_index*4+1];let start_index=(y*width+(block_x<<size_bits).max(1))*4;let end_index=(y*width+((block_x+1)<<size_bits).min(width))*4;
DISPATCH        }
    }
    Ok(())
}
'''
          else:
            body=r'''    let tile_mask=(1usize<<size_bits)-1;let mut pred_row=(1usize>>size_bits)*block_xsize;
    for y in 1..height {
        for i in 0..4 { image_data[y*width*4+i]=image_data[y*width*4+i].wrapping_add(image_data[(y-1)*width*4+i]); }
        for block_x in 0..block_xsize {
            let predictor=predictor_data[(pred_row+block_x)*4+1];let start_index=(y*width+(block_x<<size_bits).max(1))*4;let end_index=(y*width+((block_x+1)<<size_bits).min(width))*4;
DISPATCH        }
        if ((y+1)&tile_mask)==0 { pred_row+=block_xsize; }
    }
    Ok(())
}
'''
          body=body.replace('DISPATCH',dispatch)
          p.write_text(s[:a]+pre+body+s[b:])
          PY
          rustup toolchain install 1.80.1 --profile minimal
          for v in index fuse both;do python3 /tmp/patch.py "$v" "/tmp/$v";(cd "/tmp/$v"&&cargo fmt&&cargo test -q&&cargo +1.80.1 build -q);done
      - name: Benchmark
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def chunks(d):
            if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP':return []
            o=[];p=12
            while p+8<=len(d):f=d[p:p+4];n=int.from_bytes(d[p+4:p+8],'little');o.append(f);p+=8+n+(n&1)
            return o
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
            c=chunks(p.read_bytes())
            if b'VP8L' in c and b'ANIM' not in c:print(p)
          PY
          sudo apt-get update -qq;sudo apt-get install -y webp >/dev/null
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
            f.write(f'P6\n{w} {h}\n255\n'.encode());row=bytearray(w*3)
            for y in range(h):
              for x in range(w):
                i=x*3;row[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255;row[i+1]=(x*2+y*7+((x*y)>>10))&255;row[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
              f.write(row)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          cat >/tmp/b.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};fn d(x:&[u8])->Vec<u8>{let mut q=WebPDecoder::new(Cursor::new(x)).unwrap();let mut b=vec![0;q.output_buffer_size().unwrap()];q.read_image(&mut b).unwrap();b}fn h(x:&[u8])->u64{d(x).iter().fold(0xcbf29ce484222325u64,|a,&z|(a^z as u64).wrapping_mul(1099511628211))}fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if m=="h"{for x in&ds{println!("{:x}",h(x))}return}for x in&ds{black_box(d(x));}let t=Instant::now();for _ in 0..n{for x in&ds{black_box(d(x));}}println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
          RS
          for v in base index fuse both;do mkdir -p "/tmp/$v/examples";cp /tmp/b.rs "/tmp/$v/examples/ptrav.rs";(cd "/tmp/$v"&&RUSTFLAGS='-C target-cpu=native' cargo build --release --example ptrav -q);done
          mapfile -t BF </tmp/files.txt;B=/tmp/base/target/release/examples/ptrav
          for v in index fuse both;do CF=();for p in "${BF[@]}";do CF+=("${p/\/tmp\/base/\/tmp\/$v}");done;C="/tmp/$v/target/release/examples/ptrav";diff -u <($B h 1 "${BF[@]}" /tmp/large.webp) <($C h 1 "${CF[@]}" /tmp/large.webp);done
          : >/tmp/r.tsv;for r in {1..13};do for v in base index fuse both;do if [[ $v == base ]];then X=$B;F=("${BF[@]}");else X="/tmp/$v/target/release/examples/ptrav";F=();for p in "${BF[@]}";do F+=("${p/\/tmp\/base/\/tmp\/$v}");done;fi;u=$(taskset -c 0 "$X" t 70 "${F[@]}");printf 'corpus\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$X" t 4 /tmp/large.webp);printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
          python3 - <<'PY'
          import csv,statistics,os;from pathlib import Path
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));rr={}
          for w,r,v,x in rows:rr.setdefault((w,int(r)),{})[v]=float(x)
          L=['# VP8L predictor traversal matrix','',f'- baseline: `{os.environ["BASE"]}`',f'- CPU: `{os.environ["CPU"]}`','- hashes + tests + MSRV passed','','| workload | candidate | paired median | positive | range |','|---|---|---:|---:|---:|']
          for w in ('corpus','large'):
            for v in ('index','fuse','both'):
              q=[z['base']/z[v] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {v} | {statistics.median(q):.4f}x | {sum(x>1 for x in q)}/{len(q)} | {min(q):.4f}–{max(q):.4f}x |')
          Path('benchmark-vp8l-predictor-traversal-final.md').write_text('\n'.join(L+['']))
          PY
          cat benchmark-vp8l-predictor-traversal-final.md
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add benchmark-vp8l-predictor-traversal-final.md;git commit -m 'Record VP8L predictor traversal';git push origin HEAD:bench-vp8l-predictor-traversal-final
