name: Benchmark simplified VP8L predictor 11 on current tree
on:
  push:
    branches: [bench-vp8l-predictor11-current-v3]
    paths:
      - .github/workflows/bench-vp8l-predictor11-current-v3.yml
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - name: Build candidate and benchmark
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^)
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE"
          git worktree add --detach /tmp/cand "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cand/src/lossless/decoder/reverse_transform.rs')
          s=p.read_text()
          a=s.index('pub fn apply_predictor_transform_11(')
          b=s.index('pub fn apply_predictor_transform_12(',a)
          new='''pub fn apply_predictor_transform_11(image_data: &mut [u8], range: Range<usize>, width: usize) {
    let (old, current) = image_data[..range.end].split_at_mut(range.start);
    let top = &old[range.start - width * 4..];

    let mut l = [
        i16::from(old[range.start - 4]),
        i16::from(old[range.start - 3]),
        i16::from(old[range.start - 2]),
        i16::from(old[range.start - 1]),
    ];
    let mut tl = [
        i16::from(old[range.start - width * 4 - 4]),
        i16::from(old[range.start - width * 4 - 3]),
        i16::from(old[range.start - width * 4 - 2]),
        i16::from(old[range.start - width * 4 - 1]),
    ];

    for (chunk, top) in current.chunks_exact_mut(4).zip(top.chunks_exact(4)) {
        let t = [
            i16::from(top[0]),
            i16::from(top[1]),
            i16::from(top[2]),
            i16::from(top[3]),
        ];

        let mut predict_left = 0;
        let mut predict_top = 0;
        for i in 0..4 {
            predict_left += i16::abs(t[i] - tl[i]);
            predict_top += i16::abs(l[i] - tl[i]);
        }

        if predict_left < predict_top {
            chunk[0] = chunk[0].wrapping_add(l[0] as u8);
            chunk[1] = chunk[1].wrapping_add(l[1] as u8);
            chunk[2] = chunk[2].wrapping_add(l[2] as u8);
            chunk[3] = chunk[3].wrapping_add(l[3] as u8);
        } else {
            chunk[0] = chunk[0].wrapping_add(t[0] as u8);
            chunk[1] = chunk[1].wrapping_add(t[1] as u8);
            chunk[2] = chunk[2].wrapping_add(t[2] as u8);
            chunk[3] = chunk[3].wrapping_add(t[3] as u8);
        }

        tl = t;
        l = [
            i16::from(chunk[0]),
            i16::from(chunk[1]),
            i16::from(chunk[2]),
            i16::from(chunk[3]),
        ];
    }
}
'''
          p.write_text(s[:a]+new+s[b:])
          PY
          cd /tmp/cand
          cargo fmt
          cargo test -q
          cargo test --release -q
          cargo doc --no-deps -q
          cargo clippy -- -D warnings
          cargo fmt -- --check
          cargo +1.80.1 build -q
          cargo +1.80.1 build --release -q
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def chunks(d):
              if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP': return []
              out=[];p=12
              while p+8<=len(d):
                  t=d[p:p+4];n=int.from_bytes(d[p+4:p+8],'little');out.append(t);p+=8+n+(n&1)
              return out
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
              c=chunks(p.read_bytes())
              if b'VP8L' in c and b'ANIM' not in c: print(p)
          PY
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
              f.write(f'P6\n{w} {h}\n255\n'.encode());row=bytearray(w*3)
              for y in range(h):
                  for x in range(w):
                      i=x*3
                      row[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255
                      row[i+1]=(x*2+y*7+((x*y)>>10))&255
                      row[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
                  f.write(row)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          cat >/tmp/bench.rs <<'RS'
          use image_webp::WebPDecoder;
          use std::{hint::black_box,io::Cursor,time::Instant};
          fn dec(d:&[u8])->Vec<u8>{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b}
          fn hash(d:&[u8])->u64{dec(d).iter().fold(0xcbf29ce484222325u64,|h,&b|(h^u64::from(b)).wrapping_mul(1099511628211))}
          fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if m=="h"{for d in&ds{println!("{:016x}",hash(d))}return}for d in&ds{black_box(dec(d));}let t=Instant::now();for _ in 0..n{for d in&ds{black_box(dec(d));}}println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
          RS
          for d in /tmp/base /tmp/cand; do
            mkdir -p "$d/examples"; cp /tmp/bench.rs "$d/examples/p11v3.rs"
            (cd "$d" && RUSTFLAGS='-C target-cpu=native' cargo build --release --example p11v3 -q)
          done
          mapfile -t BF </tmp/files.txt
          CF=(); for p in "${BF[@]}"; do CF+=("${p/\/tmp\/base/\/tmp\/cand}"); done
          B=/tmp/base/target/release/examples/p11v3
          C=/tmp/cand/target/release/examples/p11v3
          diff -u <($B h 1 "${BF[@]}" /tmp/large.webp) <($C h 1 "${CF[@]}" /tmp/large.webp)
          : >/tmp/r.tsv
          for r in {1..25}; do
            if ((r%2)); then O='base cand'; else O='cand base'; fi
            for v in $O; do
              if [[ $v == base ]]; then X=$B; F=("${BF[@]}"); else X=$C; F=("${CF[@]}"); fi
              u=$(taskset -c 0 "$X" t 70 "${F[@]}"); printf 'corpus\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv
              u=$(taskset -c 0 "$X" t 4 /tmp/large.webp); printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv
            done
          done
          python3 - <<'PY'
          import csv,statistics,os
          from pathlib import Path
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t')); rr={};g={}
          for w,r,v,x in rows:
              rr.setdefault((w,int(r)),{})[v]=float(x);g.setdefault((w,v),[]).append(float(x))
          out=['# VP8L predictor-11 current-tree confirmation','',f'- baseline: `{os.environ["BASE"]}`',f'- CPU: `{os.environ["CPU"]}`','- hashes + tests + release tests + docs + Clippy + fmt + MSRV debug/release passed','- algebra simplification only','','| workload | paired median | positive | range |','|---|---:|---:|---:|']
          for w in ('corpus','large'):
              q=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w]
              out.append(f'| {w} | **{statistics.median(q):.4f}x** | {sum(x>1 for x in q)}/{len(q)} | {min(q):.4f}–{max(q):.4f}x |')
          Path('benchmark-vp8l-predictor11-current-v3.md').write_text('\n'.join(out)+'\n')
          PY
          cat benchmark-vp8l-predictor11-current-v3.md
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-predictor11-current-v3.md
          git commit -m 'Record current predictor-11 confirmation'
          git push origin HEAD:bench-vp8l-predictor11-current-v3
