name: VP8L Huffman root-width v4
on:
  push:
    branches: [bench-vp8l-root-width-v4]
    paths: [tools/bench_vp8l_root_width_v4.py, .github/workflows/bench-vp8l-root-width-v4.yml]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: python3 tools/bench_vp8l_root_width_v4.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-root-width-v4.md
          git commit -m 'Record VP8L Huffman root-width matrix'
          git push origin HEAD:bench-vp8l-root-width-v4
