name: Benchmark VP8L secondary transforms current final
on:
  push:
    branches: [bench-vp8l-secondary-current-final]
    paths:
      - tools/bench_vp8l_secondary_current_final.py
      - .github/workflows/bench-vp8l-secondary-current-final.yml
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - run: python3 tools/bench_vp8l_secondary_current_final.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-secondary-current-final.md
          git commit -m 'Record current-final secondary transform matrix'
          git push origin HEAD:bench-vp8l-secondary-current-final
