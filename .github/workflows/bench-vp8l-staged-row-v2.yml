name: VP8L staged row v2
on:
  push:
    branches: [bench-vp8l-staged-row-v2]
    paths: [tools/bench_vp8l_staged_row_v2.py, .github/workflows/bench-vp8l-staged-row-v2.yml]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustup toolchain install 1.80.1 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: python3 tools/bench_vp8l_staged_row_v2.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-staged-row-v2.md
          git commit -m 'Record correct VP8L staged-row matrix'
          git push origin HEAD:bench-vp8l-staged-row-v2
