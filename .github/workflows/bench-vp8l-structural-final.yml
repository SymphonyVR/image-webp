name: Benchmark final VP8L structural candidates
on:
  push:
    branches: [ bench-vp8l-structural-final ]
    paths: [ .github/workflows/bench-vp8l-structural-final.yml ]
permissions:
  contents: write
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Prepare variants
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^);echo "BASE=$BASE" >> "$GITHUB_ENV";echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE";for v in contig single pred11 contig_single;do cp -a /tmp/base "/tmp/$v";done
          cat >/tmp/patch.py <<'PY'
          from pathlib import Path
          def single(root):
            p=Path(root)/'src/lossless/decoder/mod.rs';s=p.read_text();old='''            if index >= next_block_start {\n                let x = index % usize::from(width);\n                let y = index / usize::from(width);\n                next_block_start = (x | usize::from(huffman_info.mask)).min(usize::from(width - 1))\n                    + y * usize::from(width)\n                    + 1;\n\n                let huff_index = huffman_info.get_huff_index(x as u16, y as u16);\n                tree = &huffman_info.huffman_code_groups[huff_index];\n''';new='''            if index >= next_block_start {\n                let huff_index = if huffman_info.bits == 0 {\n                    next_block_start = num_values;\n                    0\n                } else {\n                    let x = index % usize::from(width);\n                    let y = index / usize::from(width);\n                    next_block_start =\n                        (x | usize::from(huffman_info.mask)).min(usize::from(width - 1))\n                            + y * usize::from(width)\n                            + 1;\n                    huffman_info.get_huff_index(x as u16, y as u16)\n                };\n                tree = &huffman_info.huffman_code_groups[huff_index];\n''';
            if old not in s: raise SystemExit('single marker missing');p.write_text(s.replace(old,new,1))
          def pred11(root):
            p=Path(root)/'src/lossless/decoder/reverse_transform.rs';s=p.read_text();a=s.index('pub fn apply_predictor_transform_11(');b=s.index('pub fn apply_predictor_transform_12(',a)
            f=r'''pub fn apply_predictor_transform_11(image_data: &mut [u8], range: Range<usize>, width: usize) {
    let (old, current) = image_data[..range.end].split_at_mut(range.start);
    let top = &old[range.start - width * 4..];

    let mut l: [u8; 4] = old[range.start - 4..range.start].try_into().unwrap();
    let mut tl: [u8; 4] = old[range.start - width * 4 - 4..range.start - width * 4]
        .try_into()
        .unwrap();

    for (chunk, top) in current.chunks_exact_mut(4).zip(top.chunks_exact(4)) {
        let t: [u8; 4] = top.try_into().unwrap();
        let mut predict_left = 0u16;
        let mut predict_top = 0u16;
        for i in 0..4 {
            // |(L + T - TL) - L| == |T - TL| and
            // |(L + T - TL) - T| == |L - TL|.
            predict_left += u16::from(t[i].abs_diff(tl[i]));
            predict_top += u16::from(l[i].abs_diff(tl[i]));
        }

        let predictor = if predict_left < predict_top { l } else { t };
        for i in 0..4 {
            chunk[i] = chunk[i].wrapping_add(predictor[i]);
        }

        tl = t;
        l.copy_from_slice(chunk);
    }
}
'''
            p.write_text(s[:a]+f+s[b:])
          def contig(root):
            p=Path(root)/'src/lossless/decoder/huffman.rs';s=p.read_text()
            s=s.replace('''    Tree {\n        table_mask: u16,\n        primary_table: Vec<u16>,\n        secondary_table: Vec<u16>,\n    },\n''','''    Tree {\n        table_mask: u16,\n        table: Box<[u16]>,\n    },\n''',1)
            old='''        // Ensure indexes into the secondary table fit in 12 bits.\n        assert!(secondary_table.len() <= 4096);\n\n        Ok(Self(HuffmanTreeInner::Tree {\n            table_mask,\n            primary_table,\n            secondary_table,\n        }))\n''';new='''        // Keep both lookup levels in one allocation. Secondary offsets remain\n        // relative to the end of the primary table.\n        assert!(secondary_table.len() <= 4096);\n        primary_table.extend_from_slice(&secondary_table);\n        Ok(Self(HuffmanTreeInner::Tree {\n            table_mask,\n            table: primary_table.into_boxed_slice(),\n        }))\n''';
            if old not in s: raise SystemExit('contig build marker');s=s.replace(old,new,1)
            old='''        Self(HuffmanTreeInner::Tree {\n            primary_table: vec![(1 << 12) | zero, (1 << 12) | one],\n            table_mask: 0x1,\n            secondary_table: Vec::new(),\n        })\n''';new='''        Self(HuffmanTreeInner::Tree {\n            table: vec![(1 << 12) | zero, (1 << 12) | one].into_boxed_slice(),\n            table_mask: 0x1,\n        })\n''';
            if old not in s: raise SystemExit('contig two-node');s=s.replace(old,new,1)
            a=s.index('''    #[inline(never)]\n    fn read_symbol_slowpath''');b=s.index('''    /// Reads a symbol using the bit reader.''',a)
            slow=r'''    #[inline(never)]
    fn read_symbol_slowpath<R: BufRead>(
        table: &[u16],
        primary_size: usize,
        v: u16,
        primary_table_entry: u16,
        bit_reader: &mut BitReader<R>,
    ) -> Result<u16, DecodingError> {
        let length = primary_table_entry >> 12;
        let mask = (1 << (length - MAX_TABLE_BITS as u16)) - 1;
        let secondary_index = primary_size
            + ((primary_table_entry & 0xfff) as usize)
            + ((v >> MAX_TABLE_BITS) as usize & mask as usize);
        let secondary_entry = table[secondary_index];
        bit_reader.consume((secondary_entry & 0xf) as u8)?;
        Ok(secondary_entry >> 4)
    }

''';s=s[:a]+slow+s[b:]
            old='''            HuffmanTreeInner::Tree {\n                primary_table,\n                secondary_table,\n                table_mask,\n            } => {\n                let v = bit_reader.peek_full() as u16;\n                let entry = primary_table[(v & table_mask) as usize];\n                if (entry >> 12) <= MAX_TABLE_BITS as u16 {\n                    bit_reader.consume((entry >> 12) as u8)?;\n                    return Ok(entry & 0xfff);\n                }\n\n                Self::read_symbol_slowpath(secondary_table, v, entry, bit_reader)\n            }\n''';new='''            HuffmanTreeInner::Tree { table, table_mask } => {\n                let v = bit_reader.peek_full() as u16;\n                let primary_size = usize::from(*table_mask) + 1;\n                let entry = table[(v & table_mask) as usize];\n                if (entry >> 12) <= MAX_TABLE_BITS as u16 {\n                    bit_reader.consume((entry >> 12) as u8)?;\n                    return Ok(entry & 0xfff);\n                }\n                Self::read_symbol_slowpath(table, primary_size, v, entry, bit_reader)\n            }\n''';
            if old not in s: raise SystemExit('contig read');s=s.replace(old,new,1)
            old='''            HuffmanTreeInner::Tree {\n                primary_table,\n                table_mask,\n                ..\n            } => {\n                let v = bit_reader.peek_full() as u16;\n                let entry = primary_table[(v & table_mask) as usize];\n''';new='''            HuffmanTreeInner::Tree { table, table_mask } => {\n                let v = bit_reader.peek_full() as u16;\n                let entry = table[(v & table_mask) as usize];\n''';
            if old not in s: raise SystemExit('contig peek');s=s.replace(old,new,1);p.write_text(s)
          contig('/tmp/contig');single('/tmp/single');pred11('/tmp/pred11');contig('/tmp/contig_single');single('/tmp/contig_single')
          PY
          python3 /tmp/patch.py
          rustup toolchain install 1.80.1 --profile minimal
          for d in /tmp/contig /tmp/single /tmp/pred11 /tmp/contig_single;do (cd "$d"&&cargo fmt&&cargo test -q&&cargo doc -q&&cargo clippy --all-features -- -D warnings&&cargo fmt -- --check&&cargo +1.80.1 build -q);done
      - name: Corpus benchmark
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def chunks(d):
            if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP':return []
            o=[];p=12
            while p+8<=len(d):f=d[p:p+4];n=int.from_bytes(d[p+4:p+8],'little');o.append(f);p+=8+n+(n&1)
            return o
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
            c=chunks(p.read_bytes())
            if b'VP8L' in c and b'ANIM' not in c:print(p)
          PY
          sudo apt-get update -qq;sudo apt-get install -y webp
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
            f.write(f'P6\n{w} {h}\n255\n'.encode());row=bytearray(w*3)
            for y in range(h):
              for x in range(w):
                i=x*3;row[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255;row[i+1]=(x*2+y*7+((x*y)>>10))&255;row[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
              f.write(row)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          cat >/tmp/b.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};fn hash(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b.iter().fold(1469598103934665603u64,|h,&z|(h^z as u64).wrapping_mul(1099511628211))}fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();black_box(b[0]as u64^((b[b.len()/2]as u64)<<8)^((b[b.len()-1]as u64)<<16))}fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if m=="hash"{for d in &ds{println!("{:016x}",hash(d))}return}for d in &ds{black_box(dec(d));}let t=Instant::now();let mut s=0;for _ in 0..n{for d in &ds{s^=dec(d)}}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
RS
          for d in base contig single pred11 contig_single;do mkdir -p "/tmp/$d/examples";cp /tmp/b.rs "/tmp/$d/examples/st.rs";(cd "/tmp/$d"&&cargo build --release --example st -q);done
          mapfile -t BF </tmp/files.txt;BH=$(/tmp/base/target/release/examples/st hash 1 "${BF[@]}" /tmp/large.webp);for v in contig single pred11 contig_single;do CF=();for p in "${BF[@]}";do CF+=("${p/\/tmp\/base/\/tmp\/$v}");done;test "$BH" = "$(/tmp/$v/target/release/examples/st hash 1 "${CF[@]}" /tmp/large.webp)";done;: >/tmp/r.tsv
          for r in {1..13};do V=(base contig single pred11 contig_single);if ((r%2==0));then V=(contig_single pred11 single contig base);fi;for v in "${V[@]}";do X=/tmp/$v/target/release/examples/st;F=();for p in "${BF[@]}";do [[ $v == base ]]&&F+=("$p")||F+=("${p/\/tmp\/base/\/tmp\/$v}");done;u=$(taskset -c 0 "$X" bench 120 "${F[@]}");printf 'corpus\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$X" bench 2 /tmp/large.webp);printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
          python3 - <<'PY'
          import csv,statistics,pathlib,os
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));rr={}
          for w,r,v,x in rows:rr.setdefault((w,int(r)),{})[v]=float(x)
          L=['# Final-tree VP8L structural matrix','',f'- baseline: `{os.environ["BASE"]}`',f'- CPU: `{os.environ["CPU"]}`','- full verification + hashes passed','','| workload | variant | paired speedup | range |','|---|---|---:|---:|']
          for w in ('corpus','large'):
            for v in ('contig','single','pred11','contig_single'):
              q=[z['base']/z[v] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {v} | {statistics.median(q):.4f}x | {min(q):.4f}–{max(q):.4f}x |')
          pathlib.Path('benchmark-vp8l-structural-final.md').write_text('\n'.join(L+['']))
          PY
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add benchmark-vp8l-structural-final.md;git commit -m 'Record final VP8L structural matrix';git push origin HEAD:bench-vp8l-structural-final
