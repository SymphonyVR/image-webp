name: VP8L final tail closure
on:
  push:
    branches: [bench-vp8l-tail-closure-v3]
    paths: [tools/bench_vp8l_tail_closure_v3.py, .github/workflows/bench-vp8l-tail-closure-v3.yml]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: python3 tools/bench_vp8l_tail_closure_v3.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-tail-closure-v3.md
          git commit -m 'Record final VP8L tail closure'
          git push origin HEAD:bench-vp8l-tail-closure-v3
