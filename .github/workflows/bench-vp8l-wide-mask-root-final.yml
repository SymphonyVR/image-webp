name: VP8L low-overhead wide Huffman roots final
on:
  push:
    branches: [bench-vp8l-adaptive-root-selectors-final]
    paths: [tools/bench_vp8l_wide_mask_root_final.py, .github/workflows/bench-vp8l-wide-mask-root-final.yml]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: python3 tools/bench_vp8l_wide_mask_root_final.py
      - run: |
          mv benchmark-vp8l-adaptive-root-final.md benchmark-vp8l-wide-mask-root-final.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-wide-mask-root-final.md
          git commit -m 'Record low-overhead VP8L wide-root matrix'
          git push origin HEAD:bench-vp8l-adaptive-root-selectors-final
