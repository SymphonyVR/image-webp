name: Final VP8L packed color confirmation
on:
  push:
    branches: [confirm-vp8l-color-packed-v2]
    paths: [tools/confirm_vp8l_color_packed.py, .github/workflows/confirm-vp8l-color-packed-v2.yml]
permissions: { contents: write }
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustup toolchain install 1.80.1 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: python3 tools/confirm_vp8l_color_packed.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-color-packed-confirm-v2.md
          git commit -m 'Record final VP8L packed color confirmation'
          git push origin HEAD:confirm-vp8l-color-packed-v2
