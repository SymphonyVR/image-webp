name: Confirm VP8L packed subtract-green current final
on:
  push:
    branches: [confirm-vp8l-green-current-final]
    paths:
      - tools/confirm_vp8l_green_current_final.py
      - .github/workflows/confirm-vp8l-green-current-final.yml
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - run: python3 tools/confirm_vp8l_green_current_final.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-green-current-final.md
          git commit -m 'Record packed subtract-green confirmation'
          git push origin HEAD:confirm-vp8l-green-current-final
