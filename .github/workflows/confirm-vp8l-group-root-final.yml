name: Confirm VP8L group-static roots

on:
  workflow_dispatch:
  push:
    branches: [confirm-vp8l-group-root-final]
    paths:
      - tools/confirm_vp8l_group_root_final.py
      - .github/workflows/confirm-vp8l-group-root-final.yml

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp unzip curl
      - name: Long three-way confirmation
        run: python3 tools/confirm_vp8l_group_root_final.py
      - name: Persist confirmation result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-group-root-confirm-final.md
          git commit -m 'Record VP8L group-root confirmation'
          git pull --rebase origin confirm-vp8l-group-root-final
          git push origin HEAD:confirm-vp8l-group-root-final
