name: Confirm VP8L Huffman allocation composition
on:
  push:
    branches: [ confirm-vp8l-huffman-allocation-final ]
    paths: [ .github/workflows/confirm-vp8l-huffman-allocation-final.yml ]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Build and verify candidate
        shell: bash
        run: |
          set -euxo pipefail
          BASE=$(git rev-parse HEAD^);echo "BASE=$BASE" >> "$GITHUB_ENV";echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE";git worktree add --detach /tmp/cand "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          hp=Path('/tmp/cand/src/lossless/decoder/huffman.rs');mp=Path('/tmp/cand/src/lossless/decoder/mod.rs');h=hp.read_text();m=mp.read_text()
          old='''        let mut next_index = offsets;\n        let mut sorted_symbols = vec![0u16; code_lengths.len()];\n        for symbol in 0..code_lengths.len() {\n'''
          new='''        let mut next_index = offsets;\n        let mut sorted_stack = [0u16; 512];\n        let mut sorted_heap = Vec::new();\n        let sorted_symbols: &mut [u16] = if code_lengths.len() <= sorted_stack.len() {\n            &mut sorted_stack[..code_lengths.len()]\n        } else {\n            sorted_heap.resize(code_lengths.len(), 0);\n            sorted_heap.as_mut_slice()\n        };\n        for symbol in 0..code_lengths.len() {\n'''
          if old not in h: raise SystemExit('sorted marker missing')
          h=h.replace(old,new,1)
          h=h.replace('pub(crate) fn build_implicit(code_lengths: Vec<u16>) -> Result<Self, DecodingError> {','pub(crate) fn build_implicit(code_lengths: &[u16]) -> Result<Self, DecodingError> {',1)
          m=m.replace('let mut code_length_code_lengths = vec![0; CODE_LENGTH_CODES];','let mut code_length_code_lengths = [0u16; CODE_LENGTH_CODES];',1)
          m=m.replace('self.read_huffman_code_lengths(code_length_code_lengths, alphabet_size)?','self.read_huffman_code_lengths(&code_length_code_lengths, alphabet_size)?',1)
          m=m.replace('code_length_code_lengths: Vec<u16>,','code_length_code_lengths: &[u16],',1)
          m=m.replace('HuffmanTree::build_implicit(new_code_lengths)','HuffmanTree::build_implicit(&new_code_lengths)',1)
          hp.write_text(h);mp.write_text(m)
          PY
          rustup toolchain install 1.80.1 --profile minimal
          cd /tmp/cand;cargo fmt;cargo test -q;cargo doc -q;cargo clippy --all-features -- -D warnings;cargo fmt -- --check;cargo +1.80.1 build -q
      - name: Prepare and benchmark
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def chunks(d):
            if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP':return []
            o=[];p=12
            while p+8<=len(d):f=d[p:p+4];n=int.from_bytes(d[p+4:p+8],'little');o.append(f);p+=8+n+(n&1)
            return o
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
            c=chunks(p.read_bytes())
            if b'VP8L' in c and b'ANIM' not in c:print(p)
          PY
          sudo apt-get update -qq;sudo apt-get install -y webp >/dev/null
          python3 - <<'PY'
          w=h=2048
          with open('/tmp/large.ppm','wb') as f:
            f.write(f'P6\n{w} {h}\n255\n'.encode());row=bytearray(w*3)
            for y in range(h):
              for x in range(w):
                i=x*3;row[i]=(x*3+y*5+((x>>5)^(y>>4))*17)&255;row[i+1]=(x*2+y*7+((x*y)>>10))&255;row[i+2]=(x*11+y*3+((x+y)>>3)*9)&255
              f.write(row)
          PY
          cwebp -quiet -lossless -z 9 /tmp/large.ppm -o /tmp/large.webp
          cat >/tmp/b.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};fn image(d:&[u8])->Vec<u8>{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b}fn hash(d:&[u8])->u64{image(d).iter().fold(1469598103934665603u64,|h,&b|(h^u64::from(b)).wrapping_mul(1099511628211))}fn main(){let mut a=std::env::args().skip(1);let m=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if m=="hash"{for d in&ds{println!("{:016x}",hash(d))}return}for d in&ds{black_box(image(d));}let t=Instant::now();for _ in 0..n{for d in&ds{black_box(image(d));}}println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
          RS
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/b.rs "$d/examples/halloc.rs";(cd "$d"&&RUSTFLAGS='-C target-cpu=native' cargo build --release --example halloc -q);done
          mapfile -t BF </tmp/files.txt;CF=();for p in "${BF[@]}";do CF+=("${p/\/tmp\/base/\/tmp\/cand}");done;B=/tmp/base/target/release/examples/halloc;C=/tmp/cand/target/release/examples/halloc;diff -u <($B hash 1 "${BF[@]}" /tmp/large.webp) <($C hash 1 "${CF[@]}" /tmp/large.webp)
          : >/tmp/r.tsv
          for r in {1..25};do if ((r%2));then O='base cand';else O='cand base';fi;for v in $O;do if [[ $v == base ]];then X=$B;F=("${BF[@]}");else X=$C;F=("${CF[@]}");fi;u=$(taskset -c 0 "$X" bench 80 "${F[@]}");printf 'corpus\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;u=$(taskset -c 0 "$X" bench 4 /tmp/large.webp);printf 'large\t%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
          python3 - <<'PY'
          import csv,statistics,os;from pathlib import Path
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));rr={};g={}
          for w,r,v,x in rows:rr.setdefault((w,int(r)),{})[v]=float(x);g.setdefault((w,v),[]).append(float(x))
          L=['# Final VP8L Huffman allocation confirmation','',f'- baseline: `{os.environ["BASE"]}`',f'- CPU: `{os.environ["CPU"]}`','- hashes + tests/docs/Clippy/fmt/MSRV 1.80.1 passed','','| workload | baseline | candidate | paired median | positive | range |','|---|---:|---:|---:|---:|---:|']
          for w in ('corpus','large'):
            q=[z['base']/z['cand'] for (ww,_),z in sorted(rr.items()) if ww==w];L.append(f'| {w} | {statistics.median(g[w,"base"]):.3f} us | {statistics.median(g[w,"cand"]):.3f} us | {statistics.median(q):.4f}x | {sum(x>1 for x in q)}/{len(q)} | {min(q):.4f}–{max(q):.4f}x |')
          Path('benchmark-vp8l-huffman-allocation-final.md').write_text('\n'.join(L+['']))
          PY
          cat benchmark-vp8l-huffman-allocation-final.md
      - name: Persist
        shell: bash
        run: |
          set -euxo pipefail;git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add benchmark-vp8l-huffman-allocation-final.md;git commit -m 'Record final VP8L Huffman allocation';git push origin HEAD:confirm-vp8l-huffman-allocation-final
