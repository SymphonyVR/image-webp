name: Confirm composed VP8L Huffman allocation changes
on:
  push:
    branches: [confirm-vp8l-huffman-fixed-stack-current]
    paths:
      - .github/workflows/confirm-vp8l-huffman-fixed-stack-current.yml
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y webp
      - name: Build focused confirmation harness
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/SymphonyVR/image-webp/bench-vp8l-huffman-alloc-current/tools/bench_vp8l_huffman_alloc_current.py \
            -o /tmp/confirm.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/confirm.py')
          s=p.read_text()
          s=s.replace("BASE='6f8f7d994e2f747d46621812e01c27a29ff4be4a'", "BASE='c52de05b9c902a6743941b998c96d5e4d3ba3609'")
          s=s.replace("VS=('base','fixedgroup','stack19','sort512','all')", "VS=('base','fixedgroup','stack19','both')")
          s=s.replace("if v in ('stack19','all'):", "if v in ('stack19','both'):")
          s=s.replace("if v in ('fixedgroup','all'):", "if v in ('fixedgroup','both'):")
          s=s.replace("for n in range(17):", "for n in range(25):")
          s=s.replace("benchmark-vp8l-huffman-alloc-current.md", "benchmark-vp8l-huffman-fixed-stack-current.md")
          s=s.replace("# VP8L Huffman allocation current-final matrix", "# VP8L fixed-group + stack19 current-final confirmation")
          needle="""        assert old in m;m=m.replace(old,new,1)\n    if v in ('sort512','all'):\n"""
          insertion="""        assert old in m;m=m.replace(old,new,1)\n        old_sig='''        code_length_code_lengths: Vec<u16>,\n        num_symbols: u16,\n    ) -> Result<Vec<u16>, DecodingError> {'''\n        new_sig='''        code_length_code_lengths: &[u16],\n        num_symbols: u16,\n    ) -> Result<Vec<u16>, DecodingError> {'''\n        assert old_sig in m;m=m.replace(old_sig,new_sig,1)\n        old_call='self.read_huffman_code_lengths(code_length_code_lengths, alphabet_size)?;'\n        new_call='self.read_huffman_code_lengths(&code_length_code_lengths, alphabet_size)?;'\n        assert old_call in m;m=m.replace(old_call,new_call,1)\n    if v in ('sort512','all'):\n"""
          assert needle in s
          s=s.replace(needle,insertion,1)
          p.write_text(s)
          PY
      - run: python3 /tmp/confirm.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-huffman-fixed-stack-current.md
          git commit -m 'Record composed Huffman allocation confirmation'
          git push origin HEAD:confirm-vp8l-huffman-fixed-stack-current
