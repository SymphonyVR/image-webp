name: Strict VP8L packed predictor confirmation
on:
  push:
    branches: [confirm-vp8l-packed-predictors]
    paths: [tools/bench_vp8l_predictor_closure.py, tools/confirm_vp8l_packed_predictors.py, .github/workflows/confirm-vp8l-packed-predictors.yml]
permissions: { contents: write }
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: python3 tools/confirm_vp8l_packed_predictors.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-packed-predictor-confirm.md
          git commit -m 'Record strict VP8L packed predictor confirmation'
          git push origin HEAD:confirm-vp8l-packed-predictors
