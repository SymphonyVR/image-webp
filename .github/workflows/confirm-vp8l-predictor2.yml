name: Confirm VP8L predictor-2 pixels
on:
  push:
    branches: [ bench-vp8l-predictor2-confirm ]
    paths: [ .github/workflows/confirm-vp8l-predictor2.yml ]
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Benchmark fixed refs
        shell: bash
        run: |
          set -euxo pipefail
          BASE=00c9bf309f8286509832948a67d4fbcdb2933adc
          CAND=ed5c9031dae06cff8c3bdce6a27290778262d2c3
          echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/base "$BASE";git worktree add --detach /tmp/cand "$CAND"
          cat >/tmp/bench.rs <<'RS'
          use image_webp::WebPDecoder;use std::{hint::black_box,io::Cursor,time::Instant};
          fn hash(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();b.iter().fold(1469598103934665603u64,|h,&z|(h^z as u64).wrapping_mul(1099511628211))}
          fn dec(d:&[u8])->u64{let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();black_box(b[0]as u64^((b[b.len()/2]as u64)<<8)^((b[b.len()-1]as u64)<<16))}
          fn main(){let mut a=std::env::args().skip(1);let mode=a.next().unwrap();let n:usize=a.next().unwrap().parse().unwrap();let ps:Vec<_>=a.collect();let ds:Vec<Vec<u8>>=ps.iter().map(std::fs::read).collect::<Result<_,_>>().unwrap();if mode=="hash"{for d in &ds{println!("{:016x}",hash(d))}return}for d in &ds{black_box(dec(d));}let t=Instant::now();let mut s=0;for _ in 0..n{for d in &ds{s^=dec(d)}}black_box(s);println!("{:.3}",t.elapsed().as_secs_f64()*1e6/(n*ds.len())as f64)}
          RS
          python3 - <<'PY' >/tmp/files.txt
          from pathlib import Path
          def chunks(d):
            if len(d)<12 or d[:4]!=b'RIFF' or d[8:12]!=b'WEBP':return []
            o=[];p=12
            while p+8<=len(d):f=d[p:p+4];n=int.from_bytes(d[p+4:p+8],'little');o.append(f);p+=8+n+(n&1)
            return o
          for p in sorted(Path('/tmp/base/tests/images').rglob('*.webp')):
            c=chunks(p.read_bytes())
            if b'VP8L' in c and b'ANIM' not in c:print(p)
          PY
          for d in /tmp/base /tmp/cand;do mkdir -p "$d/examples";cp /tmp/bench.rs "$d/examples/p2c.rs";(cd "$d"&&cargo build --release --example p2c);done
          mapfile -t BF </tmp/files.txt;CF=();for p in "${BF[@]}";do CF+=("${p/\/tmp\/base/\/tmp\/cand}");done;B=/tmp/base/target/release/examples/p2c;C=/tmp/cand/target/release/examples/p2c
          diff -u <($B hash 1 "${BF[@]}") <($C hash 1 "${CF[@]}")
          : >/tmp/r.tsv
          for r in {1..21};do if ((r%2));then o='base cand';else o='cand base';fi;for v in $o;do if [[ $v == base ]];then x=$B;f=("${BF[@]}");else x=$C;f=("${CF[@]}");fi;u=$(taskset -c 0 "$x" bench 180 "${f[@]}");printf '%s\t%s\t%s\n' "$r" "$v" "$u">>/tmp/r.tsv;done;done
      - name: Persist
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,statistics,os,pathlib
          rows=list(csv.reader(open('/tmp/r.tsv'),delimiter='\t'));g={'base':[],'cand':[]};rr={}
          for r,v,x in rows:g[v].append(float(x));rr.setdefault(int(r),{})[v]=float(x)
          p=[z['base']/z['cand'] for _,z in sorted(rr.items())]
          L=['# VP8L predictor-2 confirmation','',f'- CPU: `{os.environ["CPU"]}`','- hashes match; 21 alternating paired rounds','', '| baseline | candidate | paired median | range |','|---:|---:|---:|---:|',f'| {statistics.median(g["base"]):.3f} us | {statistics.median(g["cand"]):.3f} us | {statistics.median(p):.4f}x | {min(p):.4f}–{max(p):.4f}x |','']
          pathlib.Path('benchmark-vp8l-predictor2-confirm.md').write_text('\n'.join(L))
          PY
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add benchmark-vp8l-predictor2-confirm.md;git commit -m 'Record VP8L predictor-2 confirmation';git push origin HEAD:bench-vp8l-predictor2-confirm
