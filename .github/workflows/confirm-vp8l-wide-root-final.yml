name: Confirm VP8L wide root final
on:
  push:
    branches: [confirm-vp8l-wide-root-final]
    paths: [.github/workflows/confirm-vp8l-wide-root-final.yml]
permissions: { contents: write }
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - run: python3 tools/confirm_vp8l_wide_root_final.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-vp8l-wide-root-confirm-final.md
          git commit -m 'Record VP8L wide-root confirmation'
          git push origin HEAD:confirm-vp8l-wide-root-final
