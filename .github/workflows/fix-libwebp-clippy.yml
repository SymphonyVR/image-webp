name: Fix libwebp coefficient candidate clippy
on:
  push:
    branches: [ bench-dct-value-fused-v2 ]
    paths: [ .github/workflows/fix-libwebp-clippy.yml ]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch benchmark generator
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/bench-libwebp-coeff-structure.yml')
          s=p.read_text()
          needle="          marker = '    // This is generic and inlined just to skip the first bounds check.\\n'\n"
          insert=r'''          dead_methods = [
              "    // Do not inline this because inlining seems to worsen performance.\\n    #[inline(never)]\\n    pub(crate) fn read_sign(&mut self) -> BitResult<bool> {\\n        if let Some(b) = self.fast().read_sign() {\\n            return BitResult::ok(b);\\n        }\\n\\n        self.cold_read_flag()\\n    }\\n\\n",
              "    fn read_sign(mut self) -> Option<bool> {\\n        let value = self.fast_read_sign();\\n        self.commit_if_valid(value)\\n    }\\n\\n",
          ]
          for dead in dead_methods:
              if dead not in s:
                  raise SystemExit('obsolete sign wrapper marker missing')
              s = s.replace(dead, '', 1)

'''
          if needle not in s:
              raise SystemExit('insertion marker missing')
          p.write_text(s.replace(needle,insert+needle,1))
          PY
          git add .github/workflows/bench-libwebp-coeff-structure.yml
          git commit -m 'Remove obsolete sign wrappers in coefficient candidate'
          git push origin HEAD:bench-dct-value-fused-v2