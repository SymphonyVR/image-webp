name: Fix VP8L LZ matrix MSRV setup
on:
  push:
    branches: [ bench-vp8l-lz-matrix ]
    paths: [ .github/workflows/fix-vp8l-lz-matrix-msrv.yml ]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert MSRV setup and retrigger matrix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/bench-vp8l-lz-matrix.yml')
          s=p.read_text()
          marker='''      - uses: dtolnay/rust-toolchain@stable\n      - name: Build variants and corpus\n'''
          repl='''      - uses: dtolnay/rust-toolchain@stable\n      - name: Install MSRV\n        run: rustup toolchain install 1.80.1 --profile minimal\n      - name: Build variants and corpus\n'''
          if marker not in s:
              raise SystemExit('matrix marker missing')
          p.write_text(s.replace(marker,repl,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/bench-vp8l-lz-matrix.yml
          git commit -m 'Install MSRV for VP8L LZ matrix'
          git push
