name: Materialize alpha fusion on current optimized tree
on:
  push:
    branches: [ candidate-alpha-sparse-current ]
    paths: [ .github/workflows/materialize-alpha-sparse-current.yml ]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply exact tested alpha source commit
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git cherry-pick efd50f244c0e232ea7bebc8624d8fe071a100ce5
      - name: Verify
        shell: bash
        run: |
          set -euxo pipefail
          cargo test -v
          cargo doc -v
          cargo clippy --all-features -- -D warnings
          cargo fmt -- --check
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 build -v
      - name: Publish source-only candidate
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/workflows/materialize-alpha-sparse-current.yml
          git commit -m 'Write alpha during lossy RGBA conversion'
          git push origin HEAD:candidate-alpha-sparse-current
