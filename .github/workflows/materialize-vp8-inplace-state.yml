name: Materialize in-place VP8 arithmetic state updates
on:
  push:
    branches: [ candidate-vp8-inplace-state ]
    paths: [ .github/workflows/materialize-vp8-inplace-state.yml ]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply and verify
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply_vp8_inplace_state.py
          cargo fmt
          git diff --check
          cargo test -v
          cargo doc -v
          cargo clippy --all-features -- -D warnings
          cargo fmt -- --check
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 build -v
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossy/arithmetic_decoder.rs
          git commit -m 'Update VP8 arithmetic state in place'
          git rm .github/workflows/materialize-vp8-inplace-state.yml .github/scripts/apply_vp8_inplace_state.py
          git commit -m 'Finalize in-place VP8 arithmetic state candidate'
          git push origin HEAD:candidate-vp8-inplace-state
