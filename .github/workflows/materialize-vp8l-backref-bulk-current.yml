name: Materialize current VP8L bulk backreference candidate
on:
  push:
    branches: [ candidate-vp8l-backref-bulk-current ]
    paths: [ .github/workflows/materialize-vp8l-backref-bulk-current.yml ]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossless/decoder/mod.rs');s=p.read_text()
          old='''                if dist == 1 {\n                    let value: [u8; 4] = data[(index - dist) * 4..][..4].try_into().unwrap();\n                    for i in 0..length {\n                        data[index * 4 + i * 4..][..4].copy_from_slice(&value);\n                    }\n                } else {\n                    if index + length + 3 <= num_values {\n'''
          new='''                if dist == 1 {\n                    let value: [u8; 4] = data[(index - dist) * 4..][..4].try_into().unwrap();\n                    for i in 0..length {\n                        data[index * 4 + i * 4..][..4].copy_from_slice(&value);\n                    }\n                } else if dist >= length {\n                    let source_start = (index - dist) * 4;\n                    let destination_start = index * 4;\n                    let byte_len = length * 4;\n                    let (before_destination, destination) = data.split_at_mut(destination_start);\n                    destination[..byte_len].copy_from_slice(\n                        &before_destination[source_start..source_start + byte_len],\n                    );\n                } else {\n                    if index + length + 3 <= num_values {\n'''
          if old not in s: raise SystemExit('backref marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/mod.rs
          git commit -m 'Bulk-copy non-overlapping VP8L backreferences'
          git push origin HEAD:candidate-vp8l-backref-bulk-current
