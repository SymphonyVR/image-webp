name: Materialize current VP8L cache hash optimization
on:
  push:
    branches: [materialize-vp8l-cache-hash-current]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - name: Patch and validate source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lossless/decoder/mod.rs')
          s = p.read_text()
          old = "        let [r, g, b, a] = color;\n        let color_u32 =\n            (u32::from(r) << 16) | (u32::from(g) << 8) | (u32::from(b)) | (u32::from(a) << 24);\n"
          new = "        let [r, g, b, a] = color;\n        let color_u32 = u32::from_be_bytes([a, r, g, b]);\n"
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt
          git diff --check
          cargo test -q
          cargo test --release -q
          cargo doc --no-deps -q
          cargo clippy -- -D warnings
          cargo fmt -- --check
          cargo +1.80.1 build -q
          cargo +1.80.1 build --release -q
      - name: Persist source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/mod.rs
          git commit -m "Use native byte assembly for VP8L cache hashing"
          git push origin HEAD:materialize-vp8l-cache-hash-current
