name: Materialize current VP8L cache-tail candidate
on:
  push:
    branches: [ candidate-vp8l-cache-tail-current ]
    paths: [ .github/workflows/materialize-vp8l-cache-tail-current.yml ]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossless/decoder/mod.rs');s=p.read_text()
          old='''                    if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                        for pixel in data[index * 4..][..length * 4].chunks_exact(4) {\n                            color_cache.insert(pixel.try_into().unwrap());\n                        }\n                    }\n'''
          new='''                    if let Some(color_cache) = huffman_info.color_cache.as_mut() {\n                        // The cache is unobservable while a backreference is copied. For an\n                        // overlapping copy, output is periodic with period `dist`, so only the\n                        // final occurrence of each phase is needed to reproduce the final cache.\n                        let cache_pixels = length.min(dist);\n                        let cache_start = index + length - cache_pixels;\n                        for pixel in data[cache_start * 4..][..cache_pixels * 4].chunks_exact(4) {\n                            color_cache.insert(pixel.try_into().unwrap());\n                        }\n                    }\n'''
          if old not in s: raise SystemExit('cache marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/mod.rs
          git commit -m 'Trim redundant VP8L backreference cache updates'
          git push origin HEAD:candidate-vp8l-cache-tail-current
