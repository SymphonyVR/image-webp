name: Materialize VP8L color/green fusion
on:
  push:
    branches: [ candidate-vp8l-color-green-fusion ]
    paths: [ .github/workflows/materialize-vp8l-color-green-fusion.yml ]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply and publish source candidate
        shell: bash
        run: |
          set -euxo pipefail
          cp .github/scripts/apply_vp8l_color_green_fusion.py /tmp/apply.py
          cp .github/scripts/fix_vp8l_color_green_fusion.py /tmp/fix.py
          python3 /tmp/apply.py
          python3 /tmp/fix.py
          cargo fmt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/reverse_transform.rs src/lossless/decoder/mod.rs
          git commit -m 'Fuse adjacent VP8L color transforms'
          git push origin HEAD:candidate-vp8l-color-green-fusion
      - name: Verify stable and MSRV
        shell: bash
        run: |
          set -euxo pipefail
          cargo test -v
          cargo doc -v
          cargo clippy --all-features -- -D warnings
          cargo fmt -- --check
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 build -v
