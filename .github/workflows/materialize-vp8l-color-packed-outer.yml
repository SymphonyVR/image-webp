name: Materialize packed VP8L inverse color
on:
  push:
    branches: [materialize-vp8l-color-packed-outer]
    paths: [tools/apply_vp8l_color_packed_outer.py, .github/workflows/materialize-vp8l-color-packed-outer.yml]
permissions: { contents: write }
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: python3 tools/apply_vp8l_color_packed_outer.py
      - run: cargo fmt
      - run: cargo test
      - run: cargo doc --no-deps
      - run: cargo clippy -- -D warnings
      - run: cargo fmt -- --check
      - run: cargo +1.80.1 build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/reverse_transform.rs
          git commit -m 'Pack VP8L inverse color arithmetic'
          git push origin HEAD:materialize-vp8l-color-packed-outer
