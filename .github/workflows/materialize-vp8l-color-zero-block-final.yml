name: Materialize verified VP8L zero color block optimization
on:
  push:
    branches: [materialize-vp8l-color-zero-block-final]
    paths: [.github/workflows/materialize-vp8l-color-zero-block-final.yml]
permissions: { contents: write }
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - run: rustup toolchain install 1.80.1 --profile minimal
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossless/decoder/reverse_transform.rs');s=p.read_text()
          marker='            let green_to_red = transform[2];\n'
          pos=s.index(marker, s.index('pub(crate) fn apply_color_transform(')) + len(marker)
          guard='''

            if red_to_blue == 0 && green_to_blue == 0 && green_to_red == 0 {
                continue;
            }'''
          assert 'if red_to_blue == 0 && green_to_blue == 0 && green_to_red == 0' not in s
          p.write_text(s[:pos]+guard+s[pos:])
          PY
          cargo fmt
          git diff --check
      - name: Validate
        run: |
          cargo test -q
          cargo test --release -q
          cargo doc --no-deps -q
          cargo clippy -- -D warnings
          cargo fmt -- --check
          cargo +1.80.1 build -q
          cargo +1.80.1 build --release -q
      - name: Persist source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/reverse_transform.rs
          git commit -m 'Skip zero-coefficient VP8L color blocks'
          git push origin HEAD:materialize-vp8l-color-zero-block-final
