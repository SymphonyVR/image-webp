name: Materialize packed VP8L subtract-green optimization
on:
  push:
    branches: [materialize-vp8l-green-current]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - name: Patch and validate source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossless/decoder/reverse_transform.rs')
          s=p.read_text()
          a=s.index('pub(crate) fn apply_subtract_green_transform(')
          b=s.index('\npub(crate) fn apply_color_indexing_transform(',a)
          new='''pub(crate) fn apply_subtract_green_transform(image_data: &mut [u8]) {
    for pixel in image_data.chunks_exact_mut(4) {
        let value = u32::from_le_bytes(pixel.try_into().unwrap());
        let green = (value >> 8) & 0xff;
        let red_blue =
            ((value & 0x00ff_00ff).wrapping_add(green | (green << 16))) & 0x00ff_00ff;
        pixel.copy_from_slice(&((value & 0xff00_ff00) | red_blue).to_le_bytes());
    }
}
'''
          p.write_text(s[:a]+new+s[b:])
          PY
          cargo fmt
          git diff --check
          cargo test -q
          cargo test --release -q
          cargo doc --no-deps -q
          cargo clippy -- -D warnings
          cargo fmt -- --check
          cargo +1.80.1 build -q
          cargo +1.80.1 build --release -q
      - name: Persist source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/reverse_transform.rs
          git commit -m 'Pack VP8L subtract-green arithmetic'
          git push origin HEAD:materialize-vp8l-green-current
