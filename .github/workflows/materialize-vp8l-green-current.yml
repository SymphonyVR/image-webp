name: Materialize packed VP8L subtract-green optimization
on:
  push:
    branches: [materialize-vp8l-green-current]
    paths:
      - tools/materialize_vp8l_green_current.py
      - .github/workflows/materialize-vp8l-green-current.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - name: Patch and validate source
        run: |
          python3 tools/materialize_vp8l_green_current.py
          cargo fmt
          git diff --check
          cargo test -q
          cargo test --release -q
          cargo doc --no-deps -q
          cargo clippy -- -D warnings
          cargo fmt -- --check
          cargo +1.80.1 build -q
          cargo +1.80.1 build --release -q
      - name: Persist source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/reverse_transform.rs
          git commit -m 'Pack VP8L subtract-green arithmetic'
          git push origin HEAD:materialize-vp8l-green-current
