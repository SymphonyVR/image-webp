name: Materialize VP8L group-static root source
on:
  push:
    branches: [materialize-vp8l-group-root-source]
    paths:
      - .github/workflows/materialize-vp8l-group-root-source.yml
permissions: { contents: write }
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: rustup toolchain install 1.80.1 --profile minimal
      - name: Materialize candidate
        run: |
          python3 tools/materialize_vp8l_group_huffman.py
          python3 tools/materialize_vp8l_group_parse.py
          python3 tools/materialize_vp8l_group_decode.py
          cargo fmt
          git diff --check
      - name: Validate
        run: |
          cargo test -q
          cargo test --release -q
          cargo doc --no-deps -q
          cargo clippy -- -D warnings
          cargo +1.80.1 build -q
          cargo +1.80.1 build --release -q
      - name: Persist source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/mod.rs src/lossless/decoder/huffman.rs
          git commit -m 'Materialize VP8L group-static roots'
          git push origin HEAD:materialize-vp8l-group-root-source
