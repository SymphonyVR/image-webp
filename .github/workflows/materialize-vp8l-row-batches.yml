name: Materialize VP8L row-batched inverse transforms
on:
  push:
    branches: [ candidate-vp8l-row-batches ]
    paths: [ .github/workflows/materialize-vp8l-row-batches.yml ]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply_vp8l_row_batches.py
          cargo fmt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/mod.rs src/lossless/decoder/reverse_transform.rs
          git commit -m 'Batch VP8L inverse transforms by rows'
      - name: Verify
        shell: bash
        run: |
          set -euxo pipefail
          cargo test -v
          cargo doc -v
          cargo clippy --all-features -- -D warnings
          cargo fmt -- --check
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 build -v
      - name: Publish source-only candidate
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/workflows/materialize-vp8l-row-batches.yml .github/scripts/apply_vp8l_row_batches.py
          git commit -m 'Finalize row-batched VP8L inverse transforms'
          git push origin HEAD:candidate-vp8l-row-batches
