name: Materialize VP8L trivial literals
on:
  push:
    branches: [ candidate-vp8l-trivial-literals ]
    paths: [ .github/workflows/materialize-vp8l-trivial-literals.yml ]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply and publish source candidate
        shell: bash
        run: |
          set -euxo pipefail
          cp .github/scripts/apply_vp8l_trivial_literals.py /tmp/apply.py
          python3 /tmp/apply.py
          cargo fmt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/huffman.rs src/lossless/decoder/mod.rs
          git commit -m 'Reuse trivial VP8L literal channels'
          git push origin HEAD:candidate-vp8l-trivial-literals
      - name: Verify stable and MSRV
        shell: bash
        run: |
          set -euxo pipefail
          cargo test -v
          cargo doc -v
          cargo clippy --all-features -- -D warnings
          cargo fmt -- --check
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 build -v
