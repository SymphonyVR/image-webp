name: Materialize VP8L wide root candidate
on:
  push:
    branches: [vp8l-wide-root-candidate]
    paths: [.github/workflows/materialize-vp8l-wide-root-candidate.yml]
permissions: { contents: write }
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - run: rustup toolchain install 1.80.1 --profile minimal
      - run: |
          python3 tools/materialize_vp8l_wide_root_candidate.py
          cargo fmt
          git diff --check
          cargo test -q
          cargo doc -q
          cargo clippy --all-features -- -D warnings
          cargo fmt -- --check
          cargo +1.80.1 build -q
          cargo +1.80.1 test -q
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/huffman.rs
          git commit -m 'Select wider VP8L Huffman roots for dense trees'
          git rm tools/materialize_vp8l_wide_root_candidate.py .github/workflows/materialize-vp8l-wide-root-candidate.yml
          git commit -m 'Remove VP8L wide-root staging files'
          git push origin HEAD:vp8l-wide-root-candidate
