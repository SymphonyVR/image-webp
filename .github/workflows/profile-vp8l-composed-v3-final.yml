name: Profile clean VP8L composed v3 final
on:
  push:
    branches: [profile-vp8l-composed-v3-final]
    paths: [.github/workflows/profile-vp8l-composed-v3-final.yml]
permissions: { contents: write }
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and profile exact final source
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq; sudo apt-get install -y valgrind >/dev/null
          mkdir -p examples
          cat >examples/profile_vp8l_final.rs <<'RS'
          use image_webp::WebPDecoder;
          use std::{hint::black_box,io::Cursor};
          fn main(){let p=std::env::args().nth(1).unwrap();let d=std::fs::read(p).unwrap();let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();black_box(b[b.len()/2]);}
          RS
          CARGO_PROFILE_RELEASE_DEBUG=2 RUSTFLAGS='-C force-frame-pointers=yes' cargo build --release --example profile_vp8l_final
          INPUT=tests/images/gallery2/3_webp_ll.webp
          taskset -c 0 valgrind --tool=callgrind --collect-jumps=yes --callgrind-out-file=/tmp/v.callgrind target/release/examples/profile_vp8l_final "$INPUT"
          callgrind_annotate --inclusive=no --threshold=0.01 --auto=yes /tmp/v.callgrind > /tmp/annotated.txt
      - name: Persist symbolic profile
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import pathlib
          text=pathlib.Path('/tmp/annotated.txt').read_text(errors='replace')
          interesting=[]
          for line in text.splitlines():
              if 'PROGRAM TOTALS' in line or 'image_webp::' in line or 'src/lossless/' in line:
                  interesting.append(line)
              elif interesting and len(interesting)<280 and line.strip() and any(k in line for k in ('read_symbol','decode_image','color_cache','copy_within','predictor','insert','consume','fill','color_transform')):
                  interesting.append(line)
          out=['# Final VP8L composed-v3 symbolic Callgrind profile','', '- candidate source: `4cd194935d100a09acf24eb24d8c1343c7844844`','- fixture: `tests/images/gallery2/3_webp_ll.webp` (800x600)','- release + full debuginfo, CPU 0','','```text']+interesting[:280]+['```','','## Stop-rule assessment','','The exhaustive sweep has already tested entropy decode, Huffman construction/layout, color cache, LZ copy mechanics, inverse-color kernels, predictor kernels, palette/subtract-green, input staging, output stores, distance decoding, and transform batching. No new optimization is opened unless this final profile exposes a distinct >=2% mechanism outside those closed families.']
          pathlib.Path('profile-vp8l-composed-v3-final.md').write_text('\n'.join(out))
          PY
          rm -f examples/profile_vp8l_final.rs
          cat profile-vp8l-composed-v3-final.md
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-vp8l-composed-v3-final.md; git commit -m 'Record final composed VP8L symbolic profile'; git push origin HEAD:profile-vp8l-composed-v3-final
