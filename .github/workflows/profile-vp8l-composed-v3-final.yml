name: Profile clean VP8L composed v3 final
on:
  push:
    branches: [profile-vp8l-composed-v3-final]
    paths: [.github/workflows/profile-vp8l-composed-v3-final.yml]
permissions: { contents: write }
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind unzip curl
      - name: Build profiled decoder
        run: |
          cat > examples/profile_decode.rs <<'RS'
          use image_webp::WebPDecoder;
          use std::{hint::black_box, io::Cursor};
          fn main() {
              let p=std::env::args().nth(1).unwrap();
              let d=std::fs::read(p).unwrap();
              for _ in 0..3 {
                  let mut q=WebPDecoder::new(Cursor::new(&d)).unwrap();
                  let mut b=vec![0;q.output_buffer_size().unwrap()];
                  q.read_image(&mut b).unwrap(); black_box(b);
              }
          }
          RS
          RUSTFLAGS='-C debuginfo=2' cargo build --release --example profile_decode
          mkdir -p /tmp/issue119
          curl -L --fail --retry 3 -o /tmp/sample.zip https://github.com/user-attachments/files/17482915/sample.zip
          unzip -q /tmp/sample.zip -d /tmp/issue119
          find /tmp/issue119 -type f -iname '*.webp' | head -1 > /tmp/input_path
      - name: Callgrind
        run: |
          INPUT=$(cat /tmp/input_path)
          valgrind --tool=callgrind --callgrind-out-file=/tmp/cg ./target/release/examples/profile_decode "$INPUT"
          callgrind_annotate --inclusive=yes --auto=yes /tmp/cg > /tmp/annot.txt
          callgrind_annotate --inclusive=no --auto=no --show=Ir /tmp/cg src/lossless/decoder/mod.rs > /tmp/mod.txt || true
          callgrind_annotate --inclusive=no --auto=no --show=Ir /tmp/cg src/lossless/decoder/reverse_transform.rs > /tmp/rev.txt || true
          callgrind_annotate --inclusive=no --auto=no --show=Ir /tmp/cg src/lossless/decoder/huffman.rs > /tmp/huff.txt || true
      - name: Summarize
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess
          total=None
          text=pathlib.Path('/tmp/annot.txt').read_text(errors='ignore')
          m=re.search(r'([0-9,]+) \(100\.0%\)  PROGRAM TOTALS',text)
          if m: total=int(m.group(1).replace(',',''))
          if total is None:
              m=re.search(r'Ir\s*\n-+\n\s*([0-9,]+)',text)
              if m: total=int(m.group(1).replace(',',''))
          files={n:pathlib.Path('/tmp/'+n+'.txt').read_text(errors='ignore') for n in ('mod','rev','huff')}
          def line_counts(t):
              out={}
              for line in t.splitlines():
                  m=re.match(r'\s*([0-9,]+)\s+.*?:(\d+)\s',line)
                  if m: out[int(m.group(2))]=out.get(int(m.group(2)),0)+int(m.group(1).replace(',',''))
              return out
          # Function summary from inclusive annotation is more robust than source line parsing.
          funcs=[]
          for line in text.splitlines():
              if 'image_webp' not in line: continue
              m=re.match(r'\s*([0-9,]+)\s+\([^)]*\)\s+(.*)',line)
              if m: funcs.append((int(m.group(1).replace(',','')),m.group(2).strip()))
          funcs.sort(reverse=True)
          # classify by demangled/function text from inclusive list; overlapping inclusive totals are not summed.
          wanted=['decode_image_data','apply_color_transform','apply_predictor_transform','read_huffman_code','ColorCache','BitReader','apply_color_indexing_transform','apply_subtract_green_transform']
          top=[]
          for ir,name in funcs:
              if any(w in name for w in wanted): top.append((ir,name))
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          L=['# Final VP8L composed-v3 profile','',f'- candidate: `{sha}`',f'- workload: issue #119 VP8L sample, 3 decodes under Callgrind',f'- total instructions: **{total:,}**' if total else '- total instructions: unavailable','','## Relevant inclusive functions','','| Ir | % total | function |','|---:|---:|---|']
          seen=set()
          for ir,name in top:
              key=name.split('::h')[0]
              if key in seen: continue
              seen.add(key)
              pct=100*ir/total if total else 0
              L.append(f'| {ir:,} | {pct:.2f}% | `{name}` |')
              if len(seen)>=25: break
          L+=['','## Stop-rule assessment','','The prior exhaustive sweep has already tested the entropy loop, Huffman construction/layout, color cache, LZ copy engine, inverse-color kernels, predictor kernels, palette/subtract-green, input staging, and transform batching families. Any remaining >=2% function in one of those families is classified as an already-closed family unless this profile exposes a distinct bounded mechanism.']
          pathlib.Path('profile-vp8l-composed-v3-final.md').write_text('\n'.join(L)+'\n')
          print('\n'.join(L))
          PY
      - run: |
          rm -f examples/profile_decode.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-vp8l-composed-v3-final.md
          git commit -m 'Record final composed VP8L profile' || true
          git push origin HEAD:profile-vp8l-composed-v3-final
