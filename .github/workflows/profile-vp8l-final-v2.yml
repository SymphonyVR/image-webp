name: Profile final VP8L tree with symbols
on:
  push:
    branches: [ profile-vp8l-final-v2 ]
    paths: [ .github/workflows/profile-vp8l-final-v2.yml ]
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and profile
        shell: bash
        run: |
          set -euxo pipefail
          echo "BASE=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          echo "CPU=$(lscpu|sed -n 's/^Model name:[[:space:]]*//p')" >> "$GITHUB_ENV"
          sudo apt-get update -qq;sudo apt-get install -y valgrind >/dev/null
          mkdir -p examples
          cat >examples/profile_vp8l_final.rs <<'RS'
          use image_webp::WebPDecoder;
          use std::{hint::black_box,io::Cursor};
          fn main(){let p=std::env::args().nth(1).unwrap();let d=std::fs::read(p).unwrap();let mut x=WebPDecoder::new(Cursor::new(d)).unwrap();let mut b=vec![0;x.output_buffer_size().unwrap()];x.read_image(&mut b).unwrap();black_box(b[b.len()/2]);}
          RS
          CARGO_PROFILE_RELEASE_DEBUG=2 RUSTFLAGS='-C force-frame-pointers=yes' cargo build --release --example profile_vp8l_final
          INPUT=tests/images/gallery2/3_webp_ll.webp
          taskset -c 0 valgrind --tool=callgrind --collect-jumps=yes --callgrind-out-file=/tmp/v.callgrind target/release/examples/profile_vp8l_final "$INPUT"
          callgrind_annotate --inclusive=no --threshold=0.01 --auto=yes /tmp/v.callgrind > /tmp/annotated.txt
      - name: Persist profile
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os,pathlib
          text=pathlib.Path('/tmp/annotated.txt').read_text(errors='replace')
          interesting=[]
          capture=False
          for line in text.splitlines():
              if 'PROGRAM TOTALS' in line or 'image_webp::' in line or 'src/lossless/' in line:
                  interesting.append(line)
              elif interesting and len(interesting)<240 and line.strip() and any(k in line for k in ('read_symbol','decode_image','color_cache','copy_within','predictor','insert','consume','fill')):
                  interesting.append(line)
          out=['# Final-tree VP8L symbolic Callgrind profile','',f'- baseline: `{os.environ["BASE"]}`',f'- CPU: `{os.environ["CPU"]}`','- fixture: `tests/images/gallery2/3_webp_ll.webp` (800x600)','- release + full debuginfo, CPU 0','','```text']+interesting[:240]+['```','']
          pathlib.Path('profile-vp8l-final-v2.md').write_text('\n'.join(out))
          PY
          cat profile-vp8l-final-v2.md
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-vp8l-final-v2.md;git commit -m 'Record final VP8L symbolic profile';git push origin HEAD:profile-vp8l-final-v2
