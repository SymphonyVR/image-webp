name: Promote confirmed loop-filter inlining
on:
  push:
    branches: [ performance-optimizations ]
    paths: [ .github/workflows/promote-loop-filter-inline.yml ]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply measured source change
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lossy/loop_filter.rs')
          s=p.read_text()
          a='fn common_adjust_horizontal(use_outer_taps: bool, pixels: &mut [u8]) -> i32 {'
          b='fn should_filter_horizontal(interior_limit: u8, edge_limit: u8, pixels: &[u8]) -> bool {'
          if '#[inline]\n'+a not in s:
              if a not in s: raise SystemExit('common_adjust_horizontal marker missing')
              s=s.replace(a, '#[inline]\n'+a, 1)
          if '#[inline]\n'+b not in s:
              if b not in s: raise SystemExit('should_filter_horizontal marker missing')
              s=s.replace(b, '#[inline]\n'+b, 1)
          p.write_text(s)
          PY
          cargo fmt -- --check
          cargo test -v
          cargo doc -v
          cargo clippy --all-features -- -D warnings
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 build -v
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/promote-loop-filter-inline.yml
          git add src/lossy/loop_filter.rs
          git commit -m 'Inline horizontal VP8 loop-filter helpers'
          git push origin HEAD:performance-optimizations
