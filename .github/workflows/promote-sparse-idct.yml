name: Promote confirmed sparse VP8 IDCT
on:
  push:
    branches: [ performance-optimizations ]
    paths: [ .github/workflows/promote-sparse-idct.yml ]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy,rustfmt }
      - name: Apply confirmed source patch
        shell: bash
        run: |
          set -euxo pipefail
          git diff --binary 13448c6a17180ee9939154b052dd70b44cd1729c 97c58735c03c72e8d7f54bcdfdd9a91276392b15 -- src/lossy/mod.rs src/lossy/transform.rs >/tmp/sparse.patch
          git apply --check /tmp/sparse.patch
          git apply /tmp/sparse.patch
          cargo fmt -- --check
          cargo test -v
          cargo doc -v
          cargo clippy --all-features -- -D warnings
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 build -v
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/promote-sparse-idct.yml
          git add src/lossy/mod.rs src/lossy/transform.rs
          git commit -m 'Specialize sparse VP8 inverse transforms'
          git push origin HEAD:performance-optimizations
