name: Publish VP8L row-batch source
on:
  push:
    branches: [ candidate-vp8l-row-batches ]
    paths: [ .github/workflows/publish-vp8l-row-batch-source.yml ]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - name: Generate and publish source
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply_vp8l_row_batches.py
          cargo fmt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lossless/decoder/mod.rs src/lossless/decoder/reverse_transform.rs
          git commit -m 'Batch VP8L inverse transforms by rows'
          git push origin HEAD:candidate-vp8l-row-batches
