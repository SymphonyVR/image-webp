name: Scorecard main vs clean VP8L composed v3
on:
  push:
    branches: [scorecard-main-vs-composed-v3]
    paths:
      - tools/scorecard_main_vs_composed_v3_v2.py
      - .github/workflows/scorecard-main-vs-composed-v3.yml
permissions: { contents: write }
jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp unzip curl
      - run: python3 tools/scorecard_main_vs_composed_v3_v2.py
      - if: always()
        run: |
          if [ -f scorecard-main-vs-composed-v3.md ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add scorecard-main-vs-composed-v3.md
            git commit -m 'Record final main-vs-composed performance scorecard' || true
            git push origin HEAD:scorecard-main-vs-composed-v3
          fi
