name: Verify VP8L group-static roots deeply

on:
  push:
    branches: [verify-vp8l-group-root-deep]
    paths:
      - tools/verify_vp8l_group_root_deep.py
      - .github/workflows/verify-vp8l-group-root-deep.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install 1.80.1 --profile minimal
      - name: Install oracle tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp python3-pil
      - name: Deep differential verification
        run: python3 tools/verify_vp8l_group_root_deep.py
      - if: always()
        name: Persist verification result
        run: |
          if [ -f verification-vp8l-group-root-deep.md ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add verification-vp8l-group-root-deep.md
            git commit -m 'Record deep VP8L group-root verification' || true
            git pull --rebase origin verify-vp8l-group-root-deep
            git push origin HEAD:verify-vp8l-group-root-deep
          fi
