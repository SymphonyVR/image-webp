name: VP8L group-static root hostile validation

on:
  push:
    branches: [verify-vp8l-group-root-hostile]
    paths: [.github/workflows/verify-vp8l-group-root-hostile.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  big-endian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize candidate
        run: |
          python3 tools/materialize_vp8l_group_huffman.py
          python3 tools/materialize_vp8l_group_parse.py
          python3 tools/materialize_vp8l_group_decode.py
          cargo fmt
          git diff --check
      - name: Install cross
        uses: baptiste0928/cargo-install@v1
        with:
          crate: cross
      - run: sudo systemctl start docker
      - name: PowerPC big-endian tests
        run: cross test --target powerpc-unknown-linux-gnu --verbose -v

  minimal-versions-msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize candidate
        run: |
          python3 tools/materialize_vp8l_group_huffman.py
          python3 tools/materialize_vp8l_group_parse.py
          python3 tools/materialize_vp8l_group_decode.py
          cargo fmt
          git diff --check
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo -Zminimal-versions generate-lockfile
      - uses: dtolnay/rust-toolchain@1.80.1
      - run: cargo build -v

  semver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize candidate
        run: |
          python3 tools/materialize_vp8l_group_huffman.py
          python3 tools/materialize_vp8l_group_parse.py
          python3 tools/materialize_vp8l_group_decode.py
          cargo fmt
          git diff --check
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: default-features

  miri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize candidate
        run: |
          python3 tools/materialize_vp8l_group_huffman.py
          python3 tools/materialize_vp8l_group_parse.py
          python3 tools/materialize_vp8l_group_decode.py
          cargo fmt
          git diff --check
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - name: Miri library tests
        run: cargo miri test --lib
