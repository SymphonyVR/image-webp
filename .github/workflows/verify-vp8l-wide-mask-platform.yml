name: Verify VP8L wide-mask platforms
on:
  push:
    branches: [verify-vp8l-wide-mask-final]
    paths: [.github/workflows/verify-vp8l-wide-mask-platform.yml]
jobs:
  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy,rustfmt" }
      - run: cargo test
      - run: cargo test --release
      - run: cargo doc --no-deps
      - run: cargo clippy -- -D warnings
      - run: cargo fmt -- --check
  msrv-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.1
      - name: Validate production library at MSRV without current dev-dependency resolution
        shell: bash
        run: |
          cp Cargo.toml /tmp/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Cargo.toml');s=p.read_text();a=s.index('[dev-dependencies]');b=s.index('[features]');p.write_text(s[:a]+s[b:])
          PY
          cargo build --lib
          cargo build --release --lib
          cp /tmp/Cargo.toml Cargo.toml
